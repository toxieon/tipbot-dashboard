<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/logo.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%230f1420%27/%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%279.5%27%20fill%3D%27none%27%20stroke%3D%27%237b5bff%27%20stroke-width%3D%272.6%27/%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%274%27%20fill%3D%27%235b8cff%27/%3E%3C/svg%3E">
<title>TipBot Dashboard</title>
<script>
/* Theme pre-paint: set data-theme before first paint to avoid a flash (Codex #1). */
(function(){
  try {
    var d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var name=localStorage.getItem('tipbot_theme'),auto=localStorage.getItem('tipbot_theme_auto')==='true';
    var valid=['navy','day','ochre'].indexOf(name)!==-1;
    document.documentElement.dataset.theme=valid&&(!auto||localStorage.getItem('tipbot_theme_manual_date')===day)?name:auto?(d.getHours()>=7&&d.getHours()<19?'day':'navy'):'navy';
    var accent=localStorage.getItem('tipbot_theme_accent');
    if(/^#[0-9a-f]{6}$/i.test(accent||''))document.documentElement.style.setProperty('--accent',accent);
  }catch(e){document.documentElement.dataset.theme='navy';}
}());
</script>
<style>

  /* Global top loading bar */
  #tb-loadbar{
    position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;
    pointer-events:none;opacity:0;transition:opacity .2s;
    background:transparent;
  }
  #tb-loadbar.on{opacity:1}
  #tb-loadbar > i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent,#5b8cff),var(--accent2,#7b5bff),var(--accent,#5b8cff));
    background-size:200% 100%;
    box-shadow:0 0 10px rgba(91,140,255,.55);
    transition:width .25s ease;
  }
  #tb-loadbar.indeterminate > i{
    width:35% !important;
    animation:tb-load-slide 1.1s ease-in-out infinite, tb-load-shimmer 1.4s linear infinite;
  }
  @keyframes tb-load-slide{
    0%{transform:translateX(-120%)}
    100%{transform:translateX(320%)}
  }
  @keyframes tb-load-shimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }
  .tb-loadpanel{text-align:center;max-width:320px;margin:0 auto}
  .tb-loadpanel-label{color:var(--muted);margin:0 0 4px;font-size:14px;min-height:1.3em}
  .tb-loadpanel-bar{
    width:min(280px,70vw);height:8px;border-radius:99px;background:rgba(255,255,255,.08);
    overflow:hidden;margin:16px auto 8px;
  }
  .tb-loadpanel-bar > i{
    display:block;height:100%;width:0%;border-radius:99px;
    background:var(--accent,#5b8cff);
    transition:width .2s ease;
  }
  .tb-loadpanel-pct{
    margin:0;font-size:12px;font-weight:700;color:var(--faint);
    font-variant-numeric:tabular-nums;
  }

  :root{
    --bg:#0b0f1a;--bg2:#0f1420;--card:#151b2b;--card2:#1a2133;--line:#26304a;
    --txt:#eef2fa;--muted:#8a95ad;--faint:#5c6785;
    --accent:#5b8cff;--accent2:#7b5bff;--win:#2eaf62;--loss:#e5595f;--push:#5c6785;--radius:16px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 80% -10%, #182142 0%, var(--bg) 55%) fixed, var(--bg);
       color:var(--txt);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 20px 90px;min-width:0;box-sizing:border-box}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:16px}
  .brand .sub{font-weight:500;color:var(--muted);font-size:12px;margin-left:2px}
  .menu{position:relative}
  .gear{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:17px;color:var(--muted)}
  .gear:hover{color:var(--txt)}
  .dropdown{position:absolute;right:0;top:46px;background:var(--card2);border:1px solid var(--line);border-radius:14px;min-width:220px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:30}
  .dd-item{padding:9px 11px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .dd-item:hover{background:#222c44}
  .dd-label{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 11px 4px}
  .danger{color:var(--loss)}
  .viewas{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,rgba(123,91,255,.18),rgba(91,140,255,.10));border:1px solid #34407a;border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px}
  .viewas b{color:#c9d4ff}
  .link{color:var(--accent);cursor:pointer;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
  .scard:hover{transform:translateY(-2px);border-color:#3a4772;background:var(--card2)}
  .scard .row1{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
  .sname{font-weight:700;font-size:16px}.sgid{color:var(--faint);font-size:12px}
  .plan{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px;text-transform:capitalize}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.on{background:var(--win)}.dot.off{background:var(--push)}
  .mini{display:flex;gap:18px;flex-wrap:wrap}.mini .m{display:flex;flex-direction:column}
  .mini .mv{font-weight:700;font-size:18px}.mini .ml{color:var(--faint);font-size:11px;text-transform:uppercase}
  .pos{color:var(--win)}.neg{color:var(--loss)}
  .back{color:var(--muted);cursor:pointer;font-size:14px;display:inline-flex;gap:6px;margin-bottom:14px}.back:hover{color:var(--txt)}
  .dhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;min-width:0;max-width:100%}
  .dhead h1{margin:0;font-size:24px;min-width:0;overflow-wrap:anywhere}
  .dhead-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;max-width:100%}
  .dhead-actions .ghost,.dhead-actions .btn{
    box-sizing:border-box;min-height:38px;display:inline-flex;align-items:center;justify-content:center;
    padding:8px 12px;font-size:13px;line-height:1.2;white-space:nowrap;
  }
  .dhead-actions .btn.sm{padding:8px 12px;font-size:13px}
  @media(max-width:640px){
    .wrap{padding:16px 14px 90px}
    .dhead{flex-direction:column;align-items:stretch}
    .dhead h1{font-size:20px}
    .dhead-actions{width:100%}
    .top{gap:10px;min-width:0}
    .brand{min-width:0;overflow:hidden}
  }
  html,body{overflow-x:hidden;max-width:100%}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .tile .tv{font-weight:800;font-size:26px;line-height:1.1}.tile .tl{color:var(--faint);font-size:12px;text-transform:uppercase;margin-top:4px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px}
  .panel h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .wlbar{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;background:var(--bg2)}.wlbar>span{display:block}
  .wl-legend{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:7px}.sw{width:10px;height:10px;border-radius:3px}
  .switches{display:flex;gap:12px;flex-wrap:wrap}
  .switch{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 14px}
  .toggle{width:44px;height:25px;border-radius:999px;background:#43506b;position:relative;cursor:pointer;border:none;flex:none;transition:background .15s}
  .toggle.on{background:var(--win)}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s}.toggle.on::after{left:22px}
  .tips-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.tips-cols{grid-template-columns:1fr}}
  .tip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.tip:last-child{border-bottom:none}
  .tip .g{font-weight:600;font-size:14px}.tip .meta{color:var(--faint);font-size:12px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .b-win{background:rgba(46,175,98,.16);color:#5fd48c}.b-loss{background:rgba(229,89,95,.16);color:#ff9a9e}.b-push{background:rgba(92,103,133,.2);color:#b3bdd6}.b-pending{background:rgba(91,140,255,.16);color:#9db8ff}
  .num.pos{color:var(--win);font-weight:700}.num.neg{color:var(--loss);font-weight:700}
  .empty{color:var(--faint);font-size:13px;padding:14px 0}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:11px;padding:11px 18px;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.sm{padding:8px 14px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
  .center{min-height:74vh;display:grid;place-items:center;text-align:center}.center h1{margin:0 0 6px}.center p{color:var(--muted);margin:0 0 20px}
  .err{color:var(--loss)}
  /* builder */
  .gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .12s,transform .12s}
  .gcard:hover{border-color:#3a4772;transform:translateY(-2px)}
  .gcard .rd{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .gcard .mt{font-weight:700;font-size:16px}.gcard .vn{color:var(--muted);font-size:12px;margin-top:6px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
  .tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab.mkt{border-color:#5a3a7a;color:#c9a5ff}
  .tab.mkt.active{background:#7b5bff;border-color:#7b5bff;color:#fff}
  .teamhdr{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
  .compchip{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
  .compchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .compbadge{font-size:10px;font-weight:800;letter-spacing:.04em;background:#1f3a5c;color:#9fc7ff;padding:1px 7px;border-radius:999px;vertical-align:middle}
  .compbadge.aflw{background:#5a1f4a;color:#ff9fe0}
  .thdr{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .thdr:hover{color:var(--muted)}
  .tcaret{font-size:11px;color:var(--muted);width:12px;display:inline-block}
  .prow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
  .pnum{display:grid;place-items:center;flex:none}
  .pname{font-weight:600;min-width:0;flex:1 1 120px}
  .linectl{display:flex;align-items:center;gap:12px;flex:1 1 160px;min-width:0;max-width:100%}
  .lineval{font-weight:800;font-size:20px;min-width:66px;text-align:center}
  .lineval small{font-size:12px;color:var(--muted);font-weight:600}
  input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:4px}
  .prow-actions{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;max-width:100%}
  .ou{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
  .ou button{background:var(--card2);border:none;color:var(--muted);padding:7px 12px;cursor:pointer;font:inherit;font-weight:700;font-size:13px;white-space:nowrap}
  .ou button.on{background:var(--accent);color:#fff}
  .addbtn{background:rgba(46,175,98,.16);color:#5fd48c;border:1px solid rgba(46,175,98,.4);border-radius:9px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:700;flex:none;white-space:nowrap}
  .addbtn:hover{background:rgba(46,175,98,.26)}
  @media(max-width:640px){
    .prow{gap:10px;padding:12px}
    .pname{min-width:0;flex:1 1 100%}
    .linectl{flex:1 1 100%;gap:10px}
    .prow-actions{flex:1 1 100%;justify-content:space-between}
    .ou{flex:1}
    .ou button{flex:1;padding:9px 10px}
    .addbtn{min-height:38px;padding:9px 16px}
    .builder-tools #psearch,.builder-tools #psort{min-width:0!important;width:100%}
    .builder-tools{flex-direction:column}
    .cal-nav-row{flex-wrap:wrap!important;max-width:100%}
    .admin-row{min-width:0!important}
  }
  .panel{min-width:0;max-width:100%;box-sizing:border-box}
  .builder-tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px;min-width:0;max-width:100%}
  .builder-tools #psearch{flex:1 1 160px;min-width:0}
  .pname-block{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px}
  .pname-block .pname{flex:none;width:100%}
  .pform{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:100%}
  .pform-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
  .pform-lab{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-right:2px;flex:none}
  .pform-chip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border-radius:5px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .pform-chip.recent{background:rgba(91,140,255,.24);border-color:rgba(91,140,255,.5);color:var(--txt);font-weight:800}
  .pform-chip.ph{opacity:.4;font-weight:600}
  .pform-meta{font-size:10px;color:var(--faint);margin-top:1px}
  .compare-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;flex:none;white-space:nowrap}
  .compare-btn:hover{border-color:#3a4772;color:var(--txt)}
  .draft-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;border:1px solid rgba(91,140,255,.4);border-radius:12px;background:rgba(91,140,255,.1)}
  .draft-banner .db-msg{font-size:13px;color:var(--txt);min-width:0;flex:1}
  .draft-banner .db-acts{display:flex;gap:8px;flex-wrap:wrap}
  /* multi tray */
  .tray{position:fixed;left:0;right:0;bottom:0;background:var(--card2);border-top:1px solid var(--line);box-shadow:0 -14px 40px rgba(0,0,0,.4);z-index:40}
  .tray-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legchips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
  .chip .x{color:var(--faint);cursor:pointer;font-weight:700}
  .chip .x:hover{color:var(--loss)}
  /* batch tray — compact collapsed bar (full tip list lives on review page) */
  .batchtray{position:fixed;left:0;right:0;bottom:0;background:var(--card2);border-top:1px solid var(--line);box-shadow:0 -14px 40px rgba(0,0,0,.4);z-index:39}
  .batchtray.above-legs{bottom:76px}
  .batchtray-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
  .batch-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:rgba(91,140,255,.14);border:1px solid rgba(91,140,255,.35);border-radius:999px;padding:4px 10px;flex:none;white-space:nowrap}
  .batchtray .batch-clear{border:1px solid var(--line);background:transparent;color:var(--faint);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:14px;font-weight:700;flex:none;line-height:1}
  .batchtray .batch-clear:hover{color:var(--loss);border-color:rgba(229,72,77,.45)}
  .batchtray .btn{flex:none;white-space:nowrap;margin-left:auto}
  .btn.secondary{background:transparent;border:1px solid var(--accent);color:var(--accent);box-shadow:none}
  .btn.secondary:hover:not(:disabled){background:rgba(91,140,255,.12);color:var(--accent)}
  .sched-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
  .trickle-row{display:flex;align-items:flex-start;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;user-select:none}
  .trickle-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;margin-top:2px;flex:none}
  .trickle-row .title{font-weight:700;color:var(--txt)}
  .trickle-row .thint{color:var(--faint);font-size:12px;margin-top:4px;line-height:1.4}
  .live-tips-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  .live-tips-row:last-child{border-bottom:none;padding-bottom:0}
  .live-tips-row:first-child{padding-top:0}
  .live-tips-meta{min-width:0;flex:1}
  .live-tips-meta .g{font-weight:700}
  .live-tips-meta .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
  .live-tips-preview{margin-top:10px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card2);padding:10px 12px}
  .live-tips-preview .tip-block{padding:8px 0;border-bottom:1px solid var(--line)}
  .live-tips-preview .tip-block:last-child{border-bottom:none;padding-bottom:0}
  .live-tips-preview .tip-head{font-weight:700;font-size:12.5px;margin-bottom:4px}
  .live-tips-preview .leg{font-size:12.5px;line-height:1.45;color:var(--txt);white-space:pre-wrap}
  .live-tips-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .live-auto{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .live-auto h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .live-auto label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer;user-select:none}
  .live-auto input{width:15px;height:15px;accent-color:var(--accent)}
  @media(max-width:600px){
    .batchtray.above-legs{bottom:0}
    .batchtray-in{padding:10px 12px;gap:8px}
    .batchtray .btn{padding:9px 12px;font-size:13px}
    .sched-actions .btn{width:100%}

html[data-theme="ochre"] {

  --win:#2eaf62;--loss:#e5595f;--push:#5c6785;--void:#6b7280;--radius:16px;

}
:root {

}

}

  function setLoadPanel(label, pct){

          pctEl=$("tb-loadpanel-pct"), bar=$("tb-loadpanel-bar");
    if(msg) msg.textContent=label||"Loading…";

  // Top bar + loading panel — real staged % (no fake ticks / wake copy)
  const TopBar = (function(){
    let el=null, fill=null, pending=0, hardTimer=null;
    function ensure(){
      if(el) return;
      el=document.createElement("div");
      el.id="tb-loadbar";
      el.innerHTML="<i></i>";
      document.body.appendChild(el);
      fill=el.firstElementChild;
    }
    function syncPanel(pct, label){
      setLoadPanel(label||($("loadingmsg")&&$("loadingmsg").textContent)||"Loading…", Math.round(pct));
    }
    function start(indeterminate){
      ensure();
      pending++;
      el.classList.add("on");
      if(indeterminate!==false) el.classList.add("indeterminate");
      else el.classList.remove("indeterminate");
      if(fill && indeterminate===false) fill.style.width="8%";
      clearTimeout(hardTimer);
      hardTimer=setTimeout(()=>{ pending=0; done(true); }, 120000);
    }
    function set(pct, label){
      ensure();
      el.classList.add("on");
      el.classList.remove("indeterminate");
      const n=Math.max(0, Math.min(100, pct));
      if(fill) fill.style.width=n+"%";
      syncPanel(n, label);
    }
    function done(force){
      if(!force){ pending=Math.max(0, pending-1); if(pending>0) return; }
      pending=0;
      ensure();
      el.classList.remove("indeterminate");
      if(fill) fill.style.width="100%";
      syncPanel(100, "Ready");
      setTimeout(()=>{
        if(pending) return;
        el.classList.remove("on");
        if(fill) fill.style.width="0%";
      }, 280);
      clearTimeout(hardTimer);
    }
    return { start, set, done };
  })();

  function fmtProg(cur, line){
    const c=(cur===0||cur)?cur:null, l=(line===0||line)?line:null;
    if(c==null && l==null) return null;
    const cs=c==null?"—":(Number.isFinite(+c)?((+c%1)?(+c).toFixed(1):String(+c)):String(c));
    const ls=l==null?"—":(Number.isFinite(+l)?((+l%1)?(+l).toFixed(1):String(+l)):String(l));
    return cs+" / "+ls;
  }
  function pickNum(){
    for(let i=0;i<arguments.length;i++){
      const v=arguments[i];
      if(v===0||v==="0") return 0;
      if(v==null||v==="") continue;
      if(typeof v==="number" && !Number.isNaN(v)) return v;
      const n=Number(v);
      if(!Number.isNaN(n)) return n;
    }
    return null;
  }
  function parseLineFromText(s){
    if(!s) return null;
    const m=String(s).match(/(?:over|under|o\/u|ou)?\s*(\d+(?:\.\d+)?)/i);
    return m?Number(m[1]):null;
  }
  function parseSideFromText(s){
    if(!s) return null;
    const t=String(s).toLowerCase();
    if(/\bunder\b/.test(t)) return "Under";
    if(/\bover\b|\d+(?:\.\d+)?\+/.test(t)) return "Over";
    return null;
  }
  function legSide(leg, liveLeg){
    const L=leg||{}, LV=liveLeg||{};
    const raw=L.side||L.ou||L.selection||LV.side||LV.ou||"";
    const s=String(raw).trim().toLowerCase();
    if(s==="under"||s==="u") return "Under";
    if(s==="over"||s==="o") return "Over";
    return parseSideFromText(L.description||L.text||L.market||LV.text||"")||null;
  }
  function legNums(leg, tip, liveLeg){
    const L=leg||{}, T=tip||{}, LV=liveLeg||{};
    const cur=pickNum(L.current, L.live_current, L.current_value, L.value, L.stat_current,
      LV.current, LV.live_current, T.current, T.live_current,
      L.disposals, L.goals);
    let line=pickNum(L.line, L.line_value, L.market_line, LV.line, T.line, T.market_line);
    if(line==null) line=parseLineFromText(L.description||L.text||L.market||"");
    return {cur:cur, line:line, side:legSide(L, LV)};
  }
  function legProgress(leg, tip, liveLeg){
    const n=legNums(leg, tip, liveLeg);
    return fmtProg(n.cur, n.line);
  }
  /** Evaluate Over/Under vs current. Returns "hit"|"miss"|null (pending/unknown). */
  function evalLegOutcome(leg, tip, liveLeg, opts){
    opts=opts||{};
    const n=legNums(leg, tip, liveLeg);
    if(n.cur==null||n.line==null||!n.side) return null;
    const finished=!!opts.finished;
    if(n.side==="Under"){
      // Under: current <= line → hit; current > line → miss (half-lines inclusive)
      return n.cur<=n.line?"hit":"miss";
    }
    if(n.side==="Over"){
      if(n.cur>n.line) return "hit";
      // Mid-game Over still reachable when current <= line → pending; FT always decide
      if(!finished) return null;
      return "miss";
    }
    return null;
  }
  function evalTipOutcome(legs, tip, liveByPos, opts){
    opts=opts||{};
    const list=(legs&&legs.length)?legs:null;
    if(!list) return null;
    let hits=0, misses=0, unknown=0;
    list.forEach((l,i)=>{
      const o=evalLegOutcome(l, tip, (liveByPos&&liveByPos[i])||null, opts);
      if(o==="hit") hits++;
      else if(o==="miss") misses++;
      else unknown++;
    });
    if(!hits&&!misses) return null;
    if(misses&&hits) return "mixed";
    if(misses) return "miss";
    if(hits&&!unknown) return "hit";
    if(hits&&unknown) return "mixed";
    return null;
  }
  function betcardOutcomeClass(outcome){
    if(outcome==="hit") return "hit";
    if(outcome==="miss") return "miss";

  function applyBetcardOutcome(cardEl, outcome){

  function legLabel(leg){
    if(!leg) return "Leg";
    if(leg.description||leg.text||leg.market||leg.leg_type){
      return leg.description||leg.text||leg.market||leg.leg_type||"Leg";
    }
    // Finished-games / queued prop legs often only have player/stat/side/line
    if(leg.player&&leg.stat!=null&&(leg.line!=null||leg.line===0)){
      const side=legSide(leg,null)||"";
      const line=leg.line;
      if(side==="Over") return leg.player+" "+line+"+ "+leg.stat;
      if(side==="Under") return leg.player+" under "+line+" "+leg.stat;
      return leg.player+" "+line+" "+leg.stat;
    }
    if(leg.player) return String(leg.player);
    return "Leg";
  }

  function tipCard(t,settled,opts){
    opts=opts||{};
    const result=settled?(t.result||"Push"):"Pending";
    const right=TB.chips.render(result)+(settled&&/^(win|loss)$/i.test(result)?'<span class="num '+(result.toLowerCase()==="win"?"pos":"neg")+'">'+esc(u(t.profit_units||0))+'</span>':!settled?'<span class="tb-quote">'+esc(t.units)+'u @ '+esc(t.odds)+'</span>':'');

  function mergeLegFields(base, extra){
    const b=base||{}, e=extra||{};
    return Object.assign({}, b, {
      current: pickNum(b.current,b.live_current,e.current,e.live_current),
      live_current: pickNum(b.live_current,e.live_current),
      line: pickNum(b.line,b.line_value,e.line,e.line_value),
      side: b.side||e.side||null,
      player: b.player||e.player||null,
      stat: b.stat||e.stat||null,
      description: b.description||b.text||e.description||e.text||null,
      text: b.text||e.text||null
    });
  }
  function legsHaveCurrent(legs){
    return !!(legs&&legs.some(l=>l&&pickNum(l.current,l.live_current)!=null));
  }
  async function fetchFinishedTipsMap(gid){
    const map={};
    try{
      const r=await api("/api/finished-games?guild_id="+encodeURIComponent(gid)+"&days=14");
      if(!r.ok) return map;
      const d=await r.json();
      (d.games||[]).forEach(g=>{
        (g.tips||[]).forEach(t=>{
          if(t&&t.tip_id) map[String(t.tip_id)]=t;
        });
      });
    }catch(e){ if(e&&e.unauth) throw e; }
    return map;
  }
  async function hydrateTipCards(box,gid,tips,opts){
    if(!box||!tips||!tips.length)return;
    opts=opts||{};
    const finishedCtx=!!opts.finished;
    const liveMap={};
    let finishedMap={};
    try{
      if(finishedCtx||opts.preferFinished){
        finishedMap=await fetchFinishedTipsMap(gid);
      }
    }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); }
    try{
      const r=await api("/api/live-tips?guild_id="+encodeURIComponent(gid));
      if(r.ok){
        const d=await r.json();
        (d.games||[]).forEach(g=>{(g.tips||[]).forEach(t=>{
          if(t&&t.tip_id) liveMap[String(t.tip_id)]=t;
        });});
      }
    }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); }
    await Promise.all((tips||[]).map(async t=>{
      const tipId=t&&t.tip_id; if(!tipId)return;
      const body=$("cardbody_"+tipId); if(!body)return;
      const cardEl=body.closest(".betcard");
      const isFinished=finishedCtx||(cardEl&&cardEl.dataset&&cardEl.dataset.finished==="1");
      let full=t;
      let legs=null;
      const fin=finishedMap[String(tipId)];
      // Prefer /api/finished-games legs when they carry current (or any legs on FT cards).
      if(fin&&usableLegs(fin.legs)&&(legsHaveCurrent(fin.legs)||isFinished)){
        legs=(fin.legs||[]).map(l=>mergeLegFields(l,null));
        t._fullLegs=legs;
        full=Object.assign({},t,fin,{legs:legs});
      }
      const needsFetch=!legs&&!(t._fullLegs||usableLegs(t.legs));
      const needsDetailEnrich=!!legs&&legs.some(l=>l&&!l.description&&!l.text&&l.player);
      if(needsFetch||needsDetailEnrich){
        try{
          const det=await (await api("/api/tip?guild_id="+encodeURIComponent(gid)+"&tip_id="+encodeURIComponent(tipId))).json();
          if(det&&!det.error){
            full=Object.assign({},t,det);
            if(needsFetch){
              legs=(det.legs||[]).map(l=>mergeLegFields(l,null));
              t._fullLegs=legs;
            }else if(needsDetailEnrich){
              // Keep finished current; borrow labels from tip detail when present
              const detLegs=det.legs||[];
              legs=legs.map((l,i)=>mergeLegFields(l, detLegs[i]||{}));
              t._fullLegs=legs;
            }
          }
        }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); }
      }
      if(!legs){
        legs=(t._fullLegs||usableLegs(full.legs)||usableLegs(t.legs)||[]).slice();
      }
      const live=liveMap[String(tipId)];
      if(live&&live.legs) t._liveLegs=live.legs;
      // Merge live current/line onto full legs when TipBot supplies them.
      legs=legs.map((l,i)=>{
        const lv=(t._liveLegs&&t._liveLegs[i])||{};
        return mergeLegFields(l, lv);
      });
      t._fullLegs=legs;
      const settled=String((full.status||t.status||"")).toLowerCase()==="settled" || !!(cardEl&&cardEl.dataset&&cardEl.dataset.settled==="1");
      const godRegrade=settled&&godOn();
      body.innerHTML=legsBlockHtml(full, legs, t._liveLegs)+gradeRowHtml(tipId, settled, godRegrade);
      applyBetcardOutcome(cardEl, evalTipOutcome(legs, full, t._liveLegs, {finished:isFinished}));
      wireTipRows(body,gid);
    }));
  }
  async function gradeBet(gid,tipId,result,box,god){
    const useGod=!!god&&godOn();
    if(!confirm((useGod?"🔱 God-mode grade as ":"Grade this bet as ")+result+"? Followers will be notified and it will post to bet-results."))return;
    if(box)box.querySelectorAll(".gradebtn").forEach(b=>b.disabled=true);
    try{ const r=await api(useGod?"/api/god-settle":"/api/settle-tip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:gid,tip_id:tipId,result:result})});
      const j=await r.json();
      if(j.ok){ if(STATE._detailCache)STATE._detailCache={}; toast((useGod?"🔱 Overriding as ":"Grading as ")+result+" — updating Discord…");
        if(useGod){ setTimeout(()=>loadDetail(gid,null,{force:true}),400); }
        else { document.querySelectorAll('.betrow[data-tip="'+tipId+'"]').forEach(row=>row.remove()); } }
      else { toast(j.message||"Couldn't grade that bet."); if(box)box.querySelectorAll(".gradebtn").forEach(b=>b.disabled=false); }
    }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); toast("Couldn't reach the bot."); if(box)box.querySelectorAll(".gradebtn").forEach(b=>b.disabled=false); }
  }
  async function deleteBet(gid,tipId,name,btn){

      :("Delete "+(name||"this bet")+"? It will be removed from Discord with a redaction note posted in its place.");

    }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); toast("Couldn't reach the bot."); if(btn)btn.disabled=false; }
  }

  function tipTimeMs(t){
    const v=t&& (t.settled_at||t.created_at||t.timestamp||t.created||t.ts||null);
    if(v==null||v==="") return null;
    if(typeof v==="number" && Number.isFinite(v)) return v<1e12?v*1000:v;
    const n=Date.parse(v); return Number.isFinite(n)?n:null;
  }

  function promoChipHidden(key){ try{ return localStorage.getItem(key)==="1"; }catch(e){ return false; } }
  function dismissPromoSlot(slot, key){
    try{ localStorage.setItem(key,"1"); }catch(e){}
    if(!slot) return;
    slot.classList.add("tb-promo-out");
    const done=()=>{
      slot.remove();
      const w=$("tb-promo-wrap");
      if(w && !w.querySelector(".tb-promo-slot:not(.tb-promo-out)")) w.remove();
    };
    slot.addEventListener("transitionend", function te(ev){
      if(ev.target!==slot) return;
      slot.removeEventListener("transitionend", te);
      done();
    });
    setTimeout(done, 380); // fallback if transitionend skipped
  }

  function dcGuildAvatar(t, name, size){
    const url=t&&(t.icon_url||t.guild_icon||"");
    const init=(function(n){ const s=String(n||"?").trim(); const p=s.split(/\s+/).filter(Boolean); if(p.length>=2) return (p[0][0]+p[1][0]).toUpperCase(); return (s.slice(0,2).toUpperCase()||"?"); })(name);
    if(url) return '<img class="dc-av" src="'+esc(url)+'" alt="" width="'+size+'" height="'+size+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'dc-av\',textContent:\''+esc(init)+'\'}))">';
    return '<div class="dc-av" aria-hidden="true">'+esc(init)+'</div>';
  }
  function dcRecentVals(t){
    let vals=null;
    if(Array.isArray(t.recent_nets)&&t.recent_nets.length) vals=t.recent_nets;
    else if(Array.isArray(t.recent_series)&&t.recent_series.length) vals=t.recent_series;
    else if(t.daily_series&&typeof t.daily_series==="object"){
      const keys=Object.keys(t.daily_series).sort();
      vals=keys.slice(-30).map(k=>{ const e=t.daily_series[k]; return e&&typeof e==="object"?(e.net||0):Number(e||0); });
    }
    if(!vals||vals.length<2) return null;
    return vals.map(v=>{
      if(v==null) return 0;
      if(typeof v==="number") return v;
      if(typeof v==="object") return Number(v.net!=null?v.net:(v.profit!=null?v.profit:(v.units!=null?v.units:0)));
      return Number(v)||0;
    });
  }
  // Flat desk spark — no axes/grid. Stroke win if end≥start else loss.
  function dcMiniSpark(t, wide){
    const vals=dcRecentVals(t); if(!vals) return "";
    const w=wide?220:120, h=wide?36:32, pad=2;
    const min=Math.min(...vals), max=Math.max(...vals), range=(max-min)||1;
    const x=i=>pad+i*(w-2*pad)/Math.max(vals.length-1,1);
    const y=v=>h-pad-((v-min)/range)*(h-2*pad);
    const pts=vals.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
    const up=vals[vals.length-1]>=vals[0];
    const col=up?"var(--win)":"var(--loss)";
    return '<svg class="dc-mini'+(wide?" dc-mini--wide":"")+'" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'
      +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }
  function pickFeaturedTipster(list){
    if(!list||!list.length) return null;
    const settled=list.filter(t=>Number(t.settled||0)>=20);
    const pool=settled.length?settled:list;
    return pool.slice().sort((a,b)=>Number(b.units_net||0)-Number(a.units_net||0))[0]||null;
  }

        if(inp){ inp.oninput=()=>renderList(inp.value); }
        bindInvites();

  function sparkline(series){
    if(!series||series.length<2) return "";
    const w=560,h=56,pad=8,vals=series.map(p=>p.profit);
    const min=Math.min(0,...vals),max=Math.max(0,...vals),range=(max-min)||1;
    const x=i=>pad+i*(w-2*pad)/(series.length-1), y=v=>h-pad-((v-min)/range)*(h-2*pad);
    const pts=series.map((p,i)=>x(i)+","+y(p.profit)).join(" ");
    const last=vals[vals.length-1],col=last>=0?"var(--win)":"var(--loss)",tot=Math.round(vals.reduce((a,b)=>a+b,0)*100)/100;

      +'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="max-width:100%">'
      +'<line x1="'+pad+'" y1="'+y(0)+'" x2="'+(w-pad)+'" y2="'+y(0)+'" stroke="var(--line)" stroke-dasharray="3 3"/>'
      +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
      +series.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.profit)+'" r="2.6" fill="'+(p.profit>=0?"var(--win)":"var(--loss)")+'"><title>'+esc(fmtMonth(p.month))+": "+u(p.profit)+'</title></circle>').join("")

  // ── Units calendar (month heatmap) ───────────────────────────────────────
  // Win/loss/push are sacred + constant across themes, so tint straight from
  // their fixed rgb (no color-mix needed). Reusable by the follower surface (#31).
  function calMonthShift(month,delta){
    const p=(month||"").split("-"); let y=+p[0], m=+p[1]-1+delta;
    y+=Math.floor(m/12); m=((m%12)+12)%12;
    return y+"-"+String(m+1).padStart(2,"0");
  }
  function calCellTint(net,maxAbs){
    if(!(net>0)&&!(net<0)) return {bg:"transparent",fg:"var(--push)"};
    const a=0.16+0.62*Math.min(1,Math.abs(net)/(maxAbs||1));
    const rgb=net>0?"46,175,98":"229,89,95";
    return {bg:"rgba("+rgb+","+a.toFixed(3)+")", fg:net>0?"#8ff0b6":"#ffb3b3"};
  }
  function renderCalendar(month,daily,extraHtml){
    daily=daily||{};
    const parts=(month||"").split("-"), y=+parts[0], mo=+parts[1];
    if(!y||!mo) return "";
    const dim=new Date(y,mo,0).getDate();                 // days in month
    const lead=(new Date(y,mo-1,1).getDay()+6)%7;         // Mon-based offset
    let maxAbs=0, net=0, tips=0, days=0;
    for(let d=1;d<=dim;d++){ const e=daily[y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")];
      if(e){ maxAbs=Math.max(maxAbs,Math.abs(e.net)); net+=e.net; tips+=e.n; days++; } }
    const dows=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const head='<div class="calgrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">'
      +dows.map(dn=>'<div style="text-align:center;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.03em">'+dn+'</div>').join("");
    let cells="";
    for(let i=0;i<lead;i++) cells+='<div></div>';
    for(let d=1;d<=dim;d++){
      const key=y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const e=daily[key];
      if(!e){
        cells+='<div style="aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card2);display:flex;align-items:flex-start;padding:6px"><span style="color:var(--faint);font-size:11px">'+d+'</span></div>';
        continue;
      }
      const t=calCellTint(e.net,maxAbs);
      const parts2=[]; if(e.won)parts2.push(e.won+"W"); if(e.lost)parts2.push(e.lost+"L"); if(e.push)parts2.push(e.push+"P");
      const wd=new Date(y,mo-1,d).toLocaleDateString(undefined,{weekday:"short"});
      const tip=wd+" "+d+" "+fmtMonth(month).split(" ")[0]+" — "+u(e.net)+" · "+e.n+" tip"+(e.n>1?"s":"")+(parts2.length?" ("+parts2.join(" ")+")":"");
      cells+='<div title="'+esc(tip)+'" style="aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:'+t.bg+';display:flex;flex-direction:column;justify-content:space-between;padding:6px;overflow:hidden">'
        +'<span style="color:var(--muted);font-size:11px">'+d+'</span>'
        +'<span style="color:'+t.fg+';font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1">'+(e.net>0?"+":"")+(Math.round(e.net*100)/100)+'</span></div>';
    }
    const netCls=net>=0?"pos":"neg";
    const legend='<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--faint);font-size:12px">'
      +'<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:rgba(46,175,98,.55)"></span>Up day</span>'
      +'<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:rgba(229,89,95,.55)"></span>Down day</span>'
      +'<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:3px;background:var(--card2);border:1px solid var(--line)"></span>No tips</span>'
      +'<span style="margin-left:auto">'+days+' active day'+(days===1?"":"s")+' · '+tips+' tips</span></div>';
    return '<div class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap">'
      +'<div style="min-width:0"><h3 style="margin:0">Units calendar</h3>'+(extraHtml||'')+'</div>'
      +'<div class="cal-nav-row" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;max-width:100%">'
      +'<button class="calnav ghost" data-cal="prev" title="Previous month" style="padding:4px 10px;flex:none">‹</button>'
      +'<span style="min-width:112px;text-align:center;font-size:13px;font-weight:600;flex:none">'+esc(fmtMonth(month))+'</span>'
      +'<button class="calnav ghost" data-cal="next" title="Next month" style="padding:4px 10px;flex:none">›</button>'
      +'<span style="margin-left:6px;color:var(--faint);font-size:12px;white-space:nowrap;flex:none">net <b class="'+netCls+'">'+u(Math.round(net*100)/100)+'</b></span>'
      +'</div></div>'+head+cells+'</div>'+legend+'</div>';
  }

  function tickCountdowns(){
    document.querySelectorAll("#upcoming-box .cd").forEach(el=>{
      const ts=+el.dataset.ts, live=el.dataset.live==="1";
      if(live){ el.innerHTML='<span style="color:#e5484d;font-weight:800">● LIVE</span>'; return; }
      if(!ts){ el.innerHTML='<span style="color:var(--faint)">time TBC</span>'; return; }
      const diff=ts*1000-Date.now();
      if(diff<=0){ el.innerHTML='<span style="color:#e5484d;font-weight:800">● in progress</span>'; return; }
      const d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4),sc=Math.floor(diff%6e4/1e3);
      el.innerHTML='<span style="color:var(--faint)">starts in </span><b>'+(d?d+"d ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sc).padStart(2,"0")+'</b>';
    });
  }
  function tipLooksFinished(t, starts, finished){
    if(!t) return false;
    if(t.finished || t.game_finished || t.ft || t.full_time) return true;
    const g=t.game_name||"";
    if(finished&&finished[g]) return true;
    const info=starts&&starts[g];
    if(info && (info.finished || info.complete>=100 || info.concluded)) return true;
    // Wall-clock: started >4h ago and not marked live → treat as finished for grading glance
    if(info && info.ts && !info.live){
      const age=Date.now()-(info.ts*1000);
      if(age>4*3600*1000) return true;
    }
    return false;
  }

  async function loadUpcoming(gid,queued){
    const box=$("upcoming-box"); const finBox=$("finished-box");
    if(!box)return;
    if(!queued||!queued.length){
      box.innerHTML='<div class="empty">No upcoming bets. Build one with ＋ Build a tip.</div>';
      if(finBox){ finBox.innerHTML='<div class="empty">No finished games with pending tips.</div>'; }
      const fp=$("finished-panel"); if(fp)fp.hidden=true;
      return;
    }
    let starts={}, finishedMap={};
    try{
      const fx=await (await api("/api/fixtures")).json();
      (fx.games||[]).forEach(g=>{
        if(!g.game_name) return;
        starts[g.game_name]={
          ts:g.unixtime, live:!!g.live, complete:Number(g.complete||0),
          hscore:g.hscore, ascore:g.ascore,
          finished:!!g.finished||Number(g.complete||0)>=100,
          concluded:!!g.concluded
        };
      });
    }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); }
    // Prefer /api/finished-games (legs + current) when TipBot has it; fall back to /api/results.
    try{
      const fg=await api("/api/finished-games?guild_id="+encodeURIComponent(gid)+"&days=14");
      if(fg.ok){
        const data=await fg.json();
        (data.games||[]).forEach(g=>{
          const name=g.game_name||((g.hteam&&g.ateam)?(g.hteam+" v "+g.ateam):"");
          if(!name) return;
          finishedMap[name]={hscore:g.hscore, ascore:g.ascore, date:g.date||"", tips:g.tips||[]};
          // Seed queued tips with finished legs/current when present so cards paint before hydrate.
          (g.tips||[]).forEach(ft=>{
            if(!ft||!ft.tip_id||!usableLegs(ft.legs)) return;
            const q=queued.find(x=>String(x.tip_id)===String(ft.tip_id));
            if(q){
              q._fullLegs=(ft.legs||[]).map(l=>mergeLegFields(l,null));
              if(legsHaveCurrent(ft.legs)||!usableLegs(q.legs)) q.legs=q._fullLegs;
            }
          });
        });
      }
    }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); }
    if(!Object.keys(finishedMap).length){
      try{
        const rr=await api("/api/results");
        if(rr.ok){
          const data=await rr.json();
          (data.games||[]).forEach(g=>{
            const name=g.game_name||((g.hteam&&g.ateam)?(g.hteam+" v "+g.ateam):"");
            if(!name) return;
            finishedMap[name]={hscore:g.hscore, ascore:g.ascore, date:g.date||""};
          });
        }
      }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); }
    }

    const upGroups={}, finGroups={};
    queued.forEach(t=>{
      const k=t.game_name||"Other";
      if(tipLooksFinished(t, starts, finishedMap)) (finGroups[k]=finGroups[k]||[]).push(t);
      else (upGroups[k]=upGroups[k]||[]).push(t);
    });
    renderGameGroups(box, gid, upGroups, starts, finishedMap, "upcoming");
    if(finBox){
      const hasFin=Object.keys(finGroups).length>0;
      const fp=$("finished-panel"); if(fp)fp.hidden=!hasFin;
      if(hasFin) renderGameGroups(finBox, gid, finGroups, starts, finishedMap, "finished");
      else finBox.innerHTML='<div class="empty">No finished games with pending tips.</div>';
    }
    tickCountdowns(); DETAIL_TIMER=setInterval(tickCountdowns,1000);
  }

(function () {
  'use strict';
  var TB = window.TB = window.TB || {};
  var root = document.documentElement;

  var defaults = {navy:'#5b8cff', day:'#245ad6', ochre:'#e0a04a'};

  function read(key) { try {var value=localStorage.getItem(key);if(value!==null)return value;} catch(e) {} return memory[key] || null; }
  function write(key,value) {memory[key]=value;try {if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);} catch(e) {}}
  function today(d) {return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function valid(name) {return names.indexOf(name)!==-1;}
  function auto() {return read('tipbot_theme_auto')==='true';}
  function resolve(d) {
    var saved=read('tipbot_theme');
    if(valid(saved)&&(!auto()||read('tipbot_theme_manual_date')===today(d)))return saved;
    return auto()?(d.getHours()>=7&&d.getHours()<19?'day':'navy'):(valid(saved)?saved:'navy');
  }
  function luminance(rgb) {return rgb.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}
  function ink(rgb) {return luminance(rgb)>.179?'#000000':'#ffffff';}
  function accent() {
    var value=read('tipbot_theme_accent');
    ['--accent','--on-accent','--on-accent-hover'].forEach(function(k){root.style.removeProperty(k);});
    if(!/^#[0-9a-f]{6}$/i.test(value||''))return;
    var rgb=[1,3,5].map(function(i){return parseInt(value.slice(i,i+2),16);});
    root.style.setProperty('--accent',value);
    root.style.setProperty('--on-accent',ink(rgb));
    root.style.setProperty('--on-accent-hover',ink(rgb.map(function(v){return v*.92+255*.08;})));
  }
  function sync() {
    hosts=hosts.filter(function(host){return host.isConnected;});
    hosts.forEach(function(host){
      host.querySelectorAll('[data-tb-theme]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.tbTheme===root.dataset.theme));});
      host.querySelector('[data-tb-auto]').checked=auto();
      host.querySelector('[data-tb-accent]').value=read('tipbot_theme_accent')||defaults[root.dataset.theme];
      host.querySelector('[data-tb-reset]').disabled=!read('tipbot_theme_accent');
      var manual=read('tipbot_theme_manual_date')===today(new Date())&&valid(read('tipbot_theme'));
      host.querySelector('[data-tb-note]').textContent=auto()?(manual?'Your choice stays until midnight. Auto resumes tomorrow.':'Day from 7 am to 7 pm. Navy overnight, using your local time.'):'Your selected theme stays on until you change it.';
    });
  }
  function refresh() {root.dataset.theme=resolve(new Date());accent();sync();}

    var h=now.getHours();
    if(h<7)next.setHours(7,0,0,0);else if(h<19)next.setHours(19,0,0,0);else next.setHours(24,0,0,0);

    set:function(name) {
      if(!valid(name))return false;

    },

    },
    setAuto:function(enabled) {

    setAccent:function(hex) {

    },

(function () {

    let html="";
    Object.keys(groups).forEach(gname=>{
      html+='<div style="color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px">'+esc(gname)+'</div>';
      groups[gname].forEach(o=>{
        html+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">'
          +'<div style="min-width:160px"><div style="font-weight:600;font-size:14px">'+esc(o.label)+'</div><div style="color:var(--faint);font-size:12px">'+esc(o.desc)+'</div></div>'
          +'<select class="rsel" data-k="'+o.key+'" style="flex:1;min-width:200px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;cursor:pointer">'+chanOptions(data.channels,o.channel_id)+'</select>'
          +'</div>';
      });
    });
    html+='<div id="routing-merge" style="font-size:12.5px;color:#9fb0d0;margin:8px 0 12px;min-height:16px"></div>'
      +'<button class="btn sm" id="routing-save">Save routing</button> <span id="routing-msg" style="font-size:12px;margin-left:8px"></span>';
    box.innerHTML=html;
    const sels=[...box.querySelectorAll(".rsel")];
    function updateMerge(){
      const byChan={}; sels.forEach(x=>{ if(x.value){(byChan[x.value]=byChan[x.value]||[]).push(x);} });
      const merged=Object.entries(byChan).filter(([id,arr])=>arr.length>1);
      const mb=$("routing-merge");
      if(merged.length){ const names=merged.map(([id])=>{const ch=data.channels.find(c=>c.id===id);return "#"+(ch?ch.name:id);}); mb.innerHTML="🔗 Shared: "+names.join(", ")+" — the bot will post one combined, pinned message there instead of several."; }
      else mb.innerHTML="";
    }
    sels.forEach(x=>x.onchange=updateMerge); updateMerge();
    $("routing-save").onclick=async()=>{
      const mapping={}; sels.forEach(x=>mapping[x.dataset.k]=x.value);
      const btn=$("routing-save"),msg=$("routing-msg"); btn.disabled=true; msg.textContent="";
      try{ const r=await api("/api/channels",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:gid,mapping})});
        const j=await r.json();
        if(r.ok&&j.ok){ if(window.NDConfirmPop)NDConfirmPop.show({label:"Routing saved",color:"#2eaf62"}); msg.textContent="✓ saved"; msg.style.color="var(--win)"; }
        else{ msg.textContent=j.message||"Couldn't save"; msg.style.color="var(--loss)"; }
      }catch(e){ if(e.unauth)return renderLogin("Session expired."); msg.textContent="Couldn't reach the bot"; msg.style.color="var(--loss)"; }
      finally{ btn.disabled=false; }
    };
  }

  /* ---------- MULTI DRAFT (localStorage, guild-scoped) ---------- */
  const MULTI_DRAFT_KEY="tipdash_multi_draft_v1";
  function readDraftStore(){
    try{ const raw=localStorage.getItem(MULTI_DRAFT_KEY); if(!raw)return {}; const o=JSON.parse(raw); return (o&&typeof o==="object")?o:{}; }
    catch(e){ return {}; }
  }
  function writeDraftStore(store){
    try{ localStorage.setItem(MULTI_DRAFT_KEY, JSON.stringify(store||{})); }catch(e){}
  }
  function clearMultiDraft(guildId){
    if(guildId==null)return;
    const store=readDraftStore();
    const k=String(guildId);
    if(store[k]){ delete store[k]; writeDraftStore(store); }
  }
  function gameSnap(g){
    if(!g)return null;
    return {
      aflMatchId:g.aflMatchId||null,
      id:g.id||g.game_id||null,
      hteam:teamName(g.hteam),
      ateam:teamName(g.ateam),
      roundname:g.roundname||"",
      unixtime:g.unixtime||null,
      complete:g.complete,
      comp:g.comp||null
    };
  }
  function saveMultiDraft(){
    const gid=BUILD&&BUILD.guildId;
    if(!gid)return;
    const legs=(BUILD.legs||[]).slice();
    const meaningful=legs.length>0 || !!(BUILD.custom&&((BUILD.customEvent||"").trim()||(BUILD.customSport||"").trim()));
    if(!meaningful){
      // Don't wipe an existing draft just because we're on the games list with 0 legs.
      return;
    }
    const store=readDraftStore();
    store[String(gid)]={
      guild_id:String(gid),
      serverName:BUILD.serverName||"",
      legs:legs,
      game:gameSnap(BUILD.game),
      custom:!!BUILD.custom,
      customEvent:BUILD.customEvent||"",
      customSport:BUILD.customSport||"",
      tab:BUILD.tab||"Disposals",
      search:BUILD.search||"",
      sort:BUILD.sort||"number",
      assume:!!BUILD.assume,
      stakeMode:BUILD.stakeMode||"units",
      ts:Date.now()
    };
    writeDraftStore(store);
  }
  function getMultiDraft(guildId){
    if(guildId==null)return null;
    const d=readDraftStore()[String(guildId)];
    if(!d||typeof d!=="object")return null;
    const legs=Array.isArray(d.legs)?d.legs:[];
    const meaningful=legs.length>0 || !!(d.custom&&((d.customEvent||"").trim()||(d.customSport||"").trim()));
    if(!meaningful)return null;
    return d;
  }
  function matchDraftGame(snap, games){
    if(!snap||!games||!games.length)return null;
    const mid=snap.aflMatchId||snap.id;
    if(mid){
      const hit=games.find(g=>String(g.aflMatchId||g.id||g.game_id||"")===String(mid));
      if(hit)return hit;
    }
    const ht=String(snap.hteam||"").toLowerCase(), at=String(snap.ateam||"").toLowerCase();
    if(ht&&at){
      return games.find(g=>teamName(g.hteam).toLowerCase()===ht&&teamName(g.ateam).toLowerCase()===at)||null;
    }
    return null;
  }
  function draftBannerHTML(d){
    const n=(d.legs||[]).length;
    const when=d.ts?new Date(d.ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
    const label=n? (n+" leg"+(n===1?"":"s")) : "custom draft";
    return '<div class="draft-banner" id="draftbanner" role="status">'
      +'<div class="db-msg">You have an unfinished multi (<b>'+esc(label)+'</b>)'+(when?(" · saved "+esc(when)):"")+'. Continue?</div>'
      +'<div class="db-acts"><button type="button" class="btn sm" id="draft-continue">Continue</button>'
      +'<button type="button" class="ghost" id="draft-discard">Discard</button></div></div>';
  }
  async function resumeMultiDraft(d, games){
    if(!d)return;
    BUILD.legs=(d.legs||[]).slice();
    BUILD.tab=d.tab||"Disposals";
    BUILD.search=d.search||"";
    BUILD.sort=d.sort||"number";
    BUILD.assume=!!d.assume;
    BUILD.stakeMode=d.stakeMode||"units";
    BUILD.custom=!!d.custom;
    BUILD.customEvent=d.customEvent||"";
    BUILD.customSport=d.customSport||"";
    BUILD.serverName=d.serverName||BUILD.serverName;
    if(d.custom){
      BUILD.game=null;
      renderCustom();
      renderTray();
      return;
    }
    let list=games||[];
    if(!list.length){
      try{
        const fx=await (await api("/api/fixtures")).json();
        list=fx.games||[];
        STATE.playerMeta=fx.players||{};
      }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); }
    }
    const g=matchDraftGame(d.game, list);
    if(g){
      await openGame(g);
      // openGame resets tab to Disposals — restore draft tab/legs after.
      BUILD.tab=d.tab||BUILD.tab;
      BUILD.legs=(d.legs||[]).slice();
      BUILD.search=d.search||"";
      BUILD.sort=d.sort||"number";
      BUILD.assume=!!d.assume;
      renderGame();
      renderTray();
      return;
    }
    // Game no longer in fixtures — keep legs, show games list + note.
    BUILD.game=null; BUILD.custom=false;
    renderGames(list);
    renderTray();
    const box=$("builder");
    if(box){
      const note=document.createElement("div");
      note.className="draft-banner";
      note.innerHTML='<div class="db-msg">Draft restored ('+esc(String((d.legs||[]).length))+' legs), but that fixture is no longer listed — pick a game or review the tray.</div>';
      const h1=box.querySelector("h1");
      if(h1) h1.insertAdjacentElement("afterend", note);
      else box.insertBefore(note, box.firstChild);
    }
  }
  function offerDraftResume(guildId, games){
    const d=getMultiDraft(guildId);
    if(!d)return;
    const box=$("builder"); if(!box)return;
    if($("draftbanner"))return;
    const wrap=document.createElement("div");
    wrap.innerHTML=draftBannerHTML(d);
    const banner=wrap.firstChild;
    // Insert after back/h1 if present
    const h1=box.querySelector("h1");
    if(h1&&h1.nextSibling) box.insertBefore(banner, h1.nextSibling);
    else if(h1) h1.insertAdjacentElement("afterend", banner);
    else box.insertBefore(banner, box.firstChild);
    const cont=$("draft-continue"), disc=$("draft-discard");
    if(cont)cont.onclick=async()=>{ banner.remove(); await resumeMultiDraft(d, games); };
    if(disc)disc.onclick=()=>{ clearMultiDraft(guildId); banner.remove(); toast("Draft discarded"); };
  }

  /* ---------- BUILDER ---------- */
  async function openBuilder(guildId,name){
    clearDetailTimers();clearLiveTimer();clearGamesTimer();
    if(BATCH.guildId && String(BATCH.guildId)!==String(guildId)){ BATCH={guildId:null,tips:[]}; }
    BUILD={guildId,serverName:name,game:null,tab:"Disposals",legs:[],search:"",sort:"number",collapsed:{},compFilter:"All",unitSize:guildUnitSize(guildId)};
    panel("builder");renderTray();renderBatchTray();
    $("builder").innerHTML='<div class="back" id="bx">← Back to '+(name||"server")+'</div><h1 style="margin:0 0 16px">Build a tip</h1>'+NDSkeleton.grid(6,{cols:3,tile:"92px"});
    $("bx").onclick=()=>{$("tray").hidden=true;renderBatchTray();loadDetail(guildId);};
    // players now come live from the AFL API (attached to each game); players.json
    // is only a silent fallback for a team the roster feed couldn't match.
    if(!Object.keys(STATE.players).length){ try{STATE.players=await (await fetch("./players.json")).json();}catch{STATE.players={};} }
    if(!STATE.bookies.length)STATE.bookies=await TB.bookie.load();
    let games=[];
    try{ const fx=await (await api("/api/fixtures")).json(); games=fx.games||[]; STATE.playerMeta=fx.players||{}; }catch(e){ if(e.unauth)return renderLogin("Session expired."); }
    renderGames(games);
    offerDraftResume(guildId, games);
    // Auto-refresh the games list every 60s so live scores update and finished
    // games drop off on their own. Pauses while you're inside a specific game.
    clearGamesTimer();
    GAMES_TIMER=setInterval(async()=>{
      if(BUILD.game)return;
      try{ const fx=await (await api("/api/fixtures")).json(); if(!BUILD.game){ STATE.playerMeta=fx.players||{}; renderGames(fx.games||[]); } }catch(e){}
    },60000);
  }

  const RES_COLS=[["D","disposals"],["G","goals"],["M","marks"],["T","tackles"],["K","kicks"],["HB","handballs"]];
  function resultStatsHTML(d,g){
    if(!d||d.available===false||(((d.home||[]).length===0)&&((d.away||[]).length===0)))
      return '<div class="empty" style="padding:6px 0">Player counts aren\'t available for this game yet.</div>';
    const th='padding:4px 6px;color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;text-align:right';
    const th0='padding:4px 6px;color:var(--faint);font-weight:700;font-size:12px;text-align:left';
    const td='padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums';
    const td0='padding:4px 6px;text-align:left';
    function tbl(title,list){
      const sorted=(list||[]).slice().sort((a,b)=>(Number(b.summary&&b.summary.disposals)||0)-(Number(a.summary&&a.summary.disposals)||0));
      if(!sorted.length)return '';
      const head='<tr><th style="'+th0+'">'+esc(title)+'</th>'+RES_COLS.map(c=>'<th style="'+th+'" title="'+c[1]+'">'+c[0]+'</th>').join("")+'</tr>';
      const rows=sorted.map(p=>'<tr style="border-top:1px solid var(--line)"><td style="'+td0+'">'+(p.number?('<span style="color:var(--faint)">#'+esc(String(p.number))+'</span> '):'')+esc(p.name)+'</td>'+RES_COLS.map(c=>'<td style="'+td+'">'+Math.round(Number(p.summary&&p.summary[c[1]])||0)+'</td>').join("")+'</tr>').join("");
      return '<div style="overflow-x:auto;margin-bottom:12px"><table style="width:100%;border-collapse:collapse;font-size:13px">'+head+rows+'</table></div>';
    }
    return tbl(teamName(g.hteam),d.home)+tbl(teamName(g.ateam),d.away);
  }
  async function toggleResult(mid,i){
    RESULTS._open=RESULTS._open||{}; RESULTS._stats=RESULTS._stats||{};
    const body=$("resbody_"+i); if(!body)return;
    const hdr=body.previousElementSibling, car=hdr&&hdr.querySelector(".tcaret");
    const nowOpen=!RESULTS._open[mid]; RESULTS._open[mid]=nowOpen;
    if(car)car.textContent=nowOpen?"▾":"▸";
    if(!nowOpen){ body.hidden=true; return; }
    body.hidden=false;
    if(RESULTS._stats[mid]){ body.innerHTML=RESULTS._stats[mid]; return; }
    if(!mid){ body.innerHTML='<div class="empty" style="padding:6px 0">No match id for this game.</div>'; return; }
    body.innerHTML='<div class="empty" style="padding:6px 0">Loading player counts…</div>';
    try{ const d=await (await api("/api/match-stats?match="+encodeURIComponent(mid))).json();
      const g=(RESULTS._shown||[])[i]||{}; const out=resultStatsHTML(d,g);
      RESULTS._stats[mid]=out; if(RESULTS._open[mid])body.innerHTML=out;
    }catch(e){ if(e.unauth)return renderLogin("Session expired."); body.innerHTML='<div class="empty" style="padding:6px 0">Couldn\'t load player counts.</div>'; }
  }
  function renderResults(){

      +'</div>';
    }).join(""); }
    $("builder").innerHTML=html;
    { const b=$("rbx"); if(b)b.onclick=()=>loadDetail(RESULTS.guildId); }

    $("builder").querySelectorAll(".compchip").forEach(b=>b.onclick=()=>{RESULTS.comp=b.dataset.c;renderResults();});
    const rows=$("builder").querySelectorAll(".reshdr");

  }
  /* teams arrive as objects {name, abbrev, players:[{name,number,position}], aflName};
     fall back gracefully to strings + players.json if anything is missing. */
  function teamName(t){ return (t&&typeof t==="object")?(t.name||t.aflName||""):(t||""); }
  function teamPlayers(t){ if(t&&typeof t==="object"&&Array.isArray(t.players)&&t.players.length)return t.players; return STATE.players[teamName(t)]||[]; }
  // match the backend's _text_key so we can look a live player up by name
  function tkey(s){ return String(s||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,""); }
  const LIVE_KEYS={Disposals:"disposals",Goals:"goals","Fantasy Points":"dreamTeamPoints",Hitouts:"hitouts",Marks:"marks",Tackles:"tackles",Kicks:"kicks",Handballs:"handballs",Clearances:"totalClearances"};
  // live value for a player on the active stat tab, or null when not live
  function liveVal(name){ const L=BUILD.live; if(!L||!L.available)return null; const p=L.players[tkey(name)]; if(!p)return null; const v=p.summary?.[LIVE_KEYS[BUILD.tab]]; return (typeof v==="number")?v:null; }
  function gameComp(g){ return (g&&g.comp)||"AFL"; }
  function renderGames(games){
    // Which competitions are present? (AFL always; AFLW when the season is on.)
    const comps=[]; games.forEach(g=>{const c=gameComp(g); if(!comps.includes(c))comps.push(c);});
    const hasMulti=comps.length>1;
    if(!BUILD.compFilter||(BUILD.compFilter!=="All"&&!comps.includes(BUILD.compFilter)))BUILD.compFilter="All";
    let html='<div class="back" id="bx">← Back to '+(BUILD.serverName||"server")+'</div>'
      +'<div class="dhead"><h1 style="margin:0">Build a tip</h1><div style="display:flex;gap:8px"><button class="ghost" id="customgames">＋ Custom (non-AFL)</button><button class="ghost" id="refreshgames">↻ Refresh</button></div></div>'

  function isAssumed(team){ return !isNamed(team)&&!!BUILD.assume&&fullSquad(team).length>0; }

  // Player form chips (Sportsbet-like last5 / vs opp). Reads in-page caches if TipBot
  // or fixtures ever attach history; otherwise muted "—" placeholders keep layout.
  // Needed TipBot API (document in PR): GET /api/player-form?player=&stat=&vs=
  // returning { last5:[n…], vsOpp:[n…], seasonAvg, last10:[n…] } newest-last.
  function playerForm(player, stat, vsTeam){
    const name=typeof player==="string"?player:(player&&player.name)||"";
    const key=String(name||"").toLowerCase().trim();
    const statKey=String(stat||BUILD.tab||"Disposals");
    const store=STATE.playerForm||STATE.form||null;
    let hit=null;
    if(store&&typeof store==="object"){
      const bucket=store[key]||store[name]||null;
      if(bucket){
        hit=bucket[statKey]||bucket[statKey.toLowerCase()]||bucket.stats||bucket;
      }
    }
    // Optional per-player fields on roster objects from fixtures/live.
    if(!hit&&player&&typeof player==="object"){
      const pf=player.form||player.history||player.stats;
      if(pf){
        hit=(pf[statKey]||pf[statKey.toLowerCase()]||pf);
      }
    }
    function nums(arr){
      if(!Array.isArray(arr))return null;
      const out=arr.map(function(v){ const n=Number(v); return isNaN(n)?null:n; }).filter(function(v){return v!==null;});
      return out.length?out:null;
    }
    if(!hit||typeof hit!=="object"){
      return { last5:null, vsOpp:null, seasonAvg:null, last10:null, placeholder:true };
    }
    const last5=nums(hit.last5||hit.last_5||hit.recent||hit.form)||null;
    let vsOpp=null;
    const vsMap=hit.vs||hit.vsOpp||hit.vs_opp||hit.against||null;
    if(Array.isArray(vsMap)) vsOpp=nums(vsMap);
    else if(vsMap&&typeof vsMap==="object"&&vsTeam){
      const vk=String(vsTeam).toLowerCase().replace(/[^a-z]/g,"");
      for(const k of Object.keys(vsMap)){
        if(String(k).toLowerCase().replace(/[^a-z]/g,"")===vk||String(k).toLowerCase().includes(vk)||vk.includes(String(k).toLowerCase().replace(/[^a-z]/g,""))){
          vsOpp=nums(vsMap[k]); break;
        }
      }
    }
    const seasonAvg=(hit.seasonAvg!=null?Number(hit.seasonAvg):hit.season_avg!=null?Number(hit.season_avg):hit.avg!=null?Number(hit.avg):null);
    const last10=nums(hit.last10||hit.last_10)||null;
    return {
      last5: last5, vsOpp: vsOpp,
      seasonAvg: (seasonAvg!=null&&!isNaN(seasonAvg))?seasonAvg:null,
      last10: last10,
      placeholder: !(last5||vsOpp||(seasonAvg!=null&&!isNaN(seasonAvg))||last10)
    };
  }
  function formChipCells(arr, maxN){

  /** Whole-number player-prop lines → N−0.5 (Over/Under). .5 lines unchanged. */
  function applyHalfPointLine(leg){
    if(!leg||leg.market||leg.custom) return leg;
    if(leg.line==null||leg.line==="") return leg;
    // Markets/custom use desc; player props have stat + line.
    if(!leg.stat && leg.desc) return leg;
    const n=parseFloat(leg.line);
    if(!(n>0)||!isFinite(n)) return leg;
    if(Math.abs(n-Math.round(n))>1e-9) return leg; // already a half-point (or fractional)
    const adjusted=Math.round(n)-0.5;
    if(leg.line_adjusted_from!=null && Number(leg.line)===adjusted) return leg;
    return Object.assign({},leg,{line:adjusted,line_adjusted_from:Math.round(n)});
  }
  function normalizePropLines(legs){
    return (legs||[]).map(l=>applyHalfPointLine(l));
  }
  function lineAdjustNote(l){
    if(l==null||l.line_adjusted_from==null) return "";
    return "Line adjusted "+l.line_adjusted_from+" → "+l.line+" (half-point)";

      seconds:5,confirmLabel:"Schedule batch",secondaryLabel:"Cancel",accent:"#5b8cff",

  async function doBatchSchedule(delay,trickle){
    const btn=$("batchgo"); if(btn)btn.disabled=true;
    const errEl=$("scherr");
    function setErr(msg){ if(errEl)errEl.textContent=msg||""; }
    const guildId=BATCH.guildId||BUILD.guildId;
    const tips=BATCH.tips.map(t=>({
      legs:t.legs, odds:t.odds, units:t.units, bookmaker:t.bookmaker,
      game_name:t.game_name, sport:t.sport, image_b64:t.image_b64||""
    }));
    const payload={
      guild_id:guildId,
      delay_minutes:delay,
      trickle:!!trickle,
      trickle_seconds:30,
      tips:tips
    };
    async function readBody(r){
      const raw=await r.text();
      let j=null;
      try{ j=raw?JSON.parse(raw):null; }catch(e){ j=null; }
      return { j:j, raw:raw };
    }
    function failMsg(r, j, raw){
      if(r && r.status===404){
        return "Bot is updating — Trickle API not live yet. Try again in a minute.";
      }
      const bodyMsg=(j&&(j.message||j.error||j.detail))||"";
      if(bodyMsg) return (r&&r.status?("HTTP "+r.status+": "):"")+bodyMsg;
      if(r&&!r.ok) return "Couldn't schedule batch (HTTP "+r.status+")."+(raw&&raw.length<180?" "+raw:"");
      return "Couldn't schedule batch.";
    }
    async function sequentialFallback(){
      // Trickle OFF + 404: post each tip via legacy /api/queue-tip with same delay.
      let ok=0, lastErr="";
      for(let i=0;i<tips.length;i++){
        const t=tips[i];
        const one={
          guild_id:guildId, legs:t.legs, odds:t.odds, units:t.units, bookmaker:t.bookmaker,
          game_name:t.game_name, sport:t.sport, delay_minutes:delay, image_b64:t.image_b64||""
        };
        try{
          const r=await api("/api/queue-tip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(one)});
          const {j,raw}=await readBody(r);
          if(r.ok&&j&&j.ok){ ok++; }
          else{ lastErr=failMsg(r,j,raw); break; }
        }catch(e){
          if(e&&e.unauth)throw e;
          lastErr="Couldn't reach the bot.";
          break;
        }
      }
      return {ok:ok, lastErr:lastErr};
    }
    try{
      const r=await api("/api/queue-tips",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const {j,raw}=await readBody(r);
      if(r.ok&&j&&j.ok){
        const n=BATCH.tips.length;
        clearBatch();
        BUILD.legs=[]; BUILD.image=null;
        clearMultiDraft(guildId);
        if($("tray"))$("tray").hidden=true;
        if(window.NDConfirmPop)NDConfirmPop.show({label:n+" tips scheduled",color:"#2eaf62"});
        toast(n+" tip"+(n===1?"":"s")+" scheduled"+(trickle?" (trickle on)":""));
        loadDetail(guildId);
        return;
      }
      if(r.status===404){
        if(trickle){
          setErr("Bot is updating — Trickle API not live yet. Try again in a minute.");
          if(btn)btn.disabled=false;
          return;
        }
        // Fallback: sequential queue-tip (same delay_minutes, no fake stagger).
        setErr("Trickle API not live — falling back to sequential schedule…");
        const fb=await sequentialFallback();
        if(fb.ok===tips.length){
          const n=tips.length;
          clearBatch();
          BUILD.legs=[]; BUILD.image=null;
          clearMultiDraft(guildId);
          if($("tray"))$("tray").hidden=true;
          if(window.NDConfirmPop)NDConfirmPop.show({label:n+" tips scheduled",color:"#2eaf62"});
          toast(n+" tip"+(n===1?"":"s")+" scheduled (legacy fallback)");
          loadDetail(guildId);
          return;
        }
        setErr(fb.lastErr||("Bot is updating — Trickle API not live yet. Try again in a minute."+(fb.ok?" ("+fb.ok+"/"+tips.length+" queued)":"")));
        if(btn)btn.disabled=false;
        return;
      }
      setErr(failMsg(r,j,raw));
      if(btn)btn.disabled=false;
    }catch(e){
      if(e&&e.unauth)return renderLogin("Session expired.");
      setErr("Couldn't reach the bot.");
      if(btn)btn.disabled=false;
    }
  }
  // Downscale + JPEG-compress client-side so only a small image ever travels.
  function compressImage(file,maxDim,quality){
    maxDim=maxDim||1600; quality=quality||0.7;
    return new Promise((res,rej)=>{
      const img=new Image(),url=URL.createObjectURL(file);
      img.onload=()=>{ URL.revokeObjectURL(url);
        let w=img.naturalWidth,h=img.naturalHeight; const sc=Math.min(1,maxDim/Math.max(w,h));
        w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(c.toDataURL("image/jpeg",quality)); }catch(e){ rej(e); } };
      img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("bad image")); };
      img.src=url;
    });
  }

    NDCountdownConfirm.open({
      title:"Schedule this tip?",
      message:BUILD.legs.length+"-leg "+(BUILD.custom?"custom tip":"multi")+" @ <b>"+odds+"</b> for <b>"+units+"u</b>"+dollarNote+" — posts to Discord.",
      seconds:5,confirmLabel:"Schedule now",secondaryLabel:"Cancel",accent:"#5b8cff",
      onConfirm:()=>doSchedule(odds,units),
    });
  }
  async function doSchedule(odds,units){
    $("schedbtn").disabled=true;
    const payload={guild_id:BUILD.guildId,legs:BUILD.legs,odds,units,bookmaker:$("f_book").value,
      game_name:BUILD.custom?((BUILD.customEvent||"").trim()):(BUILD.game?teamName(BUILD.game.hteam)+" v "+teamName(BUILD.game.ateam):""),
      sport:BUILD.custom?(((BUILD.customSport||"").trim()||"Other").toUpperCase()):"AFL",
      delay_minutes:parseInt($("f_delay").value||"0",10),
      image_b64:BUILD.image||""};
    try{const r=await api("/api/queue-tip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const j=await r.json();
      if(r.ok&&j.ok){ if(window.NDConfirmPop)NDConfirmPop.show({label:"Tip scheduled",color:"#2eaf62"}); BUILD.legs=[]; BUILD.image=null; clearMultiDraft(BUILD.guildId); $("tray").hidden=true; renderBatchTray(); loadDetail(BUILD.guildId); }
      else{ $("scherr").textContent=j.message||"Couldn't schedule."; $("schedbtn").disabled=false; }
    }catch(e){ if(e.unauth)return renderLogin("Session expired."); $("scherr").textContent="Couldn't reach the bot."; $("schedbtn").disabled=false; }
  }
  function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}

  async function load(){
    const hash=new URLSearchParams(location.hash.slice(1));
    if(hash.get("error")){history.replaceState(null,"",location.pathname);return renderLogin(ERR[hash.get("error")]||"Login error.");}
    if(hash.get("token")){setToken(hash.get("token"));history.replaceState(null,"",location.pathname);}
    if(!getToken())return renderLogin();
    try{ setLoadPanel("Starting…", 2); }catch(e){}
    warmTipBot();
    const cached=readBootCache();
    let paintedFromCache=false;
    if(cached && (cached.servers||cached.follower_servers)){
      applyBootPayload(cached, {armTheme:true});
      show("app");
      enterHome();
      paintedFromCache=true;
      TopBar.start(false);
      TopBar.set(35, "Refreshing…");
    }else{
      show("loading");
      TopBar.start(false);
      TopBar.set(8, "Checking session…");
    }
    try{
      if(!paintedFromCache) TopBar.set(22, "Connecting…");
      // lite=1 skips N× server_stats — paint fast; hydrate full stats after.
      const r=await api("/api/servers?lite=1");
      if(!paintedFromCache) TopBar.set(72, "Loading servers…");
      else TopBar.set(70, "Updating servers…");
      if(!r.ok){
        TopBar.done(true);
        if(paintedFromCache) return; // keep stale UI
        return renderLogin();
      }
      const data=await r.json();
      writeBootCache(data);
      applyBootPayload(data);
      if(!paintedFromCache){
        TopBar.set(92, "Almost ready…");
        show("app");
        enterHome();
      }else if(!$("overview").hidden || !$("detail").hidden){
        // Re-render home cards with fresh lite payload (stats may fill next).
        try{ enterHome(); }catch(e){}
      }
      TopBar.done(true);
      // Background: full stats for home cards (non-blocking).
      api("/api/servers?lite=0").then(async function(r2){
        if(!r2 || !r2.ok) return;
        try{
          const full=await r2.json();
          writeBootCache(full);
          STATE.servers=full.servers||STATE.servers;
          STATE.followerServers=full.follower_servers||STATE.followerServers;
          if(full.theme_prefs) hydrateTheme(full.theme_prefs);
          if(!$("overview").hidden) try{ renderOverview(); }catch(e){}
        }catch(e){}
      }).catch(function(){});
    }catch(e){
      TopBar.done(true);
      if(paintedFromCache) return; // offline/cold — keep cached UI
      if(e.unauth)return renderLogin();
      renderLogin("Couldn't reach the bot — try again in a moment.");
    }
  }
  // ── Theme sync per account (#44) ──────────────────────────────────────────
  // localStorage is the per-device cache + pre-paint source; the server copy is
  // the account's source of truth, applied on login so the theme follows you
  // across devices. Saves fire on any appearance change (once sync is armed).
  let THEME_SYNC_READY=false;
  function saveThemePrefs(){
    if(!THEME_SYNC_READY||!getToken())return;
    let body={};try{body={theme:localStorage.getItem("tipbot_theme"),auto:localStorage.getItem("tipbot_theme_auto")==="true",accent:localStorage.getItem("tipbot_theme_accent")};}catch(e){}
    try{ api("/api/theme",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).catch(()=>{}); }catch(e){}
  }
  ["set","setAuto","setAccent"].forEach(function(fn){
    const orig=TB.theme&&TB.theme[fn];
    if(typeof orig==="function")TB.theme[fn]=function(){const r=orig.apply(this,arguments);saveThemePrefs();return r;};
  });
  function hydrateTheme(tp){
    // Server prefs win over the local cache, then get cached locally.
    if(tp){
      try{
        if(tp.theme){localStorage.setItem("tipbot_theme",tp.theme);}
        localStorage.setItem("tipbot_theme_auto",tp.auto?"true":"false");
        if(tp.accent){localStorage.setItem("tipbot_theme_accent",tp.accent);}else{localStorage.removeItem("tipbot_theme_accent");}
        localStorage.removeItem("tipbot_theme_manual_date");
      }catch(e){}
      try{TB.theme.init();TB.theme.mount($("tb-appearance"));}catch(e){}
    }
    THEME_SYNC_READY=true;   // arm saves only after the login hydrate settles
  }
  TB.theme.init(); TB.theme.mount($("tb-appearance")); TB.bookie.init();
  try{ if(getToken()) warmTipBot(); }catch(e){}
  load();
</script>
</body>
