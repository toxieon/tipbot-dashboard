<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/logo.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%230f1420%27/%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%279.5%27%20fill%3D%27none%27%20stroke%3D%27%237b5bff%27%20stroke-width%3D%272.6%27/%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%274%27%20fill%3D%27%235b8cff%27/%3E%3C/svg%3E">
<title>TipBot Dashboard</title>
<script>
/* Theme pre-paint: set data-theme before first paint to avoid a flash (Codex #1). */
(function(){
  try {
    var d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var name=localStorage.getItem('tipbot_theme'),auto=localStorage.getItem('tipbot_theme_auto')==='true';
    var valid=['navy','day','ochre'].indexOf(name)!==-1;
    document.documentElement.dataset.theme=valid&&(!auto||localStorage.getItem('tipbot_theme_manual_date')===day)?name:auto?(d.getHours()>=7&&d.getHours()<19?'day':'navy'):'navy';
    var accent=localStorage.getItem('tipbot_theme_accent');
    if(/^#[0-9a-f]{6}$/i.test(accent||''))document.documentElement.style.setProperty('--accent',accent);
  }catch(e){document.documentElement.dataset.theme='navy';}
}());
</script>
<style>
  :root{
    --bg:#0b0f1a;--bg2:#0f1420;--card:#151b2b;--card2:#1a2133;--line:#26304a;
    --txt:#eef2fa;--muted:#8a95ad;--faint:#5c6785;
    --accent:#5b8cff;--accent2:#7b5bff;--win:#2eaf62;--loss:#e5595f;--push:#5c6785;--radius:16px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 80% -10%, #182142 0%, var(--bg) 55%) fixed, var(--bg);
       color:var(--txt);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 20px 90px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:16px}
  .brand .sub{font-weight:500;color:var(--muted);font-size:12px;margin-left:2px}
  .menu{position:relative}
  .gear{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:17px;color:var(--muted)}
  .gear:hover{color:var(--txt)}
  .dropdown{position:absolute;right:0;top:46px;background:var(--card2);border:1px solid var(--line);border-radius:14px;min-width:220px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:30}
  .dd-item{padding:9px 11px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .dd-item:hover{background:#222c44}
  .dd-label{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 11px 4px}
  .danger{color:var(--loss)}
  .viewas{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,rgba(123,91,255,.18),rgba(91,140,255,.10));border:1px solid #34407a;border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px}
  .viewas b{color:#c9d4ff}
  .link{color:var(--accent);cursor:pointer;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
  .scard:hover{transform:translateY(-2px);border-color:#3a4772;background:var(--card2)}
  .scard .row1{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
  .sname{font-weight:700;font-size:16px}.sgid{color:var(--faint);font-size:12px}
  .plan{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px;text-transform:capitalize}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.on{background:var(--win)}.dot.off{background:var(--push)}
  .mini{display:flex;gap:18px;flex-wrap:wrap}.mini .m{display:flex;flex-direction:column}
  .mini .mv{font-weight:700;font-size:18px}.mini .ml{color:var(--faint);font-size:11px;text-transform:uppercase}
  .pos{color:var(--win)}.neg{color:var(--loss)}
  .back{color:var(--muted);cursor:pointer;font-size:14px;display:inline-flex;gap:6px;margin-bottom:14px}.back:hover{color:var(--txt)}
  .dhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .dhead h1{margin:0;font-size:24px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .tile .tv{font-weight:800;font-size:26px;line-height:1.1}.tile .tl{color:var(--faint);font-size:12px;text-transform:uppercase;margin-top:4px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px}
  .panel h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .wlbar{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;background:var(--bg2)}.wlbar>span{display:block}
  .wl-legend{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:7px}.sw{width:10px;height:10px;border-radius:3px}
  .switches{display:flex;gap:12px;flex-wrap:wrap}
  .switch{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 14px}
  .toggle{width:44px;height:25px;border-radius:999px;background:#43506b;position:relative;cursor:pointer;border:none;flex:none;transition:background .15s}
  .toggle.on{background:var(--win)}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s}.toggle.on::after{left:22px}
  .tips-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.tips-cols{grid-template-columns:1fr}}
  .tip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.tip:last-child{border-bottom:none}
  .tip .g{font-weight:600;font-size:14px}.tip .meta{color:var(--faint);font-size:12px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .b-win{background:rgba(46,175,98,.16);color:#5fd48c}.b-loss{background:rgba(229,89,95,.16);color:#ff9a9e}.b-push{background:rgba(92,103,133,.2);color:#b3bdd6}.b-pending{background:rgba(91,140,255,.16);color:#9db8ff}
  .num.pos{color:var(--win);font-weight:700}.num.neg{color:var(--loss);font-weight:700}
  .empty{color:var(--faint);font-size:13px;padding:14px 0}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:11px;padding:11px 18px;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.sm{padding:8px 14px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
  .center{min-height:74vh;display:grid;place-items:center;text-align:center}.center h1{margin:0 0 6px}.center p{color:var(--muted);margin:0 0 20px}
  .err{color:var(--loss)}
  /* builder */
  .gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .12s,transform .12s}
  .gcard:hover{border-color:#3a4772;transform:translateY(-2px)}
  .gcard .rd{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .gcard .mt{font-weight:700;font-size:16px}.gcard .vn{color:var(--muted);font-size:12px;margin-top:6px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
  .tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab.mkt{border-color:#5a3a7a;color:#c9a5ff}
  .tab.mkt.active{background:#7b5bff;border-color:#7b5bff;color:#fff}
  .teamhdr{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
  .compchip{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
  .compchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .compbadge{font-size:10px;font-weight:800;letter-spacing:.04em;background:#1f3a5c;color:#9fc7ff;padding:1px 7px;border-radius:999px;vertical-align:middle}
  .compbadge.aflw{background:#5a1f4a;color:#ff9fe0}
  .thdr{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .thdr:hover{color:var(--muted)}
  .tcaret{font-size:11px;color:var(--muted);width:12px;display:inline-block}
  .prow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
  .pnum{display:grid;place-items:center;flex:none}
  .pname{font-weight:600;min-width:150px;flex:1}
  .linectl{display:flex;align-items:center;gap:12px;flex:1;min-width:240px}
  .lineval{font-weight:800;font-size:20px;min-width:66px;text-align:center}
  .lineval small{font-size:12px;color:var(--muted);font-weight:600}
  input[type=range]{flex:1;accent-color:var(--accent);height:4px}
  .ou{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .ou button{background:var(--card2);border:none;color:var(--muted);padding:7px 12px;cursor:pointer;font:inherit;font-weight:700;font-size:13px}
  .ou button.on{background:var(--accent);color:#fff}
  .addbtn{background:rgba(46,175,98,.16);color:#5fd48c;border:1px solid rgba(46,175,98,.4);border-radius:9px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:700}
  .addbtn:hover{background:rgba(46,175,98,.26)}
  /* multi tray */
  .tray{position:fixed;left:0;right:0;bottom:0;background:var(--card2);border-top:1px solid var(--line);box-shadow:0 -14px 40px rgba(0,0,0,.4);z-index:40}
  .tray-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legchips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
  .chip .x{color:var(--faint);cursor:pointer;font-weight:700}
  .chip .x:hover{color:var(--loss)}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
  .field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .field input,.field select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font:inherit}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--win);color:#04120a;font-weight:700;padding:12px 20px;border-radius:12px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  [hidden]{display:none!important}

/* ===== Codex theme + chips + multi + bookies (items 1-6,8) ===== */
/* TipBot items 1–2. Paste at the END of the existing <style> block. */
:root,html[data-theme="navy"] {
  color-scheme:dark;
  --bg:#0b0f1a;--bg2:#0f1420;--card:#151b2b;--card2:#1a2133;--line:#26304a;
  --txt:#eef2fa;--muted:#8a95ad;--faint:#8591ab;
  --accent:#5b8cff;--accent2:#7b5bff;--on-accent:#0b0f1a;
  --win:#2eaf62;--loss:#e5595f;--push:#5c6785;--void:#6b7280;--radius:16px;
  --win-ink:#65d38f;--loss-ink:#ff9a9e;--push-ink:#b3bdd6;--void-ink:#bfc5d0;
}
html[data-theme="day"] {
  color-scheme:light;
  --bg:#f5f7fb;--bg2:#eef2f8;--card:#ffffff;--card2:#eef2f9;--line:#dbe2ee;
  --txt:#0f1726;--muted:#5a6577;--faint:#626d7f;
  --accent:#245ad6;--accent2:#6844d9;--on-accent:#ffffff;
  --win:#2eaf62;--loss:#e5595f;--push:#5c6785;--void:#6b7280;--radius:16px;
  --win-ink:#166536;--loss-ink:#a8252d;--push-ink:#43506a;--void-ink:#4d5563;
}
html[data-theme="ochre"] {
  color-scheme:dark;
  --bg:#17110c;--bg2:#1e160e;--card:#241a10;--card2:#2c2015;--line:#4a3927;
  --txt:#f6efe6;--muted:#b7a892;--faint:#ae9b81;
  --accent:#e0a04a;--accent2:#c8792f;--on-accent:#17110c;
  --win:#2eaf62;--loss:#e5595f;--push:#5c6785;--void:#6b7280;--radius:16px;
  --win-ink:#65d38f;--loss-ink:#ff9a9e;--push-ink:#b3bdd6;--void-ink:#bfc5d0;
}
:root {
  --nd-surface:var(--card2);--nd-border:var(--line);--nd-text:var(--txt);--nd-muted:var(--muted);
  --nd-skeleton:var(--card2);
}
body {background:var(--bg);font-variant-numeric:tabular-nums;}
.logo,.btn {background:var(--accent);color:var(--on-accent);}
.btn {border:1px solid var(--accent);border-radius:13px;}
.btn:hover:not(:disabled) {background:var(--accent);background:color-mix(in srgb,var(--accent) 92%,white);color:var(--on-accent-hover,var(--on-accent));}
.ghost {border-radius:13px;}
.viewas {background:var(--card2);border-color:var(--line);}
.viewas b {color:var(--txt);}
.dd-item:hover {background:var(--bg2);}
.scard:hover,.gcard:hover {border-color:var(--accent);}
.toggle {background:var(--push);}
.tab.active,.compchip.on,.ou button.on {color:var(--on-accent);}
.tab.mkt {border-color:var(--line);color:var(--txt);}
.tab.mkt.active {background:var(--card2);border-color:var(--accent2);color:var(--txt);}
.compbadge,.compbadge.aflw {background:var(--card2);color:var(--txt);border:1px solid var(--line);}
.addbtn,.b-win {background:var(--card2);color:var(--win-ink);border:1px solid var(--win);}
.addbtn:hover {background:var(--card);}
.b-loss {background:var(--card2);color:var(--loss-ink);}
.b-push {background:var(--card2);color:var(--push-ink);}
.b-pending {background:transparent;color:var(--muted);border:1px solid var(--faint);}
.num.pos,.pos {color:var(--win-ink);}.num.neg,.neg {color:var(--loss-ink);}
.tip {flex-wrap:wrap;}.tb-result {display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.tb-result .num {white-space:nowrap;}.tb-quote {font-size:12px;color:var(--muted);white-space:nowrap;}
.dropdown {width:324px;max-width:calc(100vw - 40px);max-height:calc(100dvh - 100px);overflow:auto;box-shadow:0 8px 20px rgb(0 0 0 / 12%);}
.nd-sk::after {background:none!important;animation:none!important;}
.nd-sk {background:var(--card2)!important;}
#adminpanel {border-color:var(--line)!important;box-shadow:none!important;}
#admintoggle,#adminbody .dbgqbtn {color:var(--txt)!important;}
#admintoggle>span:last-child,#adminbody .dbgqbtn {background:var(--card2)!important;border-color:var(--line)!important;}
.delbet,.gradebtn[data-r="Loss"],#leaveserverbtn {background:var(--card2)!important;color:var(--loss-ink)!important;border-color:var(--loss)!important;}
.gradebtn[data-r="Win"] {background:var(--card2)!important;color:var(--win-ink)!important;border-color:var(--win)!important;}
button:focus-visible,a:focus-visible,input:focus-visible {outline:2px solid var(--txt);outline-offset:3px;}
.tb-appearance {border-top:1px solid var(--line);padding:14px 10px 8px;margin-top:6px;}
.tb-appearance h3 {font-size:13px;margin:0 0 10px;color:var(--txt);}
.tb-swatches {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.tb-swatch {border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;padding:6px;font:inherit;font-size:12px;cursor:pointer;text-align:left;}
.tb-swatch[aria-pressed="true"] {border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.tb-swatch-label {display:flex;justify-content:space-between;padding-top:5px;}
.tb-swatch-label::after {content:'✓';visibility:hidden;}.tb-swatch[aria-pressed="true"] .tb-swatch-label::after {visibility:visible;}
.tb-mini {display:flex;align-items:flex-end;gap:4px;height:42px;padding:8px;border-radius:7px;background:var(--preview-bg);}
.tb-mini::before {content:'';height:20px;width:26px;border-radius:4px;background:var(--preview-accent);margin-right:auto;}
.tb-mini i {width:7px;height:7px;border-radius:50%;background:var(--win);}.tb-mini i+i {background:var(--loss);}
.tb-swatch[data-tb-theme="navy"] {--preview-bg:#0b0f1a;--preview-accent:#5b8cff;}
.tb-swatch[data-tb-theme="day"] {--preview-bg:#f5f7fb;--preview-accent:#245ad6;}
.tb-swatch[data-tb-theme="ochre"] {--preview-bg:#17110c;--preview-accent:#e0a04a;}
.tb-setting {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:13px;}
.tb-setting input[type="checkbox"] {width:18px;height:18px;accent-color:var(--accent);cursor:pointer;}
.tb-setting input[type="color"] {height:30px;width:44px;padding:2px;background:var(--card);border:1px solid var(--line);border-radius:6px;cursor:pointer;}
.tb-text-button {background:none;border:0;color:var(--txt);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:6px 0;}
.tb-text-button:disabled {color:var(--muted);cursor:default;text-decoration:none;}
.tb-theme-note {font-size:12px;color:var(--muted);line-height:1.5;min-height:3em;margin:8px 0 0;}
.tbchip {--state:var(--faint);--state-ink:var(--muted);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:74px;min-height:26px;padding:3px 9px;border:1px solid var(--state);border-radius:999px;color:var(--state-ink);font-size:11px;font-weight:700;line-height:18px;white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums;isolation:isolate;}
.tbchip::before {content:'';position:absolute;inset:0;border-radius:inherit;background:var(--state);opacity:.15;z-index:-1;}
.tbchip--win {--state:var(--win);--state-ink:var(--win-ink);}
.tbchip--loss {--state:var(--loss);--state-ink:var(--loss-ink);}
.tbchip--push {--state:var(--push);--state-ink:var(--push-ink);}
.tbchip--void {--state:var(--void);--state-ink:var(--void-ink);border-style:dashed;}
.tbchip--pending::before {display:none;}
.tbchip-symbol {display:inline-block;width:10px;text-align:center;font-size:12px;}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {animation:none!important;transition:none!important;scroll-behavior:auto!important;}
  .scard:hover,.gcard:hover {transform:none;}
}

/* Paste after theme-chips.css in the existing <style>. */
:root {--warn:#e0a04a;--warn-ink:#f0bf79;--api:#5b8cff;--api-ink:#9ebdff;}
html[data-theme="day"] {--warn-ink:#775018;--api-ink:#2455b5;}
html[data-theme="ochre"] {--warn-ink:#f0bf79;--api-ink:#9ebdff;}
.tb-tip-tags {display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;}
.tb-tip-tags:empty {display:none;}
.tb-kind,.tb-settle {display:inline-flex;align-items:center;gap:4px;max-width:100%;white-space:nowrap;font-size:10px;line-height:17px;font-weight:650;vertical-align:middle;font-variant-numeric:tabular-nums;}
.tb-kind {border:1px solid var(--accent);border-radius:5px;padding:0 6px;color:var(--txt);background:var(--card2);letter-spacing:.03em;}
.tb-kind--cross {border-color:var(--accent2);}
.tb-settle {color:var(--muted);}
.tb-settle--api {color:var(--api-ink);}.tb-settle--god {color:var(--warn-ink);}
.tb-settle--api>span {color:var(--api);}.tb-settle--god>span {color:var(--warn);}
.tb-multi-summary {display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tb-multi-summary:empty {display:none;}
.tbwarn {position:relative;isolation:isolate;border-left:2px solid var(--warn);border-radius:4px;margin:0;padding:7px 10px;color:var(--warn-ink);font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums;}
.tbwarn::before {content:'';position:absolute;inset:0;background:var(--warn);opacity:.09;z-index:-1;border-radius:inherit;}
.tray .tb-multi-summary {flex-basis:100%;}
.tb-review-kind {margin:0 0 14px;}
.tray .x {background:none;border:0;font:inherit;padding:0 2px;cursor:pointer;}
@media(max-width:600px){.tray .legchips{flex-basis:100%;}.tray .btn{width:100%;}.tray{max-height:48vh;overflow:auto;}}
/* Paste after the existing TB CSS. Brand colours are isolated from outcome tokens. */
.tb-bookie{position:relative;display:inline-grid;place-items:center;flex:none;vertical-align:middle;width:var(--bookie-size,24px);height:var(--bookie-size,24px);border-radius:6px;overflow:hidden;background:var(--card2);color:var(--txt);border-bottom:2px solid var(--bookie-color,var(--line));font-variant-numeric:tabular-nums;}
.tb-bookie-fallback{font-size:calc(var(--bookie-size,24px) * .38);font-weight:800;line-height:1;}
.tb-bookie img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--card2);}
.tb-bookie-label{display:inline-flex;align-items:center;gap:7px;max-width:100%;vertical-align:middle;}
.tb-bookie-label>span:last-child{overflow-wrap:anywhere;}
.tip .meta .tb-bookie{margin:2px 0;}
.tb-bookmaker-picker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.tb-bookmaker-picker select{flex:1;min-width:160px;}
.tb-bookmaker-selected{font-size:13px;min-height:30px;}


/* Follower promo chips — Expansion Pass stack (wrap is fixed; chips are NOT) */
.tb-promo-wrap{
  position:fixed;right:16px;bottom:16px;z-index:80;
  display:flex;flex-direction:column;gap:10px;align-items:stretch;
  width:min(268px,calc(100vw - 32px));
}
.tb-promo-slot{position:relative;width:100%;will-change:transform,opacity,max-height}
.tb-promo-chip{
  position:relative; /* critical: was fixed → both chips overlapped */
  display:flex;align-items:center;gap:10px;
  width:100%;box-sizing:border-box;
  padding:11px 40px 11px 10px;
  border:none;border-radius:999px;cursor:pointer;
  background:linear-gradient(90deg,#ffe566 0%,#7bc96f 55%,#1f8a4c 100%);
  box-shadow:0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35);
  font:inherit;color:#111;text-align:left;
  animation:tb-promo-pulse 2.6s ease-in-out infinite;
  transition:transform .28s ease,opacity .28s ease,filter .12s ease;
}
@keyframes tb-promo-pulse{
  0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 0 rgba(255,255,255,0)}
  50%{box-shadow:0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 10px rgba(255,255,255,.10)}
}
.tb-promo-chip:hover{filter:brightness(1.05);transform:translateY(-1px)}
.tb-promo-chip:active{transform:translateY(0)}
.tb-promo-slot{
  transition:max-height .32s ease,margin .32s ease,opacity .3s ease,transform .3s ease;
  max-height:96px;overflow:visible;
}
.tb-promo-slot.tb-promo-out{
  transform:translateX(120%);opacity:0;pointer-events:none;
  max-height:0;margin:0!important;overflow:hidden;
}
@media (prefers-reduced-motion:reduce){
  .tb-promo-chip{animation:none!important}
  .tb-promo-slot{transition:opacity .2s ease,max-height .2s ease}
  .tb-promo-slot.tb-promo-out{transform:none}
}
.tb-promo-chip .tb-promo-chev{
  flex:none;width:22px;height:22px;border-radius:999px;background:#fff;
  display:grid;place-items:center;font-weight:800;font-size:13px;color:#111;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.tb-promo-chip .tb-promo-bag{
  flex:none;width:28px;height:28px;border-radius:8px;
  background:rgba(255,255,255,.92);border:2px solid #f0a020;
  display:grid;place-items:center;font-size:14px;line-height:1;
}
.tb-promo-chip--discover .tb-promo-bag{border-color:#3a6fd0}
.tb-promo-chip .tb-promo-copy{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
}
.tb-promo-chip .tb-promo-kicker{
  display:block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(0,0,0,.55);line-height:1.2;
}
.tb-promo-chip .tb-promo-title{
  display:block;font-size:15px;font-weight:800;color:#111;line-height:1.2;
}
.tb-promo-chip .tb-promo-sub{
  display:block;font-size:11px;font-weight:600;color:rgba(0,0,0,.62);line-height:1.25;
}
.tb-promo-chip--discover{
  background:linear-gradient(90deg,#9ad4ff 0%,#5b8cff 55%,#3558c4 100%);
}
.tb-promo-chip--discover .tb-promo-kicker,
.tb-promo-chip--discover .tb-promo-title,
.tb-promo-chip--discover .tb-promo-sub{color:#0b1220}
.tb-promo-x{
  position:absolute;top:-8px;right:-8px;z-index:2;
  width:24px;height:24px;border-radius:999px;
  border:none;background:var(--card2,#1a1f2b);color:var(--txt,#fff);font-size:13px;cursor:pointer;
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4);
  border:1px solid var(--line,rgba(255,255,255,.12));
}
.tb-promo-chip .mt-settlebtn{font-size:11px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;font:inherit}

#mytips .mt-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
#mytips .mt-row:last-child{border-bottom:none}

/* Discover page polish */
.dc-hero{
  margin:0 0 18px;padding:18px 20px;border-radius:16px;
  border:1px solid var(--line);background:var(--card);
  background-image:linear-gradient(135deg,rgba(91,140,255,.14),transparent 55%),linear-gradient(225deg,rgba(46,175,98,.08),transparent 40%);
}
.dc-hero h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
.dc-hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;max-width:42em}
.dc-spotlight{
  margin:0 0 18px;padding:18px 20px;border-radius:16px;
  border:1px solid var(--line);background:var(--card2);
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
}
.dc-spotlight .dc-av{
  width:56px;height:56px;border-radius:999px;flex:none;
  display:grid;place-items:center;font-weight:800;font-size:22px;
  background:linear-gradient(145deg,#5b8cff,#2eaf62);color:#fff;
}
.dc-spotlight .dc-net{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}
.dc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.dc-card{
  border:1px solid var(--line);border-radius:14px;background:var(--card);
  padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;
}
.dc-card .dc-top{display:flex;gap:12px;align-items:center}
.dc-card .dc-av{
  width:40px;height:40px;border-radius:999px;flex:none;
  display:grid;place-items:center;font-weight:800;font-size:15px;
  background:var(--card2);border:1px solid var(--line);color:var(--accent);
}
.dc-card .dc-name{font-weight:750;font-size:15px;line-height:1.2}
.dc-card .dc-meta{font-size:12px;color:var(--faint);margin-top:2px}
.dc-card .dc-stats{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dc-card .dc-net{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.dc-empty{
  text-align:center;padding:36px 20px;border-radius:16px;border:1px dashed var(--line);
  background:var(--card);
}
.dc-empty .dc-empty-mark{
  width:64px;height:64px;margin:0 auto 14px;border-radius:18px;
  display:grid;place-items:center;font-size:28px;
  background:linear-gradient(145deg,rgba(91,140,255,.25),rgba(46,175,98,.18));
  border:1px solid var(--line);
}
.dc-empty h3{margin:0 0 8px;font-size:18px}
.dc-empty p{margin:0 auto;max-width:28em;color:var(--muted);font-size:13px;line-height:1.5}
.dc-card:hover{background:var(--card2);transform:translateY(-2px)}
.dc-card{transition:background .12s,transform .12s}
.dc-card .dc-av, .dc-spotlight .dc-av{overflow:hidden}
img.dc-av{object-fit:cover;padding:0;border:1px solid var(--line);display:block}
.dc-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dc-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.dc-pill--w{background:rgba(46,175,98,.16);color:#5fd48c}
.dc-pill--l{background:rgba(229,89,95,.16);color:#ff9a9e}
.dc-mini{display:block;margin-top:8px;width:100%;height:32px;overflow:visible}
.dc-mini--wide{height:36px}
.tb-comm-chip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;line-height:1.3}
.tb-comm-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.dc-spotlight{border-left:4px solid var(--win)}
.dc-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

<div class="wrap">

</div>

<script>
/* ===== Reusable UI assets (ND*) — inlined, self-contained ===== */
/* =========================================================================
 *  status-tint.js — tint a card by a value vs a target  (reusable asset)
 *
 *  The "how am I doing" colour: compare a number to a target and tint a whole
 *  container — red under, gold over, green bang on. Same idea as SWB's circuit
 *  overload card and the Timesheet interactive-times day cards.
 *
 *  No dependencies. Self-injects its CSS. Exposes a global `NDStatusTint`:
 *
 *    NDStatusTint.classify(value, target, opts) -> "under" | "exact" | "over"
 *        opts.epsilon (default 0.01) — how close counts as "exact".
 *
 *    NDStatusTint.classNames(value, target, opts) -> "nd-tint nd-over …"
 *        Ready-to-drop class string for template rendering.
 *        opts.lowVis -> also colours all text in the box to match.
 *
 *    NDStatusTint.apply(el, value, target, opts)
 *        Set the classes on a live element (clears any previous tint first).
 *
 *    NDStatusTint.clear(el)
 *
 *  Meaning is fixed (under=bad/red, over=good/gold, exact=green) because that's
 *  the shared language across the suite. Add class "nd-tint" + a status class
 *  to any element with a full border and it tints.
 * ========================================================================= */
(function (root) {
  "use strict";
  if (root.NDStatusTint) return;
  var doc = root.document;

  function ensureStyles() {
    if (!doc || doc.getElementById("nd-tint-css")) return;
    var s = doc.createElement("style");
    s.id = "nd-tint-css";
    s.textContent =
      ".nd-tint.nd-under{border-color:#e5484d !important;background:rgba(229,72,77,0.07);box-shadow:0 0 0 1px rgba(229,72,77,0.28),0 0 18px rgba(229,72,77,0.12);}" +
      ".nd-tint.nd-over{border-color:#e3b341 !important;background:rgba(227,179,65,0.07);box-shadow:0 0 0 1px rgba(227,179,65,0.30),0 0 18px rgba(227,179,65,0.14);}" +
      ".nd-tint.nd-exact{border-color:#3ab87a !important;background:rgba(58,184,122,0.06);box-shadow:0 0 0 1px rgba(58,184,122,0.22);}" +
      ".nd-tint.nd-lowvis.nd-under,.nd-tint.nd-lowvis.nd-under *{color:#e5484d !important;}" +
      ".nd-tint.nd-lowvis.nd-over,.nd-tint.nd-lowvis.nd-over *{color:#e3b341 !important;}" +
      ".nd-tint.nd-lowvis.nd-exact,.nd-tint.nd-lowvis.nd-exact *{color:#3ab87a !important;}";

  }
  if (doc) ensureStyles();

  function classify(value, target, opts) {
    opts = opts || {};
    var eps = opts.epsilon == null ? 0.01 : opts.epsilon;
    var v = Number(value), t = Number(target);
    if (v > t + eps) return "over";
    if (v < t - eps) return "under";
    return "exact";

    opts = opts || {};

  function clear(el) {
    if (!el) return;

  function apply(el, value, target, opts) {
    if (!el) return;
    ensureStyles();
    clear(el);
    el.classList.add("nd-tint", "nd-" + classify(value, target, opts));

  var API = { classify: classify, classNames: classNames, apply: apply, clear: clear };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  root.NDStatusTint = API;
})(typeof window !== "undefined" ? window : globalThis);
/* =========================================================================
 *  skeleton.js — shimmer placeholders  (reusable asset)
 *
 *  Animated placeholder blocks while data loads, so lists/grids fade in
 *  instead of popping from empty — planner project list, search photo grid,
 *  timesheet history. Returns HTML you drop into a container until the real
 *  content is ready.
 *
 *  No dependencies. Self-injects CSS. Global `NDSkeleton`:
 *    NDSkeleton.lines(n, { lastWidth })   -> HTML of n shimmer lines
 *    NDSkeleton.box(width, height, radius) -> one shimmer block
 *    NDSkeleton.grid(n, { cols, tile })    -> a shimmer tile grid

 * ========================================================================= */
(function (root) {
  "use strict";
  if (root.NDSkeleton) return;
  var doc = root.document;

  function css() {
    if (!doc || doc.getElementById("nd-sk-css")) return;
    var s = doc.createElement("style");
    s.id = "nd-sk-css";
    s.textContent =
      ".nd-sk{position:relative;overflow:hidden;background:rgba(255,255,255,0.06);border-radius:8px;}" +
      ".nd-sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,0.09),transparent);animation:nd-sk 1.3s infinite;}" +
      ".nd-sk-line{height:12px;margin:9px 0;}" +
      ".nd-sk-grid{display:grid;gap:10px;}" +
      "@keyframes nd-sk{100%{transform:translateX(100%);}}" +
      "@media(prefers-reduced-motion:reduce){.nd-sk::after{animation:none;}}";

  }

  function box(w, h, r) { css(); return '<div class="nd-sk" style="width:' + (w || "100%") + ";height:" + (h || "80px") + ";border-radius:" + (r || "8px") + '"></div>'; }
  function lines(n, opts) {
    css(); opts = opts || {}; n = n || 3;
    var out = "";
    for (var i = 0; i < n; i++) { var w = (i === n - 1) ? (opts.lastWidth || "60%") : "100%"; out += '<div class="nd-sk nd-sk-line" style="width:' + w + '"></div>'; }
    return out;
  }
  function grid(n, opts) {
    css(); opts = opts || {}; n = n || 6;
    var cols = opts.cols || 3, tileH = opts.tile || "96px";
    var cells = "";
    for (var i = 0; i < n; i++) cells += '<div class="nd-sk" style="height:' + tileH + '"></div>';
    return '<div class="nd-sk-grid" style="grid-template-columns:repeat(' + cols + ',1fr)">' + cells + "</div>";

  var API = { css: css, box: box, lines: lines, grid: grid, into: into };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  root.NDSkeleton = API;
})(typeof window !== "undefined" ? window : globalThis);
/* =========================================================================
 *  countdown-confirm.js — auto-confirming prompt with a depleting bar
 *
 *  Origin: extracted from Timesheet's "near" clock-on prompt.
 *  Purpose: "assume yes, but give a moment to change your mind." Shows a
 *  bottom sheet with a bar that drains over N seconds and then fires
 *  onConfirm automatically — unless the user taps a button first.
 *
 *  Self-contained: injects its own styles + DOM. No dependencies. Picks up
 *  nd-core.css variables (--nd-surface, --nd-border, --nd-text) when present,
 *  otherwise falls back to a dark theme so it works dropped into any page.
 *
 *  Global `NDCountdownConfirm`:
 *
 *    NDCountdownConfirm.open({
 *      title,                 heading text
 *      message,               body text (HTML allowed)
 *      seconds = 4,           countdown length before auto-confirm
 *      confirmLabel = "Confirm",
 *      secondaryLabel,        optional middle button (e.g. "Change")

(function (root) {
  "use strict";
  if (typeof document === "undefined") { root.NDCountdownConfirm = { open: function () {} }; return; }

  function injectStyles() {
    if (document.getElementById("ndcc-styles")) return;

      ".ndcc-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity 180ms}" +
      ".ndcc-backdrop.ndcc-in{opacity:1}" +
      ".ndcc-sheet{background:var(--nd-surface,#1a1a1a);border:1px solid var(--nd-border,#2a2a2a);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:20px;color:var(--nd-text,#f0f0f0);font-family:var(--nd-sans,system-ui,-apple-system,'Segoe UI',sans-serif);transform:translateY(12px);transition:transform 200ms}" +
      ".ndcc-backdrop.ndcc-in .ndcc-sheet{transform:translateY(0)}" +
      ".ndcc-sheet h3{margin:0 0 10px;font-size:17px;font-weight:500}" +
      ".ndcc-msg{color:var(--nd-muted,#9aa0a8);font-size:13px;margin:0 0 4px}" +
      ".ndcc-wrap{height:6px;border-radius:999px;background:rgba(255,255,255,0.12);overflow:hidden;margin:14px 0 8px}" +
      ".ndcc-bar{height:100%;width:100%;border-radius:999px;background:var(--ndcc-accent,#3ab87a)}" +
      ".ndcc-hint{color:var(--nd-muted,#9aa0a8);font-size:12px;margin:0}" +
      ".ndcc-acts{display:flex;gap:10px;margin-top:14px}" +
      ".ndcc-b{flex:1;min-height:44px;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;border:1px solid var(--nd-border,#2a2a2a);font-family:inherit}" +
      ".ndcc-b.ghost{background:rgba(255,255,255,0.06);color:var(--nd-text,#f0f0f0)}" +
      ".ndcc-b.primary{color:#022014;border:0}";

    document.head.appendChild(s);
  }

  function open(opts) {
    opts = opts || {};
    injectStyles();
    var seconds = opts.seconds || 4;
    var accent = opts.accent || "#3ab87a";

    var backdrop = document.createElement("div");
    backdrop.className = "ndcc-backdrop";

<script>
  const API="https://afl-tipster-bot.onrender.com";
  const TOGGLES=[["enabled","Bot Enabled"],["subscription_active","Subscription"],["results_graph_enabled","Results Graph"]];
  const STATS={Disposals:[10,40,20],Goals:[0,6,2],"Fantasy Points":[40,140,80],Hitouts:[0,50,20],Marks:[2,15,5],Tackles:[2,15,5],Kicks:[5,30,12],Handballs:[3,25,10],Clearances:[1,12,4]};
  // "First/last" milestone markets — no line, pick a player. `team:true` scopes it
  // to that player's side; otherwise it's the whole match. d(player, team) builds
  // the leg text the bot posts verbatim.
  const MARKETS={
    "1st Goal":{d:(p,t)=>p+" to kick the 1st goal of the match"},
    "1st Goal (Team)":{team:true,d:(p,t)=>p+" to kick "+t+"'s 1st goal"},
    "Last Goal":{d:(p,t)=>p+" to kick the last goal of the match"},
    "Last Goal (Team)":{team:true,d:(p,t)=>p+" to kick "+t+"'s last goal"},
    "1st Disposal":{d:(p,t)=>p+" to have the 1st disposal of the match"},
    "Last Disposal":{d:(p,t)=>p+" to have the last disposal of the match"},
  };
  const $=id=>document.getElementById(id);
  const u=n=>(n>0?"+":"")+n+"u";
  const ERR={bad_state:"Login expired — please try again.",login_failed:"Discord login failed — please try again.",not_authorised:"That account isn't an owner or moderator of a TipBot server."};
  let STATE={role:null,servers:[],followerServers:[],viewAs:null,players:{},bookies:[],playerMeta:{},god:false};
  const godOn=()=>STATE.god&&STATE.role==="owner"&&!STATE.viewAs;   // #32: owner only, not in preview
  let BUILD={guildId:null,serverName:null,game:null,tab:"Disposals",legs:[]};

  // Per-guild unit size ($). 0 = not configured -> dollar-mode staking stays off.
  function guildUnitSize(guildId){
    const g=(STATE.servers||[]).find(s=>String(s.guild_id)===String(guildId));
    const v=g?parseFloat(g.unit_size):0; return (v>0)?v:0;
  }
  // Half-up rounding to match the bot's stored-stake rule (0.5 rounds away from 0).
  function roundHalfUp(v,p){ p=p||0; const f=Math.pow(10,p);
    const n=v*f; const r=(n>=0?Math.floor(n+0.5):Math.ceil(n-0.5)); return r/f; }
  function dollarsToUnits(dollars,unitSize){
    if(!(unitSize>0)||!(dollars>0))return 0; return roundHalfUp(dollars/unitSize,2); }

  const show=s=>{for(const x of ["login","loading","app"])$(x).hidden=(x!==s);};
  const panel=p=>{for(const x of ["overview","detail","followers","follower","mytips","discover","builder"])$(x).hidden=(x!==p); if(p!=="follower"&&typeof unmountFollowerPromoChip==="function")unmountFollowerPromoChip();};
  function getToken(){try{return localStorage.getItem("tipbot_token")}catch{return null}}
  function setToken(t){try{localStorage.setItem("tipbot_token",t)}catch{}}
  function clearToken(){try{localStorage.removeItem("tipbot_token")}catch{}}

  $("loginbtn").href=API+"/auth/login";
  $("gear").onclick=e=>{e.stopPropagation();$("dropdown").hidden=!$("dropdown").hidden;$("gear").setAttribute("aria-expanded",String(!$("dropdown").hidden));$("viewas-list").hidden=true;};
  document.body.addEventListener("click",()=>{$("dropdown").hidden=true;$("gear").setAttribute("aria-expanded","false");});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("dropdown").hidden){$("dropdown").hidden=true;$("gear").setAttribute("aria-expanded","false");$("gear").focus();}});
  $("dropdown").addEventListener("click",e=>e.stopPropagation());
  $("dd-logout").onclick=()=>{clearToken();location.hash="";renderLogin();};
  { const hl=$("homelogo"); if(hl)hl.onclick=()=>{STATE.viewAs=null;$("viewas-banner").hidden=true;$("tray").hidden=true;enterHome();}; }
  $("dd-viewas").onclick=()=>{$("viewas-list").hidden=!$("viewas-list").hidden;};
  $("viewas-exit").onclick=()=>{STATE.viewAs=null;$("viewas-banner").hidden=true;enterHome();};
  // A tipster only ever has one server, so drop them straight into it — no picker.
  function enterHome(){
    const admin=visibleServers();
    const follows=STATE.viewAs?[]:(STATE.followerServers||[]);
    if(admin.length===1 && !follows.length){ return loadDetail(admin[0].guild_id); }
    if(!admin.length && follows.length===1){ return openFollowerView(follows[0].guild_id, follows[0].display_name); }
    renderOverview();
  }

  function renderLogin(msg){clearDetailTimers();clearLiveTimer();clearGamesTimer();if(msg)$("loginmsg").innerHTML='<span class="err">'+msg+'</span>';show("login");}
  async function api(path,opts){opts=opts||{};opts.headers=Object.assign({Authorization:"Bearer "+getToken()},opts.headers||{});
    const r=await fetch(API+path,opts);if(r.status===401){clearToken();throw{unauth:true};}return r;}

  function buildViewAsMenu(){const box=$("viewas-servers");box.innerHTML="";STATE.servers.forEach(s=>{
    const it=document.createElement("div");it.className="dd-item";it.textContent=s.display_name||"Unnamed";
    it.onclick=()=>{STATE.viewAs=s;$("dropdown").hidden=true;$("viewas-name").textContent=s.display_name||s.guild_id;$("viewas-banner").hidden=false;enterHome();};
    box.appendChild(it);});}
  const visibleServers=()=>STATE.viewAs?STATE.servers.filter(s=>String(s.guild_id)===String(STATE.viewAs.guild_id)):STATE.servers;

  function renderOverview(){
    clearDetailTimers();clearLiveTimer();clearGamesTimer();
    panel("overview");const ov=$("overview");ov.innerHTML="";const list=visibleServers();
    const follows=STATE.viewAs?[]:(STATE.followerServers||[]);
    if(list.length){
      ov.innerHTML='<p style="color:var(--muted);margin:0 0 16px">'+list.length+(list.length===1?" server":" servers")+' · tap one to manage it</p>';
      const grid=document.createElement("div");grid.className="grid";
      list.forEach(s=>{const p=s.profit_units||0;const c=document.createElement("div");c.className="scard";
        c.innerHTML='<div class="row1"><div><div class="sname">'+esc(s.display_name||"Unnamed server")+'</div><div class="sgid">'+s.guild_id+'</div></div><span class="plan">'+esc(s.plan_name||"starter")+'</span></div>'
        +'<div class="mini"><div class="m"><span class="mv">'+(s.queued||0)+'</span><span class="ml">Queued</span></div>'
        +'<div class="m"><span class="mv"><span class="pos">'+(s.won||0)+'</span>–<span class="neg">'+(s.lost||0)+'</span></span><span class="ml">W – L</span></div>'
        +'<div class="m"><span class="mv '+(p>=0?"pos":"neg")+'">'+u(p)+'</span><span class="ml">Profit</span></div>'
        +'<div class="m"><span class="mv">'+(s.roi||0)+'%</span><span class="ml">ROI</span></div></div>'
        +'<div style="margin-top:14px;color:var(--muted);font-size:13px"><span class="dot '+(s.enabled?"on":"off")+'"></span>'+(s.enabled?"Bot enabled":"Bot disabled")+'</div>';
        c.onclick=()=>loadDetail(s.guild_id);grid.appendChild(c);});
      ov.appendChild(grid);
    }
    // Communities the user follows (read-only follower surface).
    if(follows.length){
      const h=document.createElement("div");
      h.style.cssText="margin:"+(list.length?"26px":"0")+" 0 12px";
      h.innerHTML='<h2 style="margin:0 0 4px;font-size:17px">Following</h2><p style="color:var(--muted);margin:0;font-size:13px">'+follows.length+' communit'+(follows.length===1?"y":"ies")+' you follow · your own tracked bets</p>';
      ov.appendChild(h);
      const fg=document.createElement("div");fg.className="grid";
      if(follows.length>1){
        const all=document.createElement("div");all.className="scard";
        all.innerHTML='<div class="row1"><div><div class="sname">All communities</div><div class="sgid">Combined rollup · '+follows.length+' follows</div></div><span class="plan">follower</span></div>'
          +'<div style="margin-top:12px;color:var(--muted);font-size:13px">Units, calendar and tip history across every community you follow →</div>';
        all.onclick=()=>openFollowerAllView(null);fg.appendChild(all);
      }
      follows.forEach(s=>{const c=document.createElement("div");c.className="scard";
        c.innerHTML='<div class="row1"><div><div class="sname">'+esc(s.display_name||"Community")+'</div><div class="sgid">'+s.guild_id+'</div></div><span class="plan">follower</span></div>'
          +'<div style="margin-top:12px;color:var(--muted);font-size:13px">Tap to see your units, calendar and tip history →</div>';
        c.onclick=()=>openFollowerView(s.guild_id,s.display_name);fg.appendChild(c);});
      ov.appendChild(fg);
    }
    if(!list.length && !follows.length){
      ov.innerHTML='<div class="empty">Nothing here yet. Follow a tipster in Discord and your tracked bets show up here.</div>';
    }
  }

  function fmtMonth(m){try{const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});}catch{return m;}}
  async function loadDetail(guildId,month,opts){
    opts=opts||{};
    clearLiveTimer();
    panel("detail");show("app");
    const key=guildId+"|"+(month||"");
    STATE._detailCache=STATE._detailCache||{};
    const cached=STATE._detailCache[key];
    // Show the cached snapshot instantly for quick loads, then refresh behind it.
    if(cached && !opts.force){ renderDetail(cached); }

    try{const r=await api("/api/server?guild_id="+encodeURIComponent(guildId)+(month?"&month="+encodeURIComponent(month):""));
      if(!r.ok){ if(!cached)$("detail").innerHTML='<p class="err">Couldn\'t load that server.</p>'; return; }

      if(!$("detail").hidden) renderDetail(data);

  function tipRow(t,settled){
    const result=settled?(t.result||"Push"):"Pending";
    const right=TB.chips.render(result)+(settled&&/^(win|loss)$/i.test(result)?'<span class="num '+(result.toLowerCase()==="win"?"pos":"neg")+'">'+esc(u(t.profit_units||0))+'</span>':!settled?'<span class="tb-quote">'+esc(t.units)+'u @ '+esc(t.odds)+'</span>':'');
    const tid=esc(t.tip_id||"");
    const canDel=!!tid&&(!settled||godOn());
    const del=canDel?'<button class="delbet" data-tip="'+tid+'" data-name="'+esc(t.display_id||"")+'" data-settled="'+(settled?"1":"0")+'" title="'+(settled?"God-delete & redact":"Delete & redact")+'" style="border:1px solid rgba(229,72,77,.4);background:rgba(229,72,77,.12);color:#f0857f;border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:12px">✕</button>':'';
    return '<div class="tip betrow" data-tip="'+tid+'" style="cursor:pointer"><div style="flex:1;min-width:0"><div class="g">'+esc(t.game_name||t.bet_type||("Tip "+(t.display_id||"")))+' <span style="color:var(--faint);font-size:11px">▸</span></div><div class="meta">'+esc(t.bet_type||"")+(t.bookmaker?" · "+TB.bookie.label(t.bookmaker,20):"")+(t.display_id?" · "+esc(t.display_id):"")+'</div><div class="tb-tip-tags">'+TB.multiBadge(t.legs)+(settled?TB.settleBadge.render(t.settle_source):'')+'</div></div><div class="tb-result">'+right+del+'</div></div>'
      +'<div class="betlegs" id="legs_'+tid+'" hidden style="padding:4px 0 10px 6px;margin:-4px 0 6px"></div>';
  }
  function wireTipRows(box,gid){
    if(!box)return;
    box.querySelectorAll(".betrow").forEach(row=>{ row.onclick=(e)=>{ if(e.target.closest(".delbet"))return; toggleLegs(gid,row.dataset.tip); }; });
    box.querySelectorAll(".delbet").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); deleteBet(gid,b.dataset.tip,b.dataset.name,b); });
  }
  async function toggleLegs(gid,tipId){
    if(!tipId)return; const el=$("legs_"+tipId); if(!el)return;
    if(!el.hidden){ el.hidden=true; return; }
    el.hidden=false;
    if(el.dataset.loaded)return;
    el.innerHTML='<span style="color:var(--faint);font-size:12px">Loading…</span>';
    try{ const t=await (await api("/api/tip?guild_id="+encodeURIComponent(gid)+"&tip_id="+encodeURIComponent(tipId))).json();
      const legs=(t.legs||[]).map(l=>'<div style="font-size:13px;padding:2px 0">• '+esc(l.description)+(l.leg_result?' '+TB.chips.render(l.leg_result):'')+'</div>').join("")||'<div style="color:var(--faint);font-size:12px">No legs recorded.</div>';
      let grade='';
      const isGodRegrade=(t.status||"")==="Settled"&&godOn();
      if((t.status||"")==="Pending"||isGodRegrade){
        grade='<div class="graderow" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center'+(isGodRegrade?';border-top:1px dashed var(--warn,#e0a04a);padding-top:10px':'')+'">'
          +'<span style="color:'+(isGodRegrade?'var(--warn,#e0a04a)':'var(--faint)')+';font-size:11px;text-transform:uppercase;letter-spacing:.05em">'+(isGodRegrade?'🔱 God re-grade:':'Grade result:')+'</span>'
          +'<button class="gradebtn" data-r="Win"  style="border:1px solid rgba(66,176,111,.45);background:rgba(66,176,111,.14);color:#7ee0a6;border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700">Win</button>'
          +'<button class="gradebtn" data-r="Loss" style="border:1px solid rgba(229,72,77,.45);background:rgba(229,72,77,.12);color:#f0857f;border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700">Loss</button>'

  function tipTimeMs(t){
    const v=t&& (t.settled_at||t.created_at||t.timestamp||t.created||t.ts||null);
    if(v==null||v==="") return null;
    if(typeof v==="number" && Number.isFinite(v)) return v<1e12?v*1000:v;
    const n=Date.parse(v); return Number.isFinite(n)?n:null;
  }
  async function openFollowerAllView(month){
    clearDetailTimers();clearLiveTimer();clearGamesTimer();
    const follows=STATE.viewAs?[]:(STATE.followerServers||[]);
    if(follows.length<=1){
      if(follows.length===1) return openFollowerView(follows[0].guild_id,follows[0].display_name,month);
      return enterHome();
    }
    panel("follower");show("app");
    $("follower").innerHTML='<div style="margin-bottom:18px">'+NDSkeleton.box("240px","28px")+'</div>'+NDSkeleton.grid(4,{cols:2,tile:"70px"})+'<div style="margin-top:18px">'+NDSkeleton.box("100%","120px")+'</div>';
    let unauth=false;
    const q=month?"&month="+encodeURIComponent(month):"";
    const results=await Promise.all(follows.map(async s=>{
      try{
        const r=await api("/api/follower?guild_id="+encodeURIComponent(s.guild_id)+q);
        if(!r.ok) return {ok:false,s};
        return {ok:true,s,d:await r.json()};
      }catch(e){ if(e&&e.unauth){unauth=true;} return {ok:false,s}; }
    }));
    if(unauth) return renderLogin("Session expired.");
    const ok=results.filter(r=>r.ok);
    const failed=results.filter(r=>!r.ok).map(r=>r.s.display_name||String(r.s.guild_id));
    if(!ok.length){
      $("follower").innerHTML='<div class="back" id="flbx">← Back</div><div class="empty">Couldn\'t load any follower communities.</div>';
      $("flbx").onclick=enterHome; return;
    }
    const stats={won:0,lost:0,push:0,pending:0,profit_units:0,staked_units:0};
    const monthsSet=new Set();
    const daily={};
    const feed=[];
    let calPick=null;
    ok.forEach(({s,d})=>{
      const st=d.stats||{};
      stats.won+=Number(st.won||0); stats.lost+=Number(st.lost||0); stats.push+=Number(st.push||0);
      stats.pending+=Number(st.pending||0); stats.profit_units+=Number(st.profit_units||0); stats.staked_units+=Number(st.staked_units||0);
      (d.months||[]).forEach(m=>monthsSet.add(m));
      if(!calPick && d.cal_month) calPick=d.cal_month;
      const ds=d.daily_series||{};
      Object.keys(ds).forEach(k=>{
        const e=ds[k]||{};
        if(!daily[k]) daily[k]={net:0,n:0,won:0,lost:0,push:0};
        daily[k].net+=Number(e.net||0); daily[k].n+=Number(e.n||0);
        daily[k].won+=Number(e.won||0); daily[k].lost+=Number(e.lost||0); daily[k].push+=Number(e.push||0);
      });
      const cname=s.display_name||d.display_name||"Community";
      (d.feed||[]).forEach(t=>{
        feed.push(Object.assign({},t,{community_name:cname,_community:cname,guild_id:t.guild_id||s.guild_id}));
      });
    });
    const denom=stats.won+stats.lost;
    stats.roi=stats.staked_units?Math.round((stats.profit_units/stats.staked_units)*1000)/10:0;
    stats.strike_rate=denom?Math.round((stats.won/denom)*1000)/10:0;
    const months=[...monthsSet].sort().reverse();
    const anyTs=feed.some(t=>tipTimeMs(t)!=null);
    if(anyTs) feed.sort((a,b)=>(tipTimeMs(b)||0)-(tipTimeMs(a)||0));
    const now=new Date();
    const curCal=(month && /^\d{4}-\d{2}$/.test(month))?month:(calPick||months[0]||(now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")));
    renderFollowerAllView({
      stats, months, month:month||"", cal_month:curCal, daily_series:daily, feed,
      failed, communityCount:follows.length, follows
    });
  }

  function promoChipHidden(key){ try{ return localStorage.getItem(key)==="1"; }catch(e){ return false; } }
  function dismissPromoSlot(slot, key){
    try{ localStorage.setItem(key,"1"); }catch(e){}
    if(!slot) return;
    slot.classList.add("tb-promo-out");
    const done=()=>{
      slot.remove();
      const w=$("tb-promo-wrap");
      if(w && !w.querySelector(".tb-promo-slot:not(.tb-promo-out)")) w.remove();
    };
    slot.addEventListener("transitionend", function te(ev){
      if(ev.target!==slot) return;
      slot.removeEventListener("transitionend", te);
      done();
    });
    setTimeout(done, 380); // fallback if transitionend skipped
  }

  function dcGuildAvatar(t, name, size){
    const url=t&&(t.icon_url||t.guild_icon||"");
    const init=(function(n){ const s=String(n||"?").trim(); const p=s.split(/\s+/).filter(Boolean); if(p.length>=2) return (p[0][0]+p[1][0]).toUpperCase(); return (s.slice(0,2).toUpperCase()||"?"); })(name);
    if(url) return '<img class="dc-av" src="'+esc(url)+'" alt="" width="'+size+'" height="'+size+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'dc-av\',textContent:\''+esc(init)+'\'}))">';
    return '<div class="dc-av" aria-hidden="true">'+esc(init)+'</div>';
  }
  function dcRecentVals(t){
    let vals=null;
    if(Array.isArray(t.recent_nets)&&t.recent_nets.length) vals=t.recent_nets;
    else if(Array.isArray(t.recent_series)&&t.recent_series.length) vals=t.recent_series;
    else if(t.daily_series&&typeof t.daily_series==="object"){
      const keys=Object.keys(t.daily_series).sort();
      vals=keys.slice(-30).map(k=>{ const e=t.daily_series[k]; return e&&typeof e==="object"?(e.net||0):Number(e||0); });
    }
    if(!vals||vals.length<2) return null;
    return vals.map(v=>{
      if(v==null) return 0;
      if(typeof v==="number") return v;
      if(typeof v==="object") return Number(v.net!=null?v.net:(v.profit!=null?v.profit:(v.units!=null?v.units:0)));
      return Number(v)||0;
    });
  }
  // Flat desk spark — no axes/grid. Stroke win if end≥start else loss.
  function dcMiniSpark(t, wide){
    const vals=dcRecentVals(t); if(!vals) return "";
    const w=wide?220:120, h=wide?36:32, pad=2;
    const min=Math.min(...vals), max=Math.max(...vals), range=(max-min)||1;
    const x=i=>pad+i*(w-2*pad)/Math.max(vals.length-1,1);
    const y=v=>h-pad-((v-min)/range)*(h-2*pad);
    const pts=vals.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
    const up=vals[vals.length-1]>=vals[0];
    const col=up?"var(--win)":"var(--loss)";
    return '<svg class="dc-mini'+(wide?" dc-mini--wide":"")+'" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'
      +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }
  function pickFeaturedTipster(list){
    if(!list||!list.length) return null;
    const settled=list.filter(t=>Number(t.settled||0)>=20);
    const pool=settled.length?settled:list;
    return pool.slice().sort((a,b)=>Number(b.units_net||0)-Number(a.units_net||0))[0]||null;
  }

  function sparkline(series){

    const w=560,h=56,pad=8,vals=series.map(p=>p.profit);
    const min=Math.min(0,...vals),max=Math.max(0,...vals),range=(max-min)||1;
    const x=i=>pad+i*(w-2*pad)/(series.length-1), y=v=>h-pad-((v-min)/range)*(h-2*pad);
    const pts=series.map((p,i)=>x(i)+","+y(p.profit)).join(" ");
    const last=vals[vals.length-1],col=last>=0?"var(--win)":"var(--loss)",tot=Math.round(vals.reduce((a,b)=>a+b,0)*100)/100;

      +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'

  function calMonthShift(month,delta){

  function renderCalendar(month,daily,extraHtml){

(function () {

    if(valid(saved)&&(!auto()||read('tipbot_theme_manual_date')===today(d)))return saved;

(function () {

    if(typeof value==='number')return Number.isSafeInteger(value)&&value>0?String(value):null;
    if(typeof value!=='string')return null;
    value=value.trim();
    return value&&value!=='0'?value:null;
  }

  TB.gameId=function(leg) {
    if(!leg||typeof leg!=='object')return null;
    var direct=id(leg.game_id);if(direct)return direct;
    var game=leg.game;
    if(game&&typeof game==='object')return id(game.aflMatchId)||id(game.game_id)||id(game.id);
    return id(game);
  };
  function inspect(legs) {
    if(!Array.isArray(legs)||legs.length<2)return {kind:'single',groups:[]};
    var counts=new Map(),missing=false;
    legs.forEach(function(leg){var key=TB.gameId(leg);if(key===null)missing=true;else counts.set(key,(counts.get(key)||0)+1);});
    var groups=Array.from(counts.values()).filter(function(n){return n>=2;});
    return {kind:counts.size>=2?'cross':counts.size===1&&!missing?'sgm':'unknown',groups:groups};
  }
  // Legacy three-value contract: "single" means no multi badge when identity is unknown.
  TB.multiKind=function(legs){var kind=inspect(legs).kind;return kind==='unknown'?'single':kind;};
  // For filters, keep unresolved multis separate from real singles.
  TB.multiFilterKey=function(legs){return inspect(legs).kind;};
  TB.multiBadge=function(legs) {
    var kind=inspect(legs).kind;
    if(kind!=='sgm'&&kind!=='cross')return '';

  };

    return groups.reduce(function(a,b){return a+b;},0)+' legs are in '+groups.length+" same-game groups — correlated. That's fine, just so you know.";
  };

  async function loadRouting(gid){

  function chanOptions(channels,selected){
    const groups={}; channels.forEach(c=>{(groups[c.category||"Channels"]=groups[c.category||"Channels"]||[]).push(c);});
    let html='<option value="">— Default (auto) —</option>';
    Object.keys(groups).forEach(g=>{ html+='<optgroup label="'+esc(g)+'">'+groups[g].map(c=>'<option value="'+c.id+'"'+(c.id===selected?" selected":"")+'>#'+esc(c.name)+'</option>').join("")+'</optgroup>'; });
    return html;
  }
  function renderRouting(gid,data){
    const box=$("routing-box");
    if(!data.channels||!data.channels.length){ box.innerHTML='<div class="empty">No channels recorded yet — the bot lists them when it starts up or when a channel changes. Give it a moment and reopen.</div>'; return; }
    const groups={}; data.outputs.forEach(o=>{(groups[o.group]=groups[o.group]||[]).push(o);});
    let html="";
    Object.keys(groups).forEach(gname=>{
      html+='<div style="color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px">'+esc(gname)+'</div>';
      groups[gname].forEach(o=>{
        html+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">'
          +'<div style="min-width:160px"><div style="font-weight:600;font-size:14px">'+esc(o.label)+'</div><div style="color:var(--faint);font-size:12px">'+esc(o.desc)+'</div></div>'
          +'<select class="rsel" data-k="'+o.key+'" style="flex:1;min-width:200px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;cursor:pointer">'+chanOptions(data.channels,o.channel_id)+'</select>'
          +'</div>';
      });
    });
    html+='<div id="routing-merge" style="font-size:12.5px;color:#9fb0d0;margin:8px 0 12px;min-height:16px"></div>'
      +'<button class="btn sm" id="routing-save">Save routing</button> <span id="routing-msg" style="font-size:12px;margin-left:8px"></span>';
    box.innerHTML=html;
    const sels=[...box.querySelectorAll(".rsel")];
    function updateMerge(){
      const byChan={}; sels.forEach(x=>{ if(x.value){(byChan[x.value]=byChan[x.value]||[]).push(x);} });
      const merged=Object.entries(byChan).filter(([id,arr])=>arr.length>1);
      const mb=$("routing-merge");
      if(merged.length){ const names=merged.map(([id])=>{const ch=data.channels.find(c=>c.id===id);return "#"+(ch?ch.name:id);}); mb.innerHTML="🔗 Shared: "+names.join(", ")+" — the bot will post one combined, pinned message there instead of several."; }
      else mb.innerHTML="";
    }
    sels.forEach(x=>x.onchange=updateMerge); updateMerge();
    $("routing-save").onclick=async()=>{
      const mapping={}; sels.forEach(x=>mapping[x.dataset.k]=x.value);
      const btn=$("routing-save"),msg=$("routing-msg"); btn.disabled=true; msg.textContent="";
      try{ const r=await api("/api/channels",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:gid,mapping})});
        const j=await r.json();
        if(r.ok&&j.ok){ if(window.NDConfirmPop)NDConfirmPop.show({label:"Routing saved",color:"#2eaf62"}); msg.textContent="✓ saved"; msg.style.color="var(--win)"; }
        else{ msg.textContent=j.message||"Couldn't save"; msg.style.color="var(--loss)"; }
      }catch(e){ if(e.unauth)return renderLogin("Session expired."); msg.textContent="Couldn't reach the bot"; msg.style.color="var(--loss)"; }
      finally{ btn.disabled=false; }
    };
  }

  const RES_COLS=[["D","disposals"],["G","goals"],["M","marks"],["T","tackles"],["K","kicks"],["HB","handballs"]];
  function resultStatsHTML(d,g){
    if(!d||d.available===false||(((d.home||[]).length===0)&&((d.away||[]).length===0)))
      return '<div class="empty" style="padding:6px 0">Player counts aren\'t available for this game yet.</div>';
    const th='padding:4px 6px;color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;text-align:right';
    const th0='padding:4px 6px;color:var(--faint);font-weight:700;font-size:12px;text-align:left';
    const td='padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums';
    const td0='padding:4px 6px;text-align:left';
    function tbl(title,list){
      const sorted=(list||[]).slice().sort((a,b)=>(Number(b.summary&&b.summary.disposals)||0)-(Number(a.summary&&a.summary.disposals)||0));
      if(!sorted.length)return '';
      const head='<tr><th style="'+th0+'">'+esc(title)+'</th>'+RES_COLS.map(c=>'<th style="'+th+'" title="'+c[1]+'">'+c[0]+'</th>').join("")+'</tr>';
      const rows=sorted.map(p=>'<tr style="border-top:1px solid var(--line)"><td style="'+td0+'">'+(p.number?('<span style="color:var(--faint)">#'+esc(String(p.number))+'</span> '):'')+esc(p.name)+'</td>'+RES_COLS.map(c=>'<td style="'+td+'">'+Math.round(Number(p.summary&&p.summary[c[1]])||0)+'</td>').join("")+'</tr>').join("");
      return '<div style="overflow-x:auto;margin-bottom:12px"><table style="width:100%;border-collapse:collapse;font-size:13px">'+head+rows+'</table></div>';
    }
    return tbl(teamName(g.hteam),d.home)+tbl(teamName(g.ateam),d.away);
  }
  async function toggleResult(mid,i){
    RESULTS._open=RESULTS._open||{}; RESULTS._stats=RESULTS._stats||{};
    const body=$("resbody_"+i); if(!body)return;
    const hdr=body.previousElementSibling, car=hdr&&hdr.querySelector(".tcaret");

    if(car)car.textContent=nowOpen?"▾":"▸";
    if(!nowOpen){ body.hidden=true; return; }
    body.hidden=false;
    if(RESULTS._stats[mid]){ body.innerHTML=RESULTS._stats[mid]; return; }
    if(!mid){ body.innerHTML='<div class="empty" style="padding:6px 0">No match id for this game.</div>'; return; }
    body.innerHTML='<div class="empty" style="padding:6px 0">Loading player counts…</div>';

  /* teams arrive as objects {name, abbrev, players:[{name,number,position}], aflName};
     fall back gracefully to strings + players.json if anything is missing. */
  function teamName(t){ return (t&&typeof t==="object")?(t.name||t.aflName||""):(t||""); }
  function teamPlayers(t){ if(t&&typeof t==="object"&&Array.isArray(t.players)&&t.players.length)return t.players; return STATE.players[teamName(t)]||[]; }
  // match the backend's _text_key so we can look a live player up by name
  function tkey(s){ return String(s||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,""); }
  const LIVE_KEYS={Disposals:"disposals",Goals:"goals","Fantasy Points":"dreamTeamPoints",Hitouts:"hitouts",Marks:"marks",Tackles:"tackles",Kicks:"kicks",Handballs:"handballs",Clearances:"totalClearances"};

  function fmtDate(s){try{const d=new Date(s.replace(" ","T"));return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}catch{return s;}}

  async function openGame(g){

  async function refreshLive(g){
    const c=Number(g.complete)||0;

      if(BUILD.game===g){ BUILD.live=data; renderPlayers(); } }

  function renderGame(){

    const mtabs=Object.keys(MARKETS).map(t=>'<div class="tab mkt '+(t===BUILD.tab?"active":"")+'" data-t="'+t+'">'+t+'</div>').join("");

  // Downscale + JPEG-compress client-side so only a small image ever travels.
  function compressImage(file,maxDim,quality){
    maxDim=maxDim||1600; quality=quality||0.7;
    return new Promise((res,rej)=>{
      const img=new Image(),url=URL.createObjectURL(file);
      img.onload=()=>{ URL.revokeObjectURL(url);
        let w=img.naturalWidth,h=img.naturalHeight; const sc=Math.min(1,maxDim/Math.max(w,h));

      img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("bad image")); };
      img.src=url;

      delay_minutes:parseInt($("f_delay").value||"0",10),
      image_b64:BUILD.image||""};
    try{const r=await api("/api/queue-tip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const j=await r.json();
      if(r.ok&&j.ok){ if(window.NDConfirmPop)NDConfirmPop.show({label:"Tip scheduled",color:"#2eaf62"}); BUILD.legs=[]; BUILD.image=null; $("tray").hidden=true; loadDetail(BUILD.guildId); }
      else{ $("scherr").textContent=j.message||"Couldn't schedule."; $("schedbtn").disabled=false; }
    }catch(e){ if(e.unauth)return renderLogin("Session expired."); $("scherr").textContent="Couldn't reach the bot."; $("schedbtn").disabled=false; }
  }
  function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}

  async function load(){
    const hash=new URLSearchParams(location.hash.slice(1));
    if(hash.get("error")){history.replaceState(null,"",location.pathname);return renderLogin(ERR[hash.get("error")]||"Login error.");}
    if(hash.get("token")){setToken(hash.get("token"));history.replaceState(null,"",location.pathname);}
    if(!getToken())return renderLogin();
    show("loading");
    try{const r=await api("/api/servers");if(!r.ok)return renderLogin();const data=await r.json();
      STATE.role=data.role;STATE.servers=data.servers||[];STATE.followerServers=data.follower_servers||[];
      hydrateTheme(data.theme_prefs);
      $("rolebadge").textContent=STATE.role==="owner"?"Owner":(STATE.role==="follower"?"Follower":"Moderator");
      $("dd-viewas").style.display=STATE.role==="owner"?"":"none";
      buildViewAsMenu();show("app");enterHome();
    }catch(e){if(e.unauth)return renderLogin();renderLogin("Couldn't reach the bot — try again in a moment.");}
  }
  // ── Theme sync per account (#44) ──────────────────────────────────────────
  // localStorage is the per-device cache + pre-paint source; the server copy is
  // the account's source of truth, applied on login so the theme follows you
  // across devices. Saves fire on any appearance change (once sync is armed).
  let THEME_SYNC_READY=false;
  function saveThemePrefs(){
    if(!THEME_SYNC_READY||!getToken())return;
    let body={};try{body={theme:localStorage.getItem("tipbot_theme"),auto:localStorage.getItem("tipbot_theme_auto")==="true",accent:localStorage.getItem("tipbot_theme_accent")};}catch(e){}
    try{ api("/api/theme",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).catch(()=>{}); }catch(e){}
  }
  ["set","setAuto","setAccent"].forEach(function(fn){
    const orig=TB.theme&&TB.theme[fn];
    if(typeof orig==="function")TB.theme[fn]=function(){const r=orig.apply(this,arguments);saveThemePrefs();return r;};
  });
  function hydrateTheme(tp){
    // Server prefs win over the local cache, then get cached locally.
    if(tp){
      try{
        if(tp.theme){localStorage.setItem("tipbot_theme",tp.theme);}
        localStorage.setItem("tipbot_theme_auto",tp.auto?"true":"false");
        if(tp.accent){localStorage.setItem("tipbot_theme_accent",tp.accent);}else{localStorage.removeItem("tipbot_theme_accent");}
        localStorage.removeItem("tipbot_theme_manual_date");
      }catch(e){}
      try{TB.theme.init();TB.theme.mount($("tb-appearance"));}catch(e){}
    }
    THEME_SYNC_READY=true;   // arm saves only after the login hydrate settles
  }
  TB.theme.init(); TB.theme.mount($("tb-appearance")); TB.bookie.init();
  load();
</script>
</body>
</html>
