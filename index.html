<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TipBot Dashboard</title>
<style>
  :root{
    --bg:#0b0f1a;--bg2:#0f1420;--card:#151b2b;--card2:#1a2133;--line:#26304a;
    --txt:#eef2fa;--muted:#8a95ad;--faint:#5c6785;
    --accent:#5b8cff;--accent2:#7b5bff;--win:#2eaf62;--loss:#e5595f;--push:#5c6785;--radius:16px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:radial-gradient(1200px 600px at 80% -10%, #182142 0%, var(--bg) 55%) fixed, var(--bg);
       color:var(--txt);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 20px 90px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:16px}
  .brand .sub{font-weight:500;color:var(--muted);font-size:12px;margin-left:2px}
  .menu{position:relative}
  .gear{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:17px;color:var(--muted)}
  .gear:hover{color:var(--txt)}
  .dropdown{position:absolute;right:0;top:46px;background:var(--card2);border:1px solid var(--line);border-radius:14px;min-width:220px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:30}
  .dd-item{padding:9px 11px;border-radius:9px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  .dd-item:hover{background:#222c44}
  .dd-label{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 11px 4px}
  .danger{color:var(--loss)}
  .viewas{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,rgba(123,91,255,.18),rgba(91,140,255,.10));border:1px solid #34407a;border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px}
  .viewas b{color:#c9d4ff}
  .link{color:var(--accent);cursor:pointer;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
  .scard:hover{transform:translateY(-2px);border-color:#3a4772;background:var(--card2)}
  .scard .row1{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
  .sname{font-weight:700;font-size:16px}.sgid{color:var(--faint);font-size:12px}
  .plan{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px;text-transform:capitalize}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.on{background:var(--win)}.dot.off{background:var(--push)}
  .mini{display:flex;gap:18px;flex-wrap:wrap}.mini .m{display:flex;flex-direction:column}
  .mini .mv{font-weight:700;font-size:18px}.mini .ml{color:var(--faint);font-size:11px;text-transform:uppercase}
  .pos{color:var(--win)}.neg{color:var(--loss)}
  .back{color:var(--muted);cursor:pointer;font-size:14px;display:inline-flex;gap:6px;margin-bottom:14px}.back:hover{color:var(--txt)}
  .dhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .dhead h1{margin:0;font-size:24px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .tile .tv{font-weight:800;font-size:26px;line-height:1.1}.tile .tl{color:var(--faint);font-size:12px;text-transform:uppercase;margin-top:4px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px}
  .panel h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .wlbar{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;background:var(--bg2)}.wlbar>span{display:block}
  .wl-legend{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:7px}.sw{width:10px;height:10px;border-radius:3px}
  .switches{display:flex;gap:12px;flex-wrap:wrap}
  .switch{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 14px}
  .toggle{width:44px;height:25px;border-radius:999px;background:#43506b;position:relative;cursor:pointer;border:none;flex:none;transition:background .15s}
  .toggle.on{background:var(--win)}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s}.toggle.on::after{left:22px}
  .tips-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.tips-cols{grid-template-columns:1fr}}
  .tip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.tip:last-child{border-bottom:none}
  .tip .g{font-weight:600;font-size:14px}.tip .meta{color:var(--faint);font-size:12px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .b-win{background:rgba(46,175,98,.16);color:#5fd48c}.b-loss{background:rgba(229,89,95,.16);color:#ff9a9e}.b-push{background:rgba(92,103,133,.2);color:#b3bdd6}.b-pending{background:rgba(91,140,255,.16);color:#9db8ff}
  .num.pos{color:var(--win);font-weight:700}.num.neg{color:var(--loss);font-weight:700}
  .empty{color:var(--faint);font-size:13px;padding:14px 0}
  .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:11px;padding:11px 18px;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.sm{padding:8px 14px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:default}
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
  .center{min-height:74vh;display:grid;place-items:center;text-align:center}.center h1{margin:0 0 6px}.center p{color:var(--muted);margin:0 0 20px}
  .err{color:var(--loss)}
  /* builder */
  .gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:border-color .12s,transform .12s}
  .gcard:hover{border-color:#3a4772;transform:translateY(-2px)}
  .gcard .rd{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .gcard .mt{font-weight:700;font-size:16px}.gcard .vn{color:var(--muted);font-size:12px;margin-top:6px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
  .tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .teamhdr{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
  .compchip{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
  .compchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .compbadge{font-size:10px;font-weight:800;letter-spacing:.04em;background:#1f3a5c;color:#9fc7ff;padding:1px 7px;border-radius:999px;vertical-align:middle}
  .compbadge.aflw{background:#5a1f4a;color:#ff9fe0}
  .thdr{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .thdr:hover{color:var(--muted)}
  .tcaret{font-size:11px;color:var(--muted);width:12px;display:inline-block}
  .prow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
  .pnum{display:grid;place-items:center;flex:none}
  .pname{font-weight:600;min-width:150px;flex:1}
  .linectl{display:flex;align-items:center;gap:12px;flex:1;min-width:240px}
  .lineval{font-weight:800;font-size:20px;min-width:66px;text-align:center}
  .lineval small{font-size:12px;color:var(--muted);font-weight:600}
  input[type=range]{flex:1;accent-color:var(--accent);height:4px}
  .ou{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .ou button{background:var(--card2);border:none;color:var(--muted);padding:7px 12px;cursor:pointer;font:inherit;font-weight:700;font-size:13px}
  .ou button.on{background:var(--accent);color:#fff}
  .addbtn{background:rgba(46,175,98,.16);color:#5fd48c;border:1px solid rgba(46,175,98,.4);border-radius:9px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:700}
  .addbtn:hover{background:rgba(46,175,98,.26)}
  /* multi tray */
  .tray{position:fixed;left:0;right:0;bottom:0;background:var(--card2);border-top:1px solid var(--line);box-shadow:0 -14px 40px rgba(0,0,0,.4);z-index:40}
  .tray-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legchips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
  .chip .x{color:var(--faint);cursor:pointer;font-weight:700}
  .chip .x:hover{color:var(--loss)}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
  .field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .field input,.field select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font:inherit}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--win);color:#04120a;font-weight:700;padding:12px 20px;border-radius:12px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="center" hidden>
    <div><div class="logo" style="margin:0 auto 14px;width:46px;height:46px;font-size:22px">🎯</div>
    <h1>TipBot Dashboard</h1><p id="loginmsg">Sign in with the Discord account that manages your server.</p>
    <a class="btn" id="loginbtn" href="#">Log in with Discord</a></div>
  </div>
  <div id="loading" class="center"><div><h1>TipBot Dashboard</h1><p id="loadingmsg">Loading…</p>
    <p style="color:var(--faint);font-size:13px">First load can take ~50s while the bot wakes.</p></div></div>

  <div id="app" hidden>
    <div class="top">
      <div class="brand"><span class="logo" id="homelogo" style="cursor:pointer" title="Home">🎯</span> TipBot <span class="sub" id="rolebadge"></span></div>
      <div class="menu"><div class="gear" id="gear" title="Settings">⚙</div>
        <div class="dropdown" id="dropdown" hidden>
          <div class="dd-label">Settings</div>
          <div class="dd-item" id="dd-viewas">View as… <span style="color:var(--faint)">›</span></div>
          <div id="viewas-list" hidden><div class="dd-label">View as server</div><div id="viewas-servers"></div></div>
          <div class="dd-item danger" id="dd-logout">Log out</div>
        </div></div>
    </div>
    <div id="viewas-banner" class="viewas" hidden>
      <div>Viewing as <b id="viewas-name"></b> — this is what their dashboard looks like.</div>
      <span class="link" id="viewas-exit">Exit view</span>
    </div>
    <div id="overview" hidden></div>
    <div id="detail" hidden></div>
    <div id="followers" hidden></div>
    <div id="builder" hidden></div>
  </div>
</div>
<div id="tray" class="tray" hidden></div>

<script>
/* ===== Reusable UI assets (ND*) — inlined, self-contained ===== */
/* =========================================================================
 *  status-tint.js — tint a card by a value vs a target  (reusable asset)
 *
 *  The "how am I doing" colour: compare a number to a target and tint a whole
 *  container — red under, gold over, green bang on. Same idea as SWB's circuit
 *  overload card and the Timesheet interactive-times day cards.
 *
 *  No dependencies. Self-injects its CSS. Exposes a global `NDStatusTint`:
 *
 *    NDStatusTint.classify(value, target, opts) -> "under" | "exact" | "over"
 *        opts.epsilon (default 0.01) — how close counts as "exact".
 *
 *    NDStatusTint.classNames(value, target, opts) -> "nd-tint nd-over …"
 *        Ready-to-drop class string for template rendering.
 *        opts.lowVis -> also colours all text in the box to match.
 *
 *    NDStatusTint.apply(el, value, target, opts)
 *        Set the classes on a live element (clears any previous tint first).
 *
 *    NDStatusTint.clear(el)
 *
 *  Meaning is fixed (under=bad/red, over=good/gold, exact=green) because that's
 *  the shared language across the suite. Add class "nd-tint" + a status class
 *  to any element with a full border and it tints.
 * ========================================================================= */
(function (root) {
  "use strict";
  if (root.NDStatusTint) return;
  var doc = root.document;

  function ensureStyles() {
    if (!doc || doc.getElementById("nd-tint-css")) return;
    var s = doc.createElement("style");
    s.id = "nd-tint-css";
    s.textContent =
      ".nd-tint.nd-under{border-color:#e5484d !important;background:rgba(229,72,77,0.07);box-shadow:0 0 0 1px rgba(229,72,77,0.28),0 0 18px rgba(229,72,77,0.12);}" +
      ".nd-tint.nd-over{border-color:#e3b341 !important;background:rgba(227,179,65,0.07);box-shadow:0 0 0 1px rgba(227,179,65,0.30),0 0 18px rgba(227,179,65,0.14);}" +
      ".nd-tint.nd-exact{border-color:#3ab87a !important;background:rgba(58,184,122,0.06);box-shadow:0 0 0 1px rgba(58,184,122,0.22);}" +
      ".nd-tint.nd-lowvis.nd-under,.nd-tint.nd-lowvis.nd-under *{color:#e5484d !important;}" +
      ".nd-tint.nd-lowvis.nd-over,.nd-tint.nd-lowvis.nd-over *{color:#e3b341 !important;}" +
      ".nd-tint.nd-lowvis.nd-exact,.nd-tint.nd-lowvis.nd-exact *{color:#3ab87a !important;}";
    (doc.head || doc.documentElement).appendChild(s);
  }
  if (doc) ensureStyles();

  function classify(value, target, opts) {
    opts = opts || {};
    var eps = opts.epsilon == null ? 0.01 : opts.epsilon;
    var v = Number(value), t = Number(target);
    if (v > t + eps) return "over";
    if (v < t - eps) return "under";
    return "exact";
  }
  function classNames(value, target, opts) {
    opts = opts || {};
    ensureStyles();
    return "nd-tint nd-" + classify(value, target, opts) + (opts.lowVis ? " nd-lowvis" : "");
  }
  function clear(el) {
    if (!el) return;
    el.classList.remove("nd-tint", "nd-under", "nd-over", "nd-exact", "nd-lowvis");
  }
  function apply(el, value, target, opts) {
    if (!el) return;
    ensureStyles();
    clear(el);
    el.classList.add("nd-tint", "nd-" + classify(value, target, opts));
    if (opts && opts.lowVis) el.classList.add("nd-lowvis");
  }

  var API = { classify: classify, classNames: classNames, apply: apply, clear: clear };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  root.NDStatusTint = API;
})(typeof window !== "undefined" ? window : globalThis);
/* =========================================================================
 *  skeleton.js — shimmer placeholders  (reusable asset)
 *
 *  Animated placeholder blocks while data loads, so lists/grids fade in
 *  instead of popping from empty — planner project list, search photo grid,
 *  timesheet history. Returns HTML you drop into a container until the real
 *  content is ready.
 *
 *  No dependencies. Self-injects CSS. Global `NDSkeleton`:
 *    NDSkeleton.lines(n, { lastWidth })   -> HTML of n shimmer lines
 *    NDSkeleton.box(width, height, radius) -> one shimmer block
 *    NDSkeleton.grid(n, { cols, tile })    -> a shimmer tile grid
 *    NDSkeleton.into(el, html)             -> drop skeletons into an element
 * ========================================================================= */
(function (root) {
  "use strict";
  if (root.NDSkeleton) return;
  var doc = root.document;

  function css() {
    if (!doc || doc.getElementById("nd-sk-css")) return;
    var s = doc.createElement("style");
    s.id = "nd-sk-css";
    s.textContent =
      ".nd-sk{position:relative;overflow:hidden;background:rgba(255,255,255,0.06);border-radius:8px;}" +
      ".nd-sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,0.09),transparent);animation:nd-sk 1.3s infinite;}" +
      ".nd-sk-line{height:12px;margin:9px 0;}" +
      ".nd-sk-grid{display:grid;gap:10px;}" +
      "@keyframes nd-sk{100%{transform:translateX(100%);}}" +
      "@media(prefers-reduced-motion:reduce){.nd-sk::after{animation:none;}}";
    (doc.head || doc.documentElement).appendChild(s);
  }

  function box(w, h, r) { css(); return '<div class="nd-sk" style="width:' + (w || "100%") + ";height:" + (h || "80px") + ";border-radius:" + (r || "8px") + '"></div>'; }
  function lines(n, opts) {
    css(); opts = opts || {}; n = n || 3;
    var out = "";
    for (var i = 0; i < n; i++) { var w = (i === n - 1) ? (opts.lastWidth || "60%") : "100%"; out += '<div class="nd-sk nd-sk-line" style="width:' + w + '"></div>'; }
    return out;
  }
  function grid(n, opts) {
    css(); opts = opts || {}; n = n || 6;
    var cols = opts.cols || 3, tileH = opts.tile || "96px";
    var cells = "";
    for (var i = 0; i < n; i++) cells += '<div class="nd-sk" style="height:' + tileH + '"></div>';
    return '<div class="nd-sk-grid" style="grid-template-columns:repeat(' + cols + ',1fr)">' + cells + "</div>";
  }
  function into(el, html) { if (!el) return; css(); el.innerHTML = html; }

  var API = { css: css, box: box, lines: lines, grid: grid, into: into };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  root.NDSkeleton = API;
})(typeof window !== "undefined" ? window : globalThis);
/* =========================================================================
 *  countdown-confirm.js — auto-confirming prompt with a depleting bar
 *
 *  Origin: extracted from Timesheet's "near" clock-on prompt.
 *  Purpose: "assume yes, but give a moment to change your mind." Shows a
 *  bottom sheet with a bar that drains over N seconds and then fires
 *  onConfirm automatically — unless the user taps a button first.
 *
 *  Self-contained: injects its own styles + DOM. No dependencies. Picks up
 *  nd-core.css variables (--nd-surface, --nd-border, --nd-text) when present,
 *  otherwise falls back to a dark theme so it works dropped into any page.
 *
 *  Global `NDCountdownConfirm`:
 *
 *    NDCountdownConfirm.open({
 *      title,                 heading text
 *      message,               body text (HTML allowed)
 *      seconds = 4,           countdown length before auto-confirm
 *      confirmLabel = "Confirm",
 *      secondaryLabel,        optional middle button (e.g. "Change")
 *      accent = "#3ab87a",    bar + primary button colour
 *      onConfirm, onSecondary, onCancel   callbacks
 *    }) -> { close(fireCancel) }
 *
 *  Confirm (button or auto) → onConfirm. Secondary → onSecondary.
 *  Backdrop tap or Esc → onCancel. All stop the countdown.
 * ========================================================================= */
(function (root) {
  "use strict";
  if (typeof document === "undefined") { root.NDCountdownConfirm = { open: function () {} }; return; }

  function injectStyles() {
    if (document.getElementById("ndcc-styles")) return;
    var css =
      ".ndcc-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity 180ms}" +
      ".ndcc-backdrop.ndcc-in{opacity:1}" +
      ".ndcc-sheet{background:var(--nd-surface,#1a1a1a);border:1px solid var(--nd-border,#2a2a2a);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:20px;color:var(--nd-text,#f0f0f0);font-family:var(--nd-sans,system-ui,-apple-system,'Segoe UI',sans-serif);transform:translateY(12px);transition:transform 200ms}" +
      ".ndcc-backdrop.ndcc-in .ndcc-sheet{transform:translateY(0)}" +
      ".ndcc-sheet h3{margin:0 0 10px;font-size:17px;font-weight:500}" +
      ".ndcc-msg{color:var(--nd-muted,#9aa0a8);font-size:13px;margin:0 0 4px}" +
      ".ndcc-wrap{height:6px;border-radius:999px;background:rgba(255,255,255,0.12);overflow:hidden;margin:14px 0 8px}" +
      ".ndcc-bar{height:100%;width:100%;border-radius:999px;background:var(--ndcc-accent,#3ab87a)}" +
      ".ndcc-hint{color:var(--nd-muted,#9aa0a8);font-size:12px;margin:0}" +
      ".ndcc-acts{display:flex;gap:10px;margin-top:14px}" +
      ".ndcc-b{flex:1;min-height:44px;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;border:1px solid var(--nd-border,#2a2a2a);font-family:inherit}" +

<script>
  const API="https://afl-tipster-bot.onrender.com";
  const TOGGLES=[["enabled","Bot Enabled"],["subscription_active","Subscription"],["results_graph_enabled","Results Graph"]];
  const STATS={Disposals:[10,40,20],Goals:[0,6,2],"Fantasy Points":[40,140,80],Hitouts:[0,50,20],Marks:[2,15,5],Tackles:[2,15,5],Kicks:[5,30,12],Handballs:[3,25,10],Clearances:[1,12,4]};
  const $=id=>document.getElementById(id);
  const u=n=>(n>0?"+":"")+n+"u";
  const ERR={bad_state:"Login expired — please try again.",login_failed:"Discord login failed — please try again.",not_authorised:"That account isn't an owner or moderator of a TipBot server."};
  let STATE={role:null,servers:[],viewAs:null,players:{},bookies:[],playerMeta:{}};
  let BUILD={guildId:null,serverName:null,game:null,tab:"Disposals",legs:[]};

  const show=s=>{for(const x of ["login","loading","app"])$(x).hidden=(x!==s);};
  const panel=p=>{for(const x of ["overview","detail","followers","builder"])$(x).hidden=(x!==p);};
  function getToken(){try{return localStorage.getItem("tipbot_token")}catch{return null}}
  function setToken(t){try{localStorage.setItem("tipbot_token",t)}catch{}}
  function clearToken(){try{localStorage.removeItem("tipbot_token")}catch{}}

  $("loginbtn").href=API+"/auth/login";
  $("gear").onclick=e=>{e.stopPropagation();$("dropdown").hidden=!$("dropdown").hidden;$("viewas-list").hidden=true;};
  document.body.addEventListener("click",()=>{$("dropdown").hidden=true;});
  $("dropdown").addEventListener("click",e=>e.stopPropagation());
  $("dd-logout").onclick=()=>{clearToken();location.hash="";renderLogin();};
  { const hl=$("homelogo"); if(hl)hl.onclick=()=>{STATE.viewAs=null;$("viewas-banner").hidden=true;$("tray").hidden=true;enterHome();}; }
  $("dd-viewas").onclick=()=>{$("viewas-list").hidden=!$("viewas-list").hidden;};
  $("viewas-exit").onclick=()=>{STATE.viewAs=null;$("viewas-banner").hidden=true;enterHome();};
  // A tipster only ever has one server, so drop them straight into it — no picker.
  function enterHome(){ const list=visibleServers(); if(list.length===1){ loadDetail(list[0].guild_id); } else { renderOverview(); } }

  function renderLogin(msg){clearDetailTimers();clearLiveTimer();if(msg)$("loginmsg").innerHTML='<span class="err">'+msg+'</span>';show("login");}
  async function api(path,opts){opts=opts||{};opts.headers=Object.assign({Authorization:"Bearer "+getToken()},opts.headers||{});
    const r=await fetch(API+path,opts);if(r.status===401){clearToken();throw{unauth:true};}return r;}

  function buildViewAsMenu(){const box=$("viewas-servers");box.innerHTML="";STATE.servers.forEach(s=>{
    const it=document.createElement("div");it.className="dd-item";it.textContent=s.display_name||"Unnamed";
    it.onclick=()=>{STATE.viewAs=s;$("dropdown").hidden=true;$("viewas-name").textContent=s.display_name||s.guild_id;$("viewas-banner").hidden=false;enterHome();};
    box.appendChild(it);});}
  const visibleServers=()=>STATE.viewAs?STATE.servers.filter(s=>String(s.guild_id)===String(STATE.viewAs.guild_id)):STATE.servers;

  function renderOverview(){
    clearDetailTimers();clearLiveTimer();
    panel("overview");const ov=$("overview");ov.innerHTML="";const list=visibleServers();
    ov.innerHTML='<p style="color:var(--muted);margin:0 0 16px">'+list.length+(list.length===1?" server":" servers")+' · tap one to manage it</p>';
    const grid=document.createElement("div");grid.className="grid";
    list.forEach(s=>{const p=s.profit_units||0;const c=document.createElement("div");c.className="scard";
      c.innerHTML='<div class="row1"><div><div class="sname">'+(s.display_name||"Unnamed server")+'</div><div class="sgid">'+s.guild_id+'</div></div><span class="plan">'+(s.plan_name||"starter")+'</span></div>'
      +'<div class="mini"><div class="m"><span class="mv">'+(s.queued||0)+'</span><span class="ml">Queued</span></div>'
      +'<div class="m"><span class="mv"><span class="pos">'+(s.won||0)+'</span>–<span class="neg">'+(s.lost||0)+'</span></span><span class="ml">W – L</span></div>'
      +'<div class="m"><span class="mv '+(p>=0?"pos":"neg")+'">'+u(p)+'</span><span class="ml">Profit</span></div>'
      +'<div class="m"><span class="mv">'+(s.roi||0)+'%</span><span class="ml">ROI</span></div></div>'
      +'<div style="margin-top:14px;color:var(--muted);font-size:13px"><span class="dot '+(s.enabled?"on":"off")+'"></span>'+(s.enabled?"Bot enabled":"Bot disabled")+'</div>';
      c.onclick=()=>loadDetail(s.guild_id);grid.appendChild(c);});
    ov.appendChild(grid);
  }

  function fmtMonth(m){try{const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});}catch{return m;}}
  async function loadDetail(guildId,month,opts){
    opts=opts||{};
    clearLiveTimer();
    panel("detail");show("app");
    const key=guildId+"|"+(month||"");
    STATE._detailCache=STATE._detailCache||{};
    const cached=STATE._detailCache[key];
    // Show the cached snapshot instantly for quick loads, then refresh behind it.
    if(cached && !opts.force){ renderDetail(cached); }
    else { $("detail").innerHTML='<div style="margin-bottom:18px">'+NDSkeleton.box("240px","30px")+'</div>'+NDSkeleton.grid(6,{cols:3,tile:"78px"})+'<div style="margin-top:18px">'+NDSkeleton.box("100%","120px")+'</div>'; }
    try{const r=await api("/api/server?guild_id="+encodeURIComponent(guildId)+(month?"&month="+encodeURIComponent(month):""));
      if(!r.ok){ if(!cached)$("detail").innerHTML='<p class="err">Couldn\'t load that server.</p>'; return; }
      const data=await r.json(); STATE._detailCache[key]=data;
      if(!$("detail").hidden) renderDetail(data);
    }catch(e){if(e.unauth)return renderLogin("Session expired.");if(!cached)$("detail").innerHTML='<p class="err">Couldn\'t reach the bot.</p>';}
  }
  function tipRow(t,settled){
    const right=settled?(t.result==="Win"?'<span class="num pos">'+u(t.profit_units||0)+'</span>':t.result==="Loss"?'<span class="num neg">'+u(t.profit_units||0)+'</span>':'<span class="badge b-push">'+(t.result||"Push")+'</span>'):'<span class="badge b-pending">'+t.units+'u @ '+t.odds+'</span>';
    const tid=esc(t.tip_id||"");
    const del=(!settled&&tid)?'<button class="delbet" data-tip="'+tid+'" data-name="'+esc(t.display_id||"")+'" title="Delete & redact" style="border:1px solid rgba(229,72,77,.4);background:rgba(229,72,77,.12);color:#f0857f;border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:12px">✕</button>':'';
    return '<div class="tip betrow" data-tip="'+tid+'" style="cursor:pointer"><div style="flex:1;min-width:0"><div class="g">'+esc(t.game_name||t.bet_type||("Tip "+(t.display_id||"")))+' <span style="color:var(--faint);font-size:11px">▸</span></div><div class="meta">'+esc(t.bet_type||"")+(t.bookmaker?" · "+esc(t.bookmaker):"")+(t.display_id?" · "+esc(t.display_id):"")+'</div></div><div style="display:flex;align-items:center;gap:10px">'+right+del+'</div></div>'
      +'<div class="betlegs" id="legs_'+tid+'" hidden style="padding:4px 0 10px 6px;margin:-4px 0 6px"></div>';
  }
  function wireTipRows(box,gid){
    if(!box)return;
    box.querySelectorAll(".betrow").forEach(row=>{ row.onclick=(e)=>{ if(e.target.closest(".delbet"))return; toggleLegs(gid,row.dataset.tip); }; });
    box.querySelectorAll(".delbet").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); deleteBet(gid,b.dataset.tip,b.dataset.name,b); });
  }
  async function toggleLegs(gid,tipId){
    if(!tipId)return; const el=$("legs_"+tipId); if(!el)return;
    if(!el.hidden){ el.hidden=true; return; }
    el.hidden=false;
    if(el.dataset.loaded)return;
    el.innerHTML='<span style="color:var(--faint);font-size:12px">Loading…</span>';
    try{ const t=await (await api("/api/tip?guild_id="+encodeURIComponent(gid)+"&tip_id="+encodeURIComponent(tipId))).json();
      const legs=(t.legs||[]).map(l=>'<div style="font-size:13px;padding:2px 0">• '+esc(l.description)+(l.leg_result?' <span style="color:var(--faint)">('+esc(l.leg_result)+')</span>':'')+'</div>').join("")||'<div style="color:var(--faint);font-size:12px">No legs recorded.</div>';
      let grade='';
      if((t.status||"")==="Pending"){
        grade='<div class="graderow" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center">'
          +'<span style="color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em">Grade result:</span>'
          +'<button class="gradebtn" data-r="Win"  style="border:1px solid rgba(66,176,111,.45);background:rgba(66,176,111,.14);color:#7ee0a6;border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700">Win</button>'
          +'<button class="gradebtn" data-r="Loss" style="border:1px solid rgba(229,72,77,.45);background:rgba(229,72,77,.12);color:#f0857f;border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700">Loss</button>'
          +'<button class="gradebtn" data-r="Push" style="border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700">Push</button>'
          +'</div>';
      }
      el.innerHTML='<div style="color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:2px 0 4px">'+esc(t.bet_type||"Bet")+(t.odds?(" · @ "+t.odds):"")+(t.units?(" · "+t.units+"u"):"")+'</div>'+legs+grade;
      el.querySelectorAll(".gradebtn").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); gradeBet(gid,tipId,b.dataset.r,el); });
      el.dataset.loaded="1";
    }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); el.innerHTML='<span class="err" style="font-size:12px">Couldn\'t load legs.</span>'; }
  }
  async function gradeBet(gid,tipId,result,box){
    if(!confirm("Grade this bet as "+result+"? Followers will be notified and it will post to bet-results."))return;
    if(box)box.querySelectorAll(".gradebtn").forEach(b=>b.disabled=true);
    try{ const r=await api("/api/settle-tip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:gid,tip_id:tipId,result:result})});
      const j=await r.json();
      if(j.ok){ if(STATE._detailCache)STATE._detailCache={}; toast("Grading as "+result+" — updating Discord…"); const row=document.querySelector('.betrow[data-tip="'+tipId+'"]'); const lg=$("legs_"+tipId); if(row)row.remove(); if(lg)lg.remove(); }
      else { toast(j.message||"Couldn't grade that bet."); if(box)box.querySelectorAll(".gradebtn").forEach(b=>b.disabled=false); }
    }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); toast("Couldn't reach the bot."); if(box)box.querySelectorAll(".gradebtn").forEach(b=>b.disabled=false); }
  }
  async function deleteBet(gid,tipId,name,btn){
    if(!confirm("Delete "+(name||"this bet")+"? It will be removed from Discord with a redaction note posted in its place."))return;
    if(btn)btn.disabled=true;
    try{ const r=await api("/api/delete-tip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:gid,tip_id:tipId})});
      const j=await r.json();
      if(j.ok){ document.querySelectorAll('.betrow').forEach(row=>{ if(row.dataset.tip===tipId){ const lg=$("legs_"+tipId); row.remove(); if(lg)lg.remove(); } });
        if(STATE._detailCache)STATE._detailCache={};
        toast("Redacted — it previously contained: "+(j.message||"the bet"));
      } else { toast(j.message||"Couldn't delete that bet."); if(btn)btn.disabled=false; }
    }catch(e){ if(e&&e.unauth)return renderLogin("Session expired."); toast("Couldn't reach the bot."); if(btn)btn.disabled=false; }
  }
  function toast(msg){ let t=$("nd_toast"); if(!t){ t=document.createElement("div"); t.id="nd_toast"; t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:11px 16px;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:60;font-size:14px;max-width:90vw;transition:opacity .3s"; document.body.appendChild(t);} t.textContent=msg; t.style.opacity="1"; clearTimeout(t._h); t._h=setTimeout(()=>{t.style.opacity="0";},4000); }

  /* ---------- FOLLOWERS ---------- */
  async function openFollowers(gid,name){
    clearDetailTimers();clearLiveTimer();
    panel("followers");show("app");
    $("followers").innerHTML='<div class="back" id="fbx">← Back</div><h1 style="margin:0 0 14px">Followers</h1>'+NDSkeleton.lines(6);
    $("fbx").onclick=()=>loadDetail(gid);
    try{ const data=await (await api("/api/followers?guild_id="+encodeURIComponent(gid))).json();

  function sparkline(series){
    if(!series||series.length<2) return "";
    const w=560,h=56,pad=8,vals=series.map(p=>p.profit);
    const min=Math.min(0,...vals),max=Math.max(0,...vals),range=(max-min)||1;
    const x=i=>pad+i*(w-2*pad)/(series.length-1), y=v=>h-pad-((v-min)/range)*(h-2*pad);
    const pts=series.map((p,i)=>x(i)+","+y(p.profit)).join(" ");
    const last=vals[vals.length-1],col=last>=0?"var(--win)":"var(--loss)",tot=Math.round(vals.reduce((a,b)=>a+b,0)*100)/100;
    return '<div class="panel"><h3>Profit by month</h3><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'
      +'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="max-width:100%">'
      +'<line x1="'+pad+'" y1="'+y(0)+'" x2="'+(w-pad)+'" y2="'+y(0)+'" stroke="var(--line)" stroke-dasharray="3 3"/>'
      +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
      +series.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.profit)+'" r="2.6" fill="'+(p.profit>=0?"var(--win)":"var(--loss)")+'"><title>'+esc(fmtMonth(p.month))+": "+u(p.profit)+'</title></circle>').join("")
      +'</svg><div style="color:var(--muted);font-size:12px">'+series.length+' months · net <b class="'+(tot>=0?"pos":"neg")+'">'+u(tot)+'</b></div></div></div>';
  }

      const d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4),sc=Math.floor(diff%6e4/1e3);
      el.innerHTML='<span style="color:var(--faint)">starts in </span><b>'+(d?d+"d ":"")+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sc).padStart(2,"0")+'</b>';

  function permConfigPayload(){ var cfg={}; Object.keys(PERM.cmd).forEach(function(n){ cfg[n]={mode:PERM.cmd[n].mode, roles:PERM.cmd[n].roles}; }); return cfg; }
  async function savePerms(){
    var msg=$("pmsg"), btn=$("psave"); if(btn)btn.disabled=true; if(msg)msg.textContent="";
    try{
      var r1=await api("/api/command-perms",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:PERM.gid,config:permConfigPayload()})});
      var j1=await r1.json();
      var r2=await api("/api/dashboard-roles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:PERM.gid,roles:Object.keys(PERM.dash)})});
      var j2=await r2.json();
      var ok=j1.ok&&j2.ok;
      if(msg){ msg.textContent=ok?"✓ saved":(((j1.message||"")+" "+(j2.message||"")).trim()||"error"); msg.style.color=ok?"var(--win)":"var(--loss)"; }
    }catch(e){ if(e.unauth)return renderLogin("Session expired."); if(msg){msg.textContent="couldn't save";msg.style.color="var(--loss)";} }
    finally{ if(btn)btn.disabled=false; }

  async function applyPreset(name){

      var j=await r.json(); if(j.ok){ loadPerms(PERM.gid); } else { var m=$("pmsg"); if(m){m.textContent=j.message||"error";m.style.color="var(--loss)";} }
    }catch(e){ if(e.unauth)return renderLogin("Session expired."); }

    }catch(e){ if(e.unauth)return renderLogin("Session expired."); }

  /* ---------- CHANNEL ROUTING ---------- */
  async function loadRouting(gid){
    const box=$("routing-box"); if(!box)return;
    box.innerHTML=NDSkeleton.lines(4);
    let data;
    try{ const r=await api("/api/channels?guild_id="+encodeURIComponent(gid));
      if(!r.ok){ box.innerHTML='<div class="empty">Couldn\'t load channels for this server.</div>'; return; }
      data=await r.json();
    }catch(e){ if(e.unauth)return renderLogin("Session expired."); box.innerHTML='<div class="empty">Couldn\'t reach the bot.</div>'; return; }
    renderRouting(gid,data);
  }
  function chanOptions(channels,selected){
    const groups={}; channels.forEach(c=>{(groups[c.category||"Channels"]=groups[c.category||"Channels"]||[]).push(c);});
    let html='<option value="">— Default (auto) —</option>';
    Object.keys(groups).forEach(g=>{ html+='<optgroup label="'+esc(g)+'">'+groups[g].map(c=>'<option value="'+c.id+'"'+(c.id===selected?" selected":"")+'>#'+esc(c.name)+'</option>').join("")+'</optgroup>'; });
    return html;
  }
  function renderRouting(gid,data){
    const box=$("routing-box");
    if(!data.channels||!data.channels.length){ box.innerHTML='<div class="empty">No channels recorded yet — the bot lists them when it starts up or when a channel changes. Give it a moment and reopen.</div>'; return; }
    const groups={}; data.outputs.forEach(o=>{(groups[o.group]=groups[o.group]||[]).push(o);});
    let html="";
    Object.keys(groups).forEach(gname=>{
      html+='<div style="color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px">'+esc(gname)+'</div>';
      groups[gname].forEach(o=>{
        html+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">'
          +'<div style="min-width:160px"><div style="font-weight:600;font-size:14px">'+esc(o.label)+'</div><div style="color:var(--faint);font-size:12px">'+esc(o.desc)+'</div></div>'
          +'<select class="rsel" data-k="'+o.key+'" style="flex:1;min-width:200px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;cursor:pointer">'+chanOptions(data.channels,o.channel_id)+'</select>'
          +'</div>';
      });
    });
    html+='<div id="routing-merge" style="font-size:12.5px;color:#9fb0d0;margin:8px 0 12px;min-height:16px"></div>'
      +'<button class="btn sm" id="routing-save">Save routing</button> <span id="routing-msg" style="font-size:12px;margin-left:8px"></span>';
    box.innerHTML=html;
    const sels=[...box.querySelectorAll(".rsel")];
    function updateMerge(){
      const byChan={}; sels.forEach(x=>{ if(x.value){(byChan[x.value]=byChan[x.value]||[]).push(x);} });
      const merged=Object.entries(byChan).filter(([id,arr])=>arr.length>1);
      const mb=$("routing-merge");
      if(merged.length){ const names=merged.map(([id])=>{const ch=data.channels.find(c=>c.id===id);return "#"+(ch?ch.name:id);}); mb.innerHTML="🔗 Shared: "+names.join(", ")+" — the bot will post one combined, pinned message there instead of several."; }
      else mb.innerHTML="";
    }
    sels.forEach(x=>x.onchange=updateMerge); updateMerge();
    $("routing-save").onclick=async()=>{
      const mapping={}; sels.forEach(x=>mapping[x.dataset.k]=x.value);
      const btn=$("routing-save"),msg=$("routing-msg"); btn.disabled=true; msg.textContent="";
      try{ const r=await api("/api/channels",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:gid,mapping})});
        const j=await r.json();
        if(r.ok&&j.ok){ if(window.NDConfirmPop)NDConfirmPop.show({label:"Routing saved",color:"#2eaf62"}); msg.textContent="✓ saved"; msg.style.color="var(--win)"; }
        else{ msg.textContent=j.message||"Couldn't save"; msg.style.color="var(--loss)"; }
      }catch(e){ if(e.unauth)return renderLogin("Session expired."); msg.textContent="Couldn't reach the bot"; msg.style.color="var(--loss)"; }
      finally{ btn.disabled=false; }
    };
  }

  /* ---------- BUILDER ---------- */
  async function openBuilder(guildId,name){
    clearDetailTimers();clearLiveTimer();
    BUILD={guildId,serverName:name,game:null,tab:"Disposals",legs:[],search:"",sort:"number",collapsed:{},compFilter:"All"};
    panel("builder");renderTray();
    $("builder").innerHTML='<div class="back" id="bx">← Back to '+(name||"server")+'</div><h1 style="margin:0 0 16px">Build a tip</h1>'+NDSkeleton.grid(6,{cols:3,tile:"92px"});
    $("bx").onclick=()=>{$("tray").hidden=true;loadDetail(guildId);};
    // players now come live from the AFL API (attached to each game); players.json
    // is only a silent fallback for a team the roster feed couldn't match.
    if(!Object.keys(STATE.players).length){ try{STATE.players=await (await fetch("./players.json")).json();}catch{STATE.players={};} }
    if(!STATE.bookies.length){ try{STATE.bookies=((await (await fetch("./bookies.json")).json()).bookies)||[];}catch{STATE.bookies=[];} }
    let games=[];
    try{ const fx=await (await api("/api/fixtures")).json(); games=fx.games||[]; STATE.playerMeta=fx.players||{}; }catch(e){ if(e.unauth)return renderLogin("Session expired."); }
    renderGames(games);
  }
  /* teams arrive as objects {name, abbrev, players:[{name,number,position}], aflName};
     fall back gracefully to strings + players.json if anything is missing. */
  function teamName(t){ return (t&&typeof t==="object")?(t.name||t.aflName||""):(t||""); }
  function teamPlayers(t){ if(t&&typeof t==="object"&&Array.isArray(t.players)&&t.players.length)return t.players; return STATE.players[teamName(t)]||[]; }
  // match the backend's _text_key so we can look a live player up by name
  function tkey(s){ return String(s||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,""); }
  const LIVE_KEYS={Disposals:"disposals",Goals:"goals","Fantasy Points":"dreamTeamPoints",Hitouts:"hitouts",Marks:"marks",Tackles:"tackles",Kicks:"kicks",Handballs:"handballs",Clearances:"totalClearances"};
  // live value for a player on the active stat tab, or null when not live
  function liveVal(name){ const L=BUILD.live; if(!L||!L.available)return null; const p=L.players[tkey(name)]; if(!p)return null; const v=p.summary?.[LIVE_KEYS[BUILD.tab]]; return (typeof v==="number")?v:null; }
  function gameComp(g){ return (g&&g.comp)||"AFL"; }
  function renderGames(games){
    // Which competitions are present? (AFL always; AFLW when the season is on.)
    const comps=[]; games.forEach(g=>{const c=gameComp(g); if(!comps.includes(c))comps.push(c);});
    const hasMulti=comps.length>1;
    if(!BUILD.compFilter||(BUILD.compFilter!=="All"&&!comps.includes(BUILD.compFilter)))BUILD.compFilter="All";

      +'<div class="dhead"><h1 style="margin:0">Build a tip</h1><button class="ghost" id="refreshgames">↻ Refresh</button></div>'

    if(hasMulti){
      const chip=(v,l)=>'<button class="compchip'+(BUILD.compFilter===v?" on":"")+'" data-c="'+v+'">'+l+'</button>';
      html+='<div class="compfilter" style="display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap">'
        +chip("All","All")+comps.map(c=>chip(c,c)).join("")+'</div>';
    }

    if(!games.length){

      html+='<div class="panel"><div class="empty">'+(err?("Couldn't load games — "+err+". If the bot was just redeployed, give it a minute and refresh."):"No games in the next 7 days (off-season or none scheduled). Live games show here too.")+'</div></div>';
    }
    else if(!shown.length){ html+='<div class="panel"><div class="empty">No '+BUILD.compFilter+' games in the next 7 days.</div></div>'; }

      const liveBadge=g.live?' <span style="color:#e5484d;font-weight:800;font-size:11px;letter-spacing:.03em">● LIVE</span>':'';
      const compBadge=hasMulti?' <span class="compbadge'+(gameComp(g)==="AFLW"?" aflw":"")+'">'+gameComp(g)+'</span>':'';
      return '<div class="gcard" data-i="'+i+'"'+(g.live?' style="border-color:#e5484d;box-shadow:0 0 0 1px rgba(229,72,77,.25)"':'')+'><div class="rd">'+(g.roundname||"")+' · '+fmtDate(g.date)+liveBadge+compBadge+'</div><div class="mt">'+teamName(g.hteam)+'<br>v '+teamName(g.ateam)+'</div><div class="vn">'+(g.venue||"")+'</div></div>';
    }).join("")+'</div>'; }
    $("builder").innerHTML=html;
    $("bx").onclick=()=>{$("tray").hidden=true;loadDetail(BUILD.guildId);};
    const rg=$("refreshgames"); if(rg)rg.onclick=()=>openBuilder(BUILD.guildId,BUILD.serverName);
    $("builder").querySelectorAll(".compchip").forEach(b=>b.onclick=()=>{BUILD.compFilter=b.dataset.c;renderGames(games);});
    $("builder").querySelectorAll(".gcard").forEach(c=>c.onclick=()=>openGame(shown[+c.dataset.i]));
  }
  function fmtDate(s){try{const d=new Date(s.replace(" ","T"));return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}catch{return s;}}

  async function openGame(g){
    clearLiveTimer();
    BUILD.game=g; BUILD.tab="Disposals"; BUILD.live=null;
    renderGame();
    // If the game is in progress, pull live stats now and refresh them every 30s.
    const c=Number(g.complete)||0;
    if(g.aflMatchId&&c>0&&c<100){
      await refreshLive(g);
      LIVE_TIMER=setInterval(()=>refreshLive(g),30000);
    }
  }
  async function refreshLive(g){
    const c=Number(g.complete)||0;
    try{ const data=await (await api("/api/live-stats?match="+encodeURIComponent(g.aflMatchId)+"&complete="+c)).json();
      if(BUILD.game===g){ BUILD.live=data; renderPlayers(); } }
    catch(e){ /* keep the last snapshot on a hiccup */ }
  }
  function renderGame(){
    const g=BUILD.game;
    const tabs=Object.keys(STATS).map(t=>'<div class="tab '+(t===BUILD.tab?"active":"")+'" data-t="'+t+'">'+t+'</div>').join("");
    const isLive=g.aflMatchId&&Number(g.complete)>0&&Number(g.complete)<100;
    $("builder").innerHTML='<div class="back" id="bg">← Games</div><div class="dhead"><h1 style="margin:0">'+teamName(g.hteam)+' v '+teamName(g.ateam)+'</h1><div style="display:flex;align-items:center;gap:10px"><span class="plan">'+(g.roundname||"")+'</span>'+(isLive?'<button class="ghost" id="refreshlive">↻ Live</button>':"")+'</div></div>'
      +'<div class="tabs">'+tabs+'</div>'
      +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px">'
      +'<input id="psearch" placeholder="Search players by name or number…" value="'+esc(BUILD.search||"")+'" style="flex:1;min-width:220px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:inherit">'
      +'<select id="psort" style="background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer"><option value="number">Sort: Number</option><option value="name">Sort: Name (A–Z)</option></select>'
      +'</div><div id="players"></div>';
    $("bg").onclick=()=>openBuilder(BUILD.guildId,BUILD.serverName);
    const rl=$("refreshlive"); if(rl)rl.onclick=()=>refreshLive(g);
    $("builder").querySelectorAll(".tab").forEach(t=>t.onclick=()=>{BUILD.tab=t.dataset.t;renderGame();});
    const ps=$("psort"); if(ps){ ps.value=BUILD.sort||"number"; ps.onchange=()=>{BUILD.sort=ps.value;renderPlayers();}; }
    const pq=$("psearch"); if(pq){ pq.oninput=()=>{BUILD.search=pq.value;renderPlayers();}; }
    renderPlayers();
  }
  // Only ever show the NAMED side (playerListType==="selected"); before teams are
  // announced we show nothing rather than a full/มismatched squad.
  function isNamed(team){ return team&&typeof team==="object"&&team.playerListType==="selected"; }
  function sortPlayers(list){
    const arr=list.slice();
    if(BUILD.sort==="name"){ arr.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""))); }
    else { arr.sort((a,b)=>{ const na=parseInt(a.number,10),nb=parseInt(b.number,10);
      const va=isNaN(na)?9999:na, vb=isNaN(nb)?9999:nb; return va-vb||String(a.name||"").localeCompare(String(b.name||"")); }); }
    return arr;
  }
  function filterPlayers(list){
    const q=(BUILD.search||"").trim().toLowerCase();
    if(!q)return list;
    return list.filter(p=>String(p.name||"").toLowerCase().includes(q)||String(p.number||"").includes(q));
  }
  // The deterministic, displayed roster for a side — used by BOTH the render and
  // wiring loops so row ids line up.
  function displayList(team){
    if(!isNamed(team))return [];
    const list=Array.isArray(team.players)?team.players:[];
    return filterPlayers(sortPlayers(list));
  }
  // Team colours for the guernsey icon (most specific keys first).
  const TEAMCOLORS=[["adelaide","#0a2240"],["brisbanelions","#7a002e"],["brisbane","#7a002e"],["carlton","#0e1e3d"],["collingwood","#0b0b0b"],["essendon","#c8102e"],["fremantle","#33006f"],["goldcoast","#d0112b"],["greaterwesternsydney","#f47a20"],["gwsgiants","#f47a20"],["gws","#f47a20"],["giants","#f47a20"],["hawthorn","#4d2004"],["northmelbourne","#013a81"],["kangaroos","#013a81"],["portadelaide","#01b3ac"],["power","#01b3ac"],["geelong","#0a2240"],["richmond","#141414"],["stkilda","#ed1b2e"],["saints","#ed1b2e"],["sydneyswans","#e1231f"],["swans","#e1231f"],["westcoast","#062f6c"],["eagles","#062f6c"],["westernbulldogs","#0a37a0"],["bulldogs","#0a37a0"],["sydney","#e1231f"],["melbourne","#0b1a4d"],["demons","#0b1a4d"]];
  function teamColor(name){ const k=String(name||"").toLowerCase().replace(/[^a-z]/g,""); for(var i=0;i<TEAMCOLORS.length;i++){ if(k.indexOf(TEAMCOLORS[i][0])>=0)return TEAMCOLORS[i][1]; } return "#2a3550"; }
  function textOn(hex){ const c=hex.replace("#",""); const r=parseInt(c.substr(0,2),16),gg=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16); return (0.299*r+0.587*gg+0.114*b)>140?"#111":"#fff"; }
  function guernsey(num,name){ const col=teamColor(name),tc=textOn(col); return '<svg width="34" height="34" viewBox="0 0 40 40" style="flex:none" aria-hidden="true"><path d="M13 4 L20 8 L27 4 L34 11 L29.5 17 L29.5 34 Q29.5 37 26.5 37 L13.5 37 Q10.5 37 10.5 34 L10.5 17 L6 11 Z" fill="'+col+'" stroke="rgba(255,255,255,.18)"/><text x="20" y="26" text-anchor="middle" font-family="inherit" font-size="13" font-weight="800" fill="'+tc+'">'+(num!=null&&num!==""?num:"")+'</text></svg>'; }
  function renderPlayers(){
    const g=BUILD.game,[mn,mx,def]=STATS[BUILD.tab];const box=$("players");let html="";
    BUILD.collapsed=BUILD.collapsed||{};
    const sides=[g.hteam,g.ateam];
    const meta=STATE.playerMeta||{};
    if(meta.enabled===false&&meta.error){ html+='<div class="empty" style="margin-bottom:14px">⚠ '+meta.error+'</div>'; }
    const L=BUILD.live;
    if(L&&L.available){ html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.2);display:inline-block"></span> LIVE · '+(L.phase&&L.phase.label||"in progress")+' — rows tint by projected pace vs your line</div>'; }
    sides.forEach(team=>{
      const nm=teamName(team),slug=nm.replace(/\W/g,"");
      const status=((team&&team.selectionStatus)||"").replace(/_/g," ").toLowerCase();
      if(!isNamed(team)){
        html+='<div class="teamhdr">'+nm+' <span style="background:#5a4a1f;color:#f0d78a;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:999px;vertical-align:middle">NOT NAMED</span></div>'
          +'<div class="empty" style="margin:0 0 14px">Team not announced yet — players appear once the side is named (usually 1\u20132 days before the game)'+(status?" \u00b7 "+status:"")+'.</div>';
        return;
      }
      const list=displayList(team);
      const collapsed=!!BUILD.collapsed[slug];
      html+='<div class="thdr" data-slug="'+slug+'"><span class="tcaret">'+(collapsed?"\u25b8":"\u25be")+'</span>'+nm+' <span style="background:#1f6f43;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:999px;vertical-align:middle">NAMED SIDE</span> <small style="color:var(--muted);font-weight:400">\u00b7 '+list.length+' player'+(list.length===1?"":"s")+(status?" \u00b7 "+status:"")+'</small></div>';
      html+='<div class="teamplayers" id="tp_'+slug+'"'+(collapsed?' hidden':'')+'>';
      const ins=(team&&team.ins)||[],outs=(team&&team.outs)||[];
      if(ins.length||outs.length){
        html+='<div style="display:flex;gap:16px;flex-wrap:wrap;margin:-2px 0 12px;font-size:12.5px;line-height:1.5">';
        if(outs.length)html+='<div><span style="color:#e5695b;font-weight:800">OUT</span> <span style="color:var(--muted)">'+outs.map(p=>p.name).join(", ")+'</span></div>';
        if(ins.length)html+='<div><span style="color:#42b06f;font-weight:800">IN</span> <span style="color:var(--muted)">'+ins.map(p=>p.name).join(", ")+'</span></div>';
        html+='</div>';
      }
      if(!list.length){ html+='<div class="empty" style="margin:0 0 12px">No players match your search.</div>'; }
      list.forEach((p,idx)=>{const rid="r_"+slug+"_"+idx;const lv=liveVal(p.name);
        const liveChip=(lv!==null)?' <span style="color:#f0b73f;font-weight:800">\u00b7 '+lv+' now</span>':"";
        html+='<div class="prow"><div class="pnum">'+guernsey(p.number,nm)+'</div><div class="pname">'+p.name+(p.captain?' <span style="color:#f0b73f;font-weight:800">(C)</span>':"")+(p.position?' <small style="color:var(--muted)">'+p.position+'</small>':"")+liveChip+'</div>'
          +'<div class="linectl"><input type="range" min="0" max="'+mx+'" value="'+def+'" id="'+rid+'_s"><input type="number" id="'+rid+'_v" min="0" step="1" value="'+def+'" style="width:64px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 8px;font:inherit;font-weight:800;font-size:16px;text-align:center">'
          +'<div class="ou" id="'+rid+'_ou"><button data-s="Over" class="on">Over</button><button data-s="Under">Under</button></div>'
          +'<button class="addbtn" id="'+rid+'_a">Add</button></div></div>';
      });
      html+='</div>';
    });
    box.innerHTML=html||'<div class="empty">No players listed for either team yet.</div>';
    box.querySelectorAll(".thdr").forEach(h=>h.onclick=()=>{const slug=h.dataset.slug;const tp=$("tp_"+slug);if(!tp)return;const c=!tp.hidden;tp.hidden=c;BUILD.collapsed[slug]=c;const cr=h.querySelector(".tcaret");if(cr)cr.textContent=c?"\u25b8":"\u25be";});
    // wire each row
    const frac=(L&&L.available&&L.phase&&L.phase.fraction>0)?L.phase.fraction:0;
    sides.forEach(team=>{const nm=teamName(team),slug=nm.replace(/\W/g,"");displayList(team).forEach((p,idx)=>{
      const rid="r_"+slug+"_"+idx;const sl=$(rid+"_s"),vv=$(rid+"_v"),ou=$(rid+"_ou");let side="Over";
      if(!sl||!vv)return;
      const row=sl.closest(".prow");const lv=liveVal(p.name);
      function curLine(){ const n=parseFloat(vv.value); return isNaN(n)?0:Math.max(0,n); }
      // tint by projected finish vs the typed line, from the BET's point of view.
      function tint(){ if(!window.NDStatusTint||lv===null||!frac||!row){return;} const projected=lv/frac,line=curLine();
        if(side==="Under") NDStatusTint.apply(row,line,projected); else NDStatusTint.apply(row,projected,line); }
      tint();
      sl.oninput=()=>{vv.value=sl.value;tint();};
      vv.oninput=()=>{ let n=parseFloat(vv.value); if(isNaN(n)){tint();return;} if(n<0){n=0;vv.value=0;} sl.value=Math.min(n,+sl.max); tint(); };
      ou.querySelectorAll("button").forEach(b=>b.onclick=()=>{side=b.dataset.s;ou.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");tint();});
      $(rid+"_a").onclick=()=>addLeg({player:p.name,number:p.number||null,team:nm,stat:BUILD.tab,line:curLine(),side});
    });});
  }
  function addLeg(leg){ BUILD.legs.push(leg); renderTray(); }
  function legText(l){ return l.player+" "+(l.side==="Over"?l.line+"+ ":"under "+l.line+" ")+l.stat; }
  function renderTray(){
    const t=$("tray");
    if(!BUILD.legs.length){ t.hidden=true; return; }
    t.hidden=false;
    t.innerHTML='<div class="tray-in"><div class="legchips">'+BUILD.legs.map((l,i)=>'<span class="chip">'+legText(l)+' <span class="x" data-i="'+i+'">✕</span></span>').join("")+'</div>'
      +'<button class="btn" id="reviewbtn">Review multi ('+BUILD.legs.length+')</button></div>';
    t.querySelectorAll(".x").forEach(x=>x.onclick=()=>{BUILD.legs.splice(+x.dataset.i,1);renderTray();});
    $("reviewbtn").onclick=renderConfirm;
  }
  function renderConfirm(){
    clearLiveTimer();
    panel("builder");
    const bk=STATE.bookies.map(b=>'<option value="'+b.name+'">'+b.name+'</option>').join("");
    $("builder").innerHTML='<div class="back" id="bc">← Keep building</div><h1 style="margin:0 0 16px">Confirm & schedule</h1>'
      +'<div class="panel"><h3>'+(BUILD.game?teamName(BUILD.game.hteam)+" v "+teamName(BUILD.game.ateam):"Multi")+' — '+BUILD.legs.length+' leg'+(BUILD.legs.length>1?"s":"")+'</h3>'
      +BUILD.legs.map(l=>'<div class="tip"><div class="g">'+legText(l)+'</div><div class="meta">'+l.team+'</div></div>').join("")+'</div>'
      +'<div class="panel"><h3>Details</h3>'
      +'<div class="field"><label>Total odds</label><input id="f_odds" type="number" step="0.01" placeholder="e.g. 3.20"></div>'
      +'<div class="field"><label>Units</label><input id="f_units" type="number" step="0.5" placeholder="e.g. 1"></div>'
      +'<div class="field"><label>Bookmaker (placeholder)</label><select id="f_book"><option value="">—</option>'+bk+'</select></div>'
      +'<div class="field"><label>Post delay (minutes, 0 = now)</label><input id="f_delay" type="number" step="1" value="0"></div>'
      +'<div class="field"><label>Screenshot (optional)</label><input id="f_img" type="file" accept="image/*"><div id="f_img_prev" style="margin-top:8px"></div></div>'
      +'<button class="btn" id="schedbtn">Schedule tip →</button> <span id="scherr" class="err" style="margin-left:10px"></span></div>';
    $("bc").onclick=()=>{renderGame();};
    $("schedbtn").onclick=scheduleTip;
    const fi=$("f_img");
    if(fi)fi.onchange=async()=>{
      const prev=$("f_img_prev");const file=fi.files&&fi.files[0];
      if(!file){ BUILD.image=null; prev.innerHTML=""; return; }
      prev.innerHTML='<span style="color:var(--muted);font-size:12px">Compressing…</span>';
      try{ BUILD.image=await compressImage(file);
        prev.innerHTML='<img src="'+BUILD.image+'" style="max-height:120px;border-radius:8px;border:1px solid var(--line)"> <span style="color:var(--faint);font-size:12px">attached — the bot posts it with the tip</span>';
      }catch(e){ BUILD.image=null; prev.innerHTML='<span class="err" style="font-size:12px">Couldn\'t read that image.</span>'; }
    };
  }
  // Downscale + JPEG-compress client-side so only a small image ever travels.
  function compressImage(file,maxDim,quality){
    maxDim=maxDim||1600; quality=quality||0.7;
    return new Promise((res,rej)=>{
      const img=new Image(),url=URL.createObjectURL(file);
      img.onload=()=>{ URL.revokeObjectURL(url);
        let w=img.naturalWidth,h=img.naturalHeight; const sc=Math.min(1,maxDim/Math.max(w,h));
        w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(c.toDataURL("image/jpeg",quality)); }catch(e){ rej(e); } };
      img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("bad image")); };
      img.src=url;
    });
  }
  function scheduleTip(){
    const odds=parseFloat($("f_odds").value),units=parseFloat($("f_units").value);
    if(!(odds>1)){$("scherr").textContent="Odds must be greater than 1.";return;}
    if(!(units>0)){$("scherr").textContent="Units must be greater than 0.";return;}
    $("scherr").textContent="";
    NDCountdownConfirm.open({
      title:"Schedule this tip?",
      message:BUILD.legs.length+"-leg multi @ <b>"+odds+"</b> for <b>"+units+"u</b> — posts to Discord.",
      seconds:5,confirmLabel:"Schedule now",secondaryLabel:"Cancel",accent:"#5b8cff",
      onConfirm:()=>doSchedule(odds,units),
    });
  }
  async function doSchedule(odds,units){
    $("schedbtn").disabled=true;
    const payload={guild_id:BUILD.guildId,legs:BUILD.legs,odds,units,bookmaker:$("f_book").value,
      game_name:BUILD.game?teamName(BUILD.game.hteam)+" v "+teamName(BUILD.game.ateam):"",delay_minutes:parseInt($("f_delay").value||"0",10),
      image_b64:BUILD.image||""};
    try{const r=await api("/api/queue-tip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const j=await r.json();
      if(r.ok&&j.ok){ if(window.NDConfirmPop)NDConfirmPop.show({label:"Tip scheduled",color:"#2eaf62"}); BUILD.legs=[]; BUILD.image=null; $("tray").hidden=true; loadDetail(BUILD.guildId); }
      else{ $("scherr").textContent=j.message||"Couldn't schedule."; $("schedbtn").disabled=false; }
    }catch(e){ if(e.unauth)return renderLogin("Session expired."); $("scherr").textContent="Couldn't reach the bot."; $("schedbtn").disabled=false; }
  }
  function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}

  async function load(){
    const hash=new URLSearchParams(location.hash.slice(1));
    if(hash.get("error")){history.replaceState(null,"",location.pathname);return renderLogin(ERR[hash.get("error")]||"Login error.");}
    if(hash.get("token")){setToken(hash.get("token"));history.replaceState(null,"",location.pathname);}
    if(!getToken())return renderLogin();
    show("loading");
    try{const r=await api("/api/servers");if(!r.ok)return renderLogin();const data=await r.json();
      STATE.role=data.role;STATE.servers=data.servers||[];
      $("rolebadge").textContent=STATE.role==="owner"?"Owner":"Moderator";
      $("dd-viewas").style.display=STATE.role==="owner"?"":"none";
      buildViewAsMenu();show("app");enterHome();
    }catch(e){if(e.unauth)return renderLogin();renderLogin("Couldn't reach the bot — try again in a moment.");}
  }
  load();
</script>
</body>
