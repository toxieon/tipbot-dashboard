<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Master · Tipdash</title>
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://afl-tipster-bot.onrender.com" crossorigin>
<script src="../assets/tbtime.js"></script>
<script src="../assets/master-access.js"></script>
<script src="../assets/consensus-ui.js"></script>
<script src="../assets/slip-ui.js"></script>
<script src="../assets/tb-motion.js?v=0.48.1"></script>
<script>
(function(){
  try {
    var day=TBTime.dayKey(Date.now());
    var name=localStorage.getItem('tipbot_theme'),auto=localStorage.getItem('tipbot_theme_auto')==='true';
    var valid=['navy','day','ochre'].indexOf(name)!==-1;
    document.documentElement.dataset.theme=valid&&(!auto||localStorage.getItem('tipbot_theme_manual_date')===day)?name:auto?(TBTime.isDaytime(Date.now())?'day':'navy'):'navy';
  }catch(e){document.documentElement.dataset.theme='navy';}
}());
</script>
<style>
/* Existing theme tokens; visual redesign remains parked. */
:root,html[data-theme="navy"]{color-scheme:dark;--bg:#0b0f1a;--card:#151b2b;--card2:#1a2133;--line:#26304a;--txt:#eef2fa;--muted:#8a95ad;--faint:#8591ab;--accent:#5b8cff;--on-accent:#0b0f1a;--win:#2eaf62;--loss:#e5595f;--win-ink:#65d38f;--loss-ink:#ff9a9e;--warn:#e0a04a;--warn-ink:#f0bf79;--radius:16px}
html[data-theme="day"]{color-scheme:light;--bg:#f5f7fb;--card:#fff;--card2:#eef2f9;--line:#dbe2ee;--txt:#0f1726;--muted:#5a6577;--faint:#626d7f;--accent:#245ad6;--on-accent:#fff;--win:#2eaf62;--loss:#e5595f;--win-ink:#166536;--loss-ink:#a8252d;--warn:#c9861f;--warn-ink:#775018}
html[data-theme="ochre"]{color-scheme:dark;--bg:#17110c;--card:#241a10;--card2:#2c2015;--line:#4a3927;--txt:#f6efe6;--muted:#b7a892;--faint:#ae9b81;--accent:#e0a04a;--on-accent:#17110c;--win:#2eaf62;--loss:#e5595f;--win-ink:#65d38f;--loss-ink:#ff9a9e;--warn:#e0a04a;--warn-ink:#f0bf79}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* clip (not hidden) so the page is not a scroll container and fixed sheets stay on top. */
@supports (overflow:clip){html,body{overflow-x:clip}}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:16px 12px 48px}
.back{color:var(--muted);font-size:14px}
h1{margin:8px 0 2px;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);cursor:pointer;font-weight:650;font-size:14px}
.tab[aria-selected="true"]{color:var(--txt);border-bottom-color:var(--accent)}
.tab .soon{font-size:10px;color:var(--faint);margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:14px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.pill.on{border-color:var(--win);color:var(--win-ink)}
.pill.off{color:var(--faint)}
.pill.todo{border-style:dashed;color:var(--faint)}
.stat{font-size:22px;font-weight:800}
.stat-l{font-size:12px;color:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stats>div{background:var(--card2);border-radius:12px;padding:10px}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:20px;height:20px}
.note{font-size:12.5px;color:var(--faint);margin:8px 0 0}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
.cands{display:grid;gap:6px}
.cand{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.cand[aria-pressed="true"]{border-color:var(--accent)}
.cand:disabled{opacity:.55;cursor:default}
.cand .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .why{font-size:12px;color:var(--faint)}
.tag{font-size:10.5px;font-weight:800;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--muted)}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.check{display:grid;grid-template-columns:24px 1fr;gap:6px;background:var(--card2);border-radius:10px;padding:8px 10px}
.check .ic{font-size:15px}
.check .lb{font-weight:700;font-size:14px}
.check .lv{font-size:10.5px;color:var(--faint);margin-left:6px;text-transform:uppercase}
.check .dt{font-size:12.5px;color:var(--muted)}
.check .fx{font-size:12.5px;color:var(--warn-ink)}
.check[data-state="fail"]{box-shadow:inset 3px 0 0 var(--loss)}
.check[data-state="warn"]{box-shadow:inset 3px 0 0 var(--warn)}
.check[data-state="pass"]{box-shadow:inset 3px 0 0 var(--win)}
.banner{margin-top:12px;padding:9px 12px;border-radius:12px;font-size:13px;border:1px solid var(--line);background:var(--card2);color:var(--muted)}
.banner.err{border-color:var(--loss);color:var(--loss-ink)}
.banner.ok{border-color:var(--win);color:var(--win-ink)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.access-actions{margin-top:12px}
.access-form{display:grid;gap:12px}
.access-form label{display:grid;gap:4px}
.access-form .switch{display:flex}
.access-form input:not([type=checkbox]),select,#event-name{width:100%;min-width:0;padding:9px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;font:inherit}
.access-table{overflow-x:auto;margin-top:16px}
.access-table table{width:100%;border-collapse:collapse;font-size:13px}
.access-table th,.access-table td{padding:8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.access-diff{padding:8px 0;border-bottom:1px solid var(--line)}
.access-diff summary{cursor:pointer;overflow-wrap:anywhere}
.access-diff pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
@media(max-width:560px){.access-table thead{display:none}.access-table tr{display:block;padding:12px 0;border-bottom:1px solid var(--line)}.access-table td{display:block;border:0;padding:4px 0}.access-table code{white-space:nowrap}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← Tipdash</a>
  <h1>Master server</h1>
  <p class="sub">Owner only · BETA · every switch here is off by default</p>
  <div id="app"><div class="empty">Loading…</div></div>
</main>
<script>
(function(){
  "use strict";
  var API=(function(){
    var d="https://afl-tipster-bot.onrender.com";
    try{var q=new URLSearchParams(location.search).get("api");if(q&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname))return q.replace(/\/$/,"");}catch(e){}
    return d;
  })();
  var $=function(id){return document.getElementById(id);};
  var S={tab:"overview",cfg:null,cands:null,picked:null,report:null,msg:null,busy:false,fwd:null};
  var TABS=[["overview","Overview",""],["master","Master server",""],["lockdown","Lockdown & access",""],["forwarding","Forwarding",""],["consensus","Consensus",""],["audit","Audit log",""]];
  var access=MasterAccess.create({call:call,paint:paint,config:function(){return S.cfg||{};}});
  var slip=SlipUI.create({call:call,paint:function(){if(S.tab==="overview")paint();}});
  var cons=ConsensusUI.create({call:call,paint:function(){paint();},when:function(t){try{return TBTime.fmtWhen(t);}catch(e){return t;}}});
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  // Action sheet when tb-motion.js loaded; native confirm if that script failed.
  function tbConfirm(o){
    o=o||{};
    if(window.TBSheet && typeof window.TBSheet.confirm==="function") return window.TBSheet.confirm(o);
    var msg=String(o.title||"Are you sure?")+(o.message?"\n\n"+o.message:"");
    var ok=false;
    try{ ok=typeof window.confirm==="function" && window.confirm(msg); }catch(e){}
    return Promise.resolve(!!ok);
  }
  function token(){try{return localStorage.getItem("tipbot_token");}catch(e){return null;}}
  async function call(path,body,method){
    var opt={headers:{Authorization:"Bearer "+token()},cache:"no-store"};
    if(body!==undefined){opt.method=method||"POST";opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body);}
    try {
    var r=await fetch(API+path,opt);
    var j=await r.json().catch(function(){return {};});
    j._status=r.status;return j;
    } catch(e) { return {ok:false,error:"Could not reach TipBot. Please retry."}; }
  }
  async function load(){
    if(!token())return render('<div class="card empty"><b>Sign in first.</b><p><a class="btn" href="../">Open Tipdash</a></p></div>');
    try{
      var c=await call("/api/master/config");
      if(c._status===403)return render('<div class="card empty"><b>Owner only.</b></div>');
      if(c._status===401)return render('<div class="card empty"><b>Session expired.</b> <a href="../">Sign in again</a>.</div>');
      if(c._status===404)return render('<div class="card empty">This needs TipBot\'s latest deploy.</div>');
      S.cfg=c;paint();
      if(c.built&&c.built.consensus)cons.load();
      slip.load();
    }catch(e){render('<div class="card empty">Couldn\'t reach TipBot (it may be waking up). Refresh in a moment.</div>');}
  }
  function render(h){$("app").innerHTML=h;}
  function tabs(){
    return '<div class="tabs" role="tablist">'+TABS.map(function(t){return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+esc(t[1])+(t[2]?'<span class="soon">'+esc(t[2]==="later"?"later":"phase "+t[2])+'</span>':'')+'</button>';}).join("")+'</div>';
  }
  function pill(label,on,todo){return '<span class="pill '+(todo?"todo":(on?"on":"off"))+'">'+esc(label)+': '+(todo?"not built yet":(on?"on":"off"))+'</span>';}
  function overview(){
    var c=(S.cfg&&S.cfg.config)||{}, b=(S.cfg&&S.cfg.built)||{};
    return '<section class="card"><h2>Beta</h2><label class="switch"><input type="checkbox" id="beta"'+(c.beta_enabled?" checked":"")+(S.cfg.kill_switch_env?" disabled":"")+'> Master beta on</label>'
      +'<p class="note">Off = TipBot behaves exactly as today. On = the master picked below replaces the old MASTER_GUILD_ID setting and the old mirror posts stop (forwarding replaces them once you switch it on).'+(S.cfg.kill_switch_env?' <b>MASTER_BETA_DISABLE is set on TipBot, so everything is forced off.</b>':'')+'</p></section>'
      +'<section class="card"><h2>Status</h2><div class="pills">'+pill("Master chosen",!!c.master_guild_id)+pill("Lockdown",c.lockdown_enabled,!b.lockdown)+pill("Forwarding",c.forwarding_enabled,!b.forwarding)+pill("Consensus",!!(cons.state().data&&cons.state().data.settings.enabled&&!cons.state().data.settings.dry_run),!b.consensus)+'</div>'
      +'<div class="stats" style="margin-top:12px"><div><div class="stat">'+esc(S.cfg.sources)+'</div><div class="stat-l">servers TipBot is in</div></div>'
      +'<div><div class="stat">'+esc(c.master_guild_id?"Set":"None")+'</div><div class="stat-l">master server'+(c.verified_at?" · verified "+esc(TBTime.fmtWhen(c.verified_at)):"")+'</div></div></div></section>'
      +(S.msg?'<div class="banner '+S.msg.cls+'">'+esc(S.msg.text)+'</div>':'')
      +slip.view();
  }
  function checks(rep){
    if(!rep)return "";
    return '<ul class="checks">'+rep.items.map(function(i){
      var st=i.ok?"pass":(i.level==="required"?"fail":(i.level==="warn"?"warn":"info"));
      var ic=i.ok?"✅":(i.level==="required"?"❌":(i.level==="warn"?"⚠️":"ℹ️"));
      return '<li class="check" data-state="'+st+'"><span class="ic" aria-hidden="true">'+ic+'</span><div><div class="lb">'+esc(i.label)+'<span class="lv">'+esc(i.level)+'</span></div>'
        +(i.detail?'<div class="dt">'+esc(i.detail)+'</div>':'')+(!i.ok&&i.fix?'<div class="fx">'+esc(i.fix)+'</div>':'')+'</div></li>';
    }).join("")+'</ul>';
  }
  function master(){
    var c=(S.cfg&&S.cfg.config)||{};
    var list=S.cands===null?'<div class="empty">Loading servers…</div>':(!S.cands.length?'<div class="empty">TipBot isn\'t in any server you own. Create an empty server, invite TipBot, then refresh.</div>':
      '<div class="cands">'+S.cands.map(function(g){
        return '<button type="button" class="cand" data-g="'+esc(g.guild_id)+'" aria-pressed="'+(S.picked===g.guild_id)+'"'+(g.eligible||g.current?"":" disabled")+'><span class="nm">'+esc(g.name)+'</span>'
          +(g.current?'<span class="tag">CURRENT</span>':'')+(g.legacy_master?'<span class="tag">OLD MASTER</span>':'')+(g.reason?'<span class="why">'+esc(g.reason)+'</span>':'')+'</button>';
      }).join("")+'</div>');
    var rep=S.report&&S.report.guild_id===S.picked?S.report:null;
    return '<section class="card"><h2>1 · Pick a server</h2>'+list+'<p class="note">Only servers you own and that have no tips can be the master.</p></section>'
      +'<section class="card"><h2>2 · Verify</h2><div class="row"><button class="btn ghost" id="verify"'+(S.picked&&!S.busy?"":" disabled")+'>'+(S.busy?"Checking…":"Run verification")+'</button>'
      +'<button class="btn" id="setmaster"'+(rep&&rep.ok&&!S.busy?"":" disabled")+'>Set as master</button></div>'
      +(rep?checks(rep):'<p class="note">Checks ownership, bot permissions, role order, Administrator roles, members, channel headroom and invites.</p>')
      +(c.master_guild_id?'<p class="note">Changing the master later keeps the old one\'s channels (nothing is deleted).</p>':'')+'</section>'
      +(S.msg?'<div class="banner '+S.msg.cls+'">'+esc(S.msg.text)+'</div>':'');
  }
  function later(which){
    var t={lockdown:"Lock every master channel to you + TipBot + whitelisted users, auto-repair drift, alert on unknown joins.",
           consensus:"Spot the same bets across servers and post a consensus bet.",audit:"Searchable master event log."}[which];
    return '<section class="card empty"><b>Not built yet.</b><p>'+esc(t)+'</p><p class="note">See REMAINING.md for the plan and cost.</p></section>';
  }
  // ── Forwarding (1C) ─────────────────────────────────────────────────────
  function when(ts){try{return ts?TBTime.fmtWhen(ts):"never";}catch(e){return esc(ts||"never");}}
  function forwarding(){
    var f=S.fwd;
    if(f===null)return '<section class="card empty">Loading forwarding status…</section>';
    if(f.missing)return '<section class="card empty"><b>Forwarding status isn\'t available.</b><p>'+esc(f.missing)+'</p><p><button class="btn ghost" id="fwd-refresh">Retry</button></p></section>';
    var c=f.config||{}, n=f.counts||{}, blocked=c.kill_switch||!c.beta_enabled||!c.master_guild_id||!c.verified;
    var why=c.kill_switch?"MASTER_BETA_DISABLE is set on TipBot, so forwarding is forced off.":(!c.beta_enabled?"Turn the master beta on first.":(!c.verified?"Pick and verify a master first.":""));
    var h='<section class="card"><h2>Global</h2>'
      +'<label class="switch"><input type="checkbox" id="fwd-on"'+(c.forwarding_enabled?" checked":"")+(blocked||S.busy?" disabled":"")+'> Forwarding on</label>'
      +'<label class="switch" style="margin-top:8px"><input type="checkbox" id="fwd-pause"'+(c.forwarding_paused?" checked":"")+(blocked||S.busy?" disabled":"")+'> Paused (queue only, nothing is sent)</label>'
      +'<p class="note">'+(why?'<b>'+esc(why)+'</b> ':'')+'Only tips posted after forwarding (and the server below) are switched on are forwarded. Nothing older is back-filled.'
      +(c.forwarding_enabled_at?' Last switched on '+esc(when(c.forwarding_enabled_at))+'.':'')+'</p></section>';
    h+='<section class="card"><h2>Status</h2><div class="stats">'
      +[["posted","forwarded"],["queued","queued"],["failed","retrying"],["dead","gave up"]].map(function(k){return '<div><div class="stat">'+esc(n[k[0]]||0)+'</div><div class="stat-l">'+esc(k[1])+'</div></div>';}).join("")
      +'<div><div class="stat">'+esc(f.queue_depth||0)+'</div><div class="stat-l">queue depth</div></div>'
      +'<div><div class="stat">'+esc(f.duplicates_found||0)+'</div><div class="stat-l">duplicates found</div></div></div>'
      +(f.last_error&&f.last_error.last_error?'<p class="note">Last error'+(f.last_error.source_tip_id?' ('+esc(f.last_error.source_tip_id)+')':'')+': '+esc(f.last_error.last_error)+'</p>':'')
      +'<p class="note"><button class="btn ghost" id="fwd-refresh">Refresh</button></p></section>';
    var src=f.sources||[];
    h+='<section class="card"><h2>Servers</h2>'+(!src.length?'<div class="empty">No mirror channels yet. They appear once the master server is set and the mirror has run.</div>':
      '<div class="access-table"><table><thead><tr><th>Server</th><th>Channel</th><th>State</th><th>Forward</th><th>Last forward</th><th>Posted / queued</th></tr></thead><tbody>'
      +src.map(function(r){
        var active=r.status==="active", cn=r.counts||{};
        return '<tr><td>'+esc(r.name||r.source_guild_id)+'</td><td><code>#'+esc(r.channel_name||"?")+'</code></td>'
          +'<td>'+(active?"Active":"No Longer Active")+'</td>'
          +'<td><label class="switch"><input type="checkbox" class="fwd-src" data-src="'+esc(r.source_guild_id)+'"'+(r.forward_enabled?" checked":"")+(S.busy||c.kill_switch?" disabled":"")+'> '+(r.forward_enabled?"on":"off")+'</label></td>'
          +'<td>'+esc(when(r.last_forward_at))+'</td><td>'+esc((cn.posted||0)+" / "+((cn.queued||0)+(cn.failed||0)))+'</td></tr>';
      }).join("")+'</tbody></table></div>')
      +'<p class="note">Turning a server on forwards its new tips into its mirror channel. Servers under No Longer Active never get posts or edits; their queue catches up if they come back.</p></section>';
    return h+(S.msg?'<div class="banner '+S.msg.cls+'">'+esc(S.msg.text)+'</div>':'');
  }
  async function loadFwd(){
    var r=await call("/api/master/forward/status");
    if(r._status===404)S.fwd={missing:"This needs TipBot's latest deploy."};
    else if(!r.ok)S.fwd={missing:r.error==="bot_not_ready"?"TipBot is still starting. Retry in a few seconds.":(r.error||"Couldn't load forwarding status.")};
    else S.fwd=r;
    if(S.tab==="forwarding")paint();
  }
  async function saveFwd(body,label){
    S.busy=true;S.msg=null;paint();
    var r=await call(body.source_guild_id?"/api/master/forward/source":"/api/master/config",body);
    S.busy=false;
    S.msg=r.ok?{cls:"ok",text:label}:{cls:"err",text:r._status===404?"This needs TipBot's latest deploy.":(r.error||"Couldn't save")};
    if(r.ok&&r.config&&S.cfg)S.cfg.config=r.config;
    await loadFwd();paint();
  }
  function bindFwd(){
    var rf=$("fwd-refresh"); if(rf)rf.onclick=function(){S.fwd=null;S.msg=null;paint();loadFwd();};
    var on=$("fwd-on"); if(on)on.onchange=async function(){
      if(!(await tbConfirm({title:"Turn forwarding "+(on.checked?"on":"off")+"?",
        message:on.checked?"Tips from servers switched on below will be posted into their mirror channels.":"Nothing more is forwarded until you turn it back on.",
        confirmLabel:on.checked?"Turn on":"Turn off", destructive:!on.checked}))){paint();return;}
      saveFwd({forwarding_enabled:on.checked},"Forwarding "+(on.checked?"on":"off")+".");
    };
    var pz=$("fwd-pause"); if(pz)pz.onchange=function(){
      saveFwd({forwarding_paused:pz.checked},pz.checked?"Paused: changes queue up, nothing is sent.":"Resumed: queued changes will send now.");
    };
    document.querySelectorAll(".fwd-src").forEach(function(b){b.onchange=async function(){
      if(!(await tbConfirm({title:"Turn forwarding "+(b.checked?"on":"off")+" for this server?",confirmLabel:b.checked?"Turn on":"Turn off"}))){paint();return;}
      saveFwd({source_guild_id:b.dataset.src,enabled:b.checked},"Server forwarding "+(b.checked?"on":"off")+".");
    };});
  }
  function paint(){
    var body=S.tab==="overview"?overview():(S.tab==="master"?master():S.tab==="lockdown"?access.lockdown():S.tab==="audit"?access.audit():S.tab==="forwarding"?forwarding():S.tab==="consensus"?cons.view():later(S.tab));
    render(tabs()+body);
    document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;S.msg=null;if(S.tab==="master"&&S.cands===null)loadCands();if(S.tab==="forwarding"){S.fwd=null;loadFwd();}if(S.tab==="consensus"&&!cons.state().data)cons.load();paint();access.enter(S.tab);};});
    access.bind(S.tab);
    if(S.tab==="forwarding")bindFwd();
    if(S.tab==="consensus")cons.bind();
    if(S.tab==="overview")slip.bind();
    var beta=$("beta"); if(beta)beta.onchange=async function(){
      if(!(await tbConfirm({title:"Turn master beta "+(beta.checked?"on":"off")+"?",message:"This changes master behaviour; existing Discord permissions stay in place.",confirmLabel:beta.checked?"Turn on":"Turn off"}))){paint();return;}
      beta.disabled=true;
      var r=await call("/api/master/config",{beta_enabled:beta.checked});
      S.msg=r.ok?{cls:"ok",text:"Beta "+(beta.checked?"on":"off")+"."}:{cls:"err",text:r.error||"Couldn't save"};
      if(r.ok)S.cfg.config=r.config;paint();
    };
    document.querySelectorAll(".cand").forEach(function(b){b.onclick=function(){S.picked=b.dataset.g;S.msg=null;paint();};});
    var v=$("verify"); if(v)v.onclick=async function(){
      S.busy=true;S.msg=null;paint();
      var r=await call("/api/master/verify",{guild_id:S.picked});
      S.busy=false;
      if(r.ok){S.report=r.report;S.msg=r.report.ok?{cls:"ok",text:"All required checks passed."}:{cls:"err",text:"Fix the ❌ items, then run it again."};}
      else S.msg={cls:"err",text:r.error==="bot_not_ready"?"TipBot is still starting. Try again in a few seconds.":(r.error||"Verification failed")};
      paint();
    };
    var sm=$("setmaster"); if(sm)sm.onclick=async function(){
      if(!(await tbConfirm({title:"Set this server as the master?",message:"TipBot re-checks it, then creates a locked 'TipBot Master Control' category with #master-audit and #master-alerts.",confirmLabel:"Set as master"})))return;
      S.busy=true;paint();
      var r=await call("/api/master/config",{master_guild_id:S.picked});
      S.busy=false;
      if(r.ok){S.cfg.config=r.config;S.msg={cls:"ok",text:"Master set."+(r.control&&!r.control.ok?" (Control channels failed: "+(r.control.error||"")+")":"")};S.cands=null;loadCands();}
      else{if(r.report)S.report=r.report;S.msg={cls:"err",text:r.error==="verification_failed"?"Re-check failed; see the list.":(r.error||"Couldn't save")};}
      paint();
    };
  }
  async function loadCands(){
    var r=await call("/api/master/candidates");
    S.cands=r.ok?r.candidates:[];
    if(!r.ok)S.msg={cls:"err",text:r.error==="bot_not_ready"?"TipBot is still starting. Refresh in a few seconds.":(r.error||"Couldn't load servers")};
    var cur=(S.cands||[]).find(function(g){return g.current;})||(S.cands||[]).find(function(g){return g.eligible&&g.legacy_master;});
    if(!S.picked&&cur)S.picked=cur.guild_id;
    if(S.tab==="master")paint();
  }
  load();
})();
</script>
</body>
</html>
