<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brownlow Predictor · Tipdash</title>
<meta name="description" content="Umpire-style 3-2-1 Brownlow votes for AFL matches.">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23c9a227'/><text x='32' y='40' text-anchor='middle' font-size='28' font-family='system-ui' font-weight='900' fill='%231a1406'>3</text></svg>">
</head>
<body>
<div class="app" id="app"></div>
<script>
const API = "https://afl-tipster-bot.onrender.com";

const state = {
  user: null,
  apiNote: "",
  tab: "vote",
  year: null,
  rounds: [],
  round: null,
  matches: [],
  matchesLoading: false,
  matchId: null,
  matchMeta: null,
  squads: null,
  squadsLoading: false,
  votes: { 3: null, 2: null, 1: null },
  myVotes: [],
  playerNames: {},
  leaderboard: [],
  leaderboardStub: false,
  toast: null,
  booting: true,
  submitting: false,
};

function getToken(){ try{ return localStorage.getItem("tipbot_token"); }catch(e){ return null; } }
function setToken(t){ try{ localStorage.setItem("tipbot_token", t); }catch(e){} }
function clearToken(){ try{ localStorage.removeItem("tipbot_token"); }catch(e){} }

(function absorbHash(){
  const hash = new URLSearchParams(location.hash.slice(1));
  const t = hash.get("token");
  if(t){ setToken(t); history.replaceState(null, "", location.pathname + location.search); }
})();

async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: "Bearer " + getToken() }, opts.headers || {});
  const r = await fetch(API + path, opts);
  if(r.status === 401){ clearToken(); throw { unauth: true }; }
  return r;
}

const $ = (s, el=document) => el.querySelector(s);
const app = () => $("#app");
function esc(s) {
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function escAttr(s){ return esc(s); }
function toast(msg) {
  state.toast = msg; render();
  setTimeout(() => { state.toast = null; render(); }, 2200);
}
function rememberPlayers(squads){
  if(!squads) return;
  for(const side of ["home","away"]){
    const t = squads[side];
    if(!t || !Array.isArray(t.players)) continue;
    for(const p of t.players){
      if(p && p.id) state.playerNames[String(p.id)] = p.name || String(p.id);
    }
  }
}
function playerLabel(id){
  if(id==null) return "—";
  const s = String(id);
  return state.playerNames[s] || s;
}
function findMatch(id){
  return (state.matches||[]).find(m => String(m.id)===String(id)) || state.matchMeta || null;
}

async function loadRounds(){
  const r = await api("/api/brownlow/rounds");
  if(!r.ok) throw new Error("rounds "+r.status);
  const data = await r.json();
  state.year = data.year;
  state.rounds = Array.isArray(data.rounds) ? data.rounds : [];
  if(!state.round && state.rounds.length){
    const preferred = [...state.rounds].reverse().find(x => x.done) || state.rounds[state.rounds.length-1];
    state.round = preferred ? String(preferred.id) : String(state.rounds[0].id);
  }
}

async function loadMatches(roundId){
  const rid = String(roundId||"");
  if(!rid){ state.matches = []; return; }
  state.matchesLoading = true; render();
  try{
    const r = await api("/api/brownlow/rounds/"+encodeURIComponent(rid)+"/matches");
    if(!r.ok) throw new Error("matches "+r.status);
    const data = await r.json();
    state.matches = Array.isArray(data.matches) ? data.matches : [];
  } finally {
    state.matchesLoading = false;
  }
}

async function loadSquads(matchId){
  state.squadsLoading = true; state.squads = null; render();
  try{
    const r = await api("/api/brownlow/matches/"+encodeURIComponent(matchId)+"/squads");
    if(!r.ok) throw new Error("squads "+r.status);
    const data = await r.json();
    state.squads = data;
    rememberPlayers(data);
  } finally {
    state.squadsLoading = false;
  }
}

async function loadMeVotes(){
  const r = await api("/api/brownlow/me/votes");
  if(!r.ok) throw new Error("me/votes "+r.status);
  const data = await r.json();
  state.myVotes = Array.isArray(data.votes) ? data.votes : [];
  const voted = new Set(state.myVotes.map(v => String(v.match_id)));
  for(const m of state.matches){
    if(voted.has(String(m.id))) m.voted = true;
  }
}

async function loadLeaderboard(){
  const q = state.year ? ("?year="+encodeURIComponent(state.year)) : "";
  const r = await api("/api/brownlow/leaderboard"+q);
  if(!r.ok) throw new Error("leaderboard "+r.status);
  const data = await r.json();
  state.leaderboard = Array.isArray(data.leaders) ? data.leaders : [];
  state.leaderboardStub = !!data.stub;
}

async function boot(){
  state.booting = true; render();
  if(!getToken()){ state.booting = false; state.user = null; render(); return; }
  try{
    const r = await api("/api/me");
    if(!r.ok){ clearToken(); state.user = null; state.booting = false; render(); return; }
    state.user = await r.json();
    await loadRounds();
    if(state.round) await loadMatches(state.round);
    try{ await loadMeVotes(); }catch(e){}
    state.apiNote = state.year ? ("Season "+state.year+" · live TipBot Brownlow API") : "Live TipBot Brownlow API";
  }catch(e){
    if(e && e.unauth){ state.user = null; }
    else {
      state.user = null;
      state.apiNote = "Couldn't reach TipBot Brownlow API (is Render on #19 yet?)";
    }
  }
  state.booting = false; render();
}

function render() {
  if (state.booting) {
    app().innerHTML = `<div class="gate"><div><div class="medal">3</div><h1>Brownlow</h1><p>Checking Tipdash session…</p></div></div>`;
    return;
  }
  if (!state.user) return renderGate(state.apiNote && state.apiNote.indexOf("Couldn't")===0 ? state.apiNote : null);
  if (state.matchId) return renderMatch();
  if (state.tab === "board") return renderBoard();
  if (state.tab === "mine") return renderMine();
  return renderHome();
}

function shell(body, { showNav = true } = {}) {
  app().innerHTML = `
    <header class="top">
      <div class="brand"><div class="medal">3</div><div>Brownlow<small>Tipdash predictor</small></div></div>
      ${showNav ? `<nav class="nav">
        <button type="button" data-tab="vote" class="${state.tab==="vote"?"on":""}">Vote</button>
        <button type="button" data-tab="mine" class="${state.tab==="mine"?"on":""}">My votes</button>
        <button type="button" data-tab="board" class="${state.tab==="board"?"on":""}">Board</button>
      </nav>` : ""}
    </header>
    ${body}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ""}
  `;
  app().querySelectorAll("[data-tab]").forEach(b => b.onclick = async () => {
    state.tab = b.dataset.tab; state.matchId = null;
    if(state.tab==="mine"){
      try{ await loadMeVotes(); }catch(e){ if(e&&e.unauth) return renderGate("Session expired."); }
    }
    if(state.tab==="board"){
      try{ await loadLeaderboard(); }catch(e){ if(e&&e.unauth) return renderGate("Session expired."); }
    }
    render();
  });
}

function renderGate(msg) {
  app().innerHTML = `
    <div class="gate"><div>
      <div class="medal">3</div>
      <h1>Brownlow Predictor</h1>
      <p>Cast umpire-style <strong>3–2–1</strong> votes on players from games that have finished. Same Discord login as Tipdash.</p>
      ${msg ? `<p class="hint" style="color:var(--loss)">${esc(msg)}</p>` : ""}
      <a class="btn" href="${API}/auth/login?return_to=${encodeURIComponent("/brownlow")}">Log in with Discord</a>
      <p class="hint" style="margin-top:16px">Already on Tipdash? Session is shared via <code>tipbot_token</code> — refresh after logging in there.</p>
      <p style="margin-top:12px"><a class="btn ghost" href="/">← Tipdash</a></p>
    </div></div>`;
}

function renderHome() {
  const list = state.matches || [];
  const body = `
    <p class="hint">${esc(state.apiNote || "")}</p>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
      <span class="hint" style="margin:0">Signed in${state.user.role ? " · "+esc(state.user.role) : ""}</span>
      <span>
        <button type="button" class="btn ghost" id="out" style="padding:7px 12px;font-size:12px">Log out</button>
        <a class="btn ghost" href="/" style="padding:7px 12px;font-size:12px">Tipdash</a>
      </span>
    </div>
    <p class="hint">Vote on completed matches only. Three different players — 3, 2, then 1.</p>
    <div class="rounds" id="rounds">
      ${(state.rounds||[]).map(r => `<button type="button" class="chip ${String(state.round)===String(r.id)?"on":""}" data-r="${escAttr(r.id)}">${esc(r.label||r.round_name||("R"+r.id))}</button>`).join("")}
    </div>
    <section class="section">
      <h2>Matches played</h2>
      ${state.matchesLoading ? `<div class="empty"><strong>Loading matches…</strong></div>` :
        list.length ? list.map(m => `
        <article class="mcard" data-m="${escAttr(m.id)}">
          <div class="meta">${esc(m.when||"")} · ${esc(m.venue||"")}</div>
          <div class="teams"><span>${esc(m.home)}</span><span class="score">${esc(m.score||"—")}</span><span style="text-align:right">${esc(m.away)}</span></div>
          <div class="status ${m.voted ? "voted":""}">
            <span class="dot"></span>
            ${m.voted ? "Votes submitted" : "Ready to vote"}
          </div>
        </article>`).join("") : `<div class="empty"><strong>No completed matches yet</strong>Check back after this round’s games finish.</div>`}
    </section>`;
  shell(body);
  $("#out").onclick = () => { clearToken(); state.user = null; render(); };
  $("#rounds").onclick = async e => {
    const b = e.target.closest("[data-r]"); if (!b) return;
    state.round = b.dataset.r; state.matchId = null;
    try{ await loadMatches(state.round); await loadMeVotes(); }
    catch(err){ if(err&&err.unauth) return renderGate("Session expired."); toast("Couldn't load matches."); }
    render();
  };
  app().querySelectorAll("[data-m]").forEach(el => el.onclick = async () => {
    state.matchId = el.dataset.m;
    state.matchMeta = findMatch(state.matchId);
    state.votes = {3:null,2:null,1:null};
    try{ await loadSquads(state.matchId); }
    catch(err){
      if(err&&err.unauth) return renderGate("Session expired.");
      state.matchId = null; toast("Couldn't load squads.");
    }
    render();
  });
}

function renderMatch() {
  const m = findMatch(state.matchId) || { id: state.matchId, home: "Home", away: "Away", score: "", venue: "", when: "" };
  if (state.squadsLoading || !state.squads) {
    const body = `
      <button type="button" class="back" id="back">← Matches</button>
      <div class="match-head">
        <h1>${esc(m.home)} <span style="color:var(--faint);font-weight:600">vs</span> ${esc(m.away)}</h1>
        <p>${esc(m.score||"")} · ${esc(m.venue||"")} · ${esc(m.when||"")}</p>
      </div>
      <div class="empty"><strong>Loading named sides…</strong></div>`;
    shell(body, { showNav: false });
    $("#back").onclick = () => { state.matchId = null; state.squads = null; render(); };
    return;
  }
  const sq = state.squads;
  const v = state.votes;
  const taken = new Set([v[3]?.id, v[2]?.id, v[1]?.id].filter(Boolean));
  const ready = v[3] && v[2] && v[1];

  function teamHtml(side) {
    const t = sq[side] || { name: side, players: [] };
    const players = Array.isArray(t.players) ? t.players : [];
    return `<div class="team-block"><h3>${esc(t.name||side)} <span>${players.length} named</span></h3>
      ${players.map(p => {
        const id = String(p.id||"");
        const n = p.number!=null ? p.number : (p.n!=null ? p.n : "");
        const on = v[3]?.id===id ? 3 : v[2]?.id===id ? 2 : v[1]?.id===id ? 1 : 0;
        return `<div class="prow ${taken.has(id)&&!on?"taken":""}">
          <div class="num">${esc(n)}</div>
          <div class="name">${esc(p.name||id)}</div>
          <div class="votes">
            <button type="button" class="${on===3?"on-3":""}" data-pts="3" data-id="${escAttr(id)}" data-name="${escAttr(p.name||id)}" data-n="${escAttr(n)}" data-team="${escAttr(t.name||"")}">3</button>
            <button type="button" class="${on===2?"on-2":""}" data-pts="2" data-id="${escAttr(id)}" data-name="${escAttr(p.name||id)}" data-n="${escAttr(n)}" data-team="${escAttr(t.name||"")}">2</button>
            <button type="button" class="${on===1?"on-1":""}" data-pts="1" data-id="${escAttr(id)}" data-name="${escAttr(p.name||id)}" data-n="${escAttr(n)}" data-team="${escAttr(t.name||"")}">1</button>
          </div>
        </div>`;
      }).join("")}</div>`;
  }
  const slot = (pts) => {
    const p = v[pts];
    return `<div class="slot ${p?"filled":""}">
      <div class="pts">${pts} votes</div>
      <div class="who">${p ? esc(p.name) : "—"}</div>
      ${p ? `<button type="button" class="clr" data-clr="${pts}">Clear</button>` : ""}
    </div>`;
  };
  const body = `
    <button type="button" class="back" id="back">← Matches</button>
    <div class="match-head">
      <h1>${esc(m.home)} <span style="color:var(--faint);font-weight:600">vs</span> ${esc(m.away)}</h1>
      <p>${esc(m.score||"")} · ${esc(m.venue||"")} · ${esc(m.when||"")}</p>
    </div>
    <div class="vote-bar">${slot(3)}${slot(2)}${slot(1)}</div>
    <p class="hint">Tap 3, 2, or 1 beside a player. Same player can’t take two slots.</p>
    ${teamHtml("home")}
    ${teamHtml("away")}
    <div class="submit-dock"><div class="inner">
      <button class="btn block" type="button" id="submit" ${ready && !state.submitting?"":"disabled"}>${state.submitting?"Submitting…":"Submit 3–2–1 ballot"}</button>
    </div></div>`;
  shell(body, { showNav: false });
  $("#back").onclick = () => { state.matchId = null; state.squads = null; render(); };
  app().querySelectorAll("[data-clr]").forEach(b => b.onclick = e => {
    e.stopPropagation(); state.votes[b.dataset.clr] = null; render();
  });
  app().querySelectorAll(".votes button").forEach(b => b.onclick = () => {
    const pts = +b.dataset.pts;
    const player = { id: b.dataset.id, name: b.dataset.name, n: b.dataset.n, team: b.dataset.team };
    for (const k of [3,2,1]) if (state.votes[k]?.id === player.id) state.votes[k] = null;
    state.votes[pts] = player;
    render();
  });
  $("#submit").onclick = async () => {
    if (!ready || state.submitting) return;
    state.submitting = true; render();
    try{
      const body = { first: v[3].id, second: v[2].id, third: v[1].id };
      const rr = await api("/api/brownlow/matches/"+encodeURIComponent(state.matchId)+"/votes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const j = await rr.json().catch(()=>({}));
      if(!rr.ok || j.ok===false){
        toast(j.message || j.error || ("Couldn't submit ("+rr.status+")"));
        return;
      }
      rememberPlayers(state.squads);
      try{ await loadMeVotes(); }catch(_){}
      const mm = findMatch(state.matchId); if (mm) mm.voted = true;
      state.matchId = null; state.squads = null; state.tab = "mine";
      toast("Ballot locked in — nice pick.");
    }catch(e){
      if(e&&e.unauth) return renderGate("Session expired.");
      toast("Couldn't reach TipBot.");
    }finally{
      state.submitting = false;
      render();
    }
  };
}

function renderMine() {
  const rows = state.myVotes || [];
  const body = `
    <section class="section">
      <h2>Your ballots</h2>
      ${rows.length ? rows.map(v => {
        const m = findMatch(v.match_id);
        const title = m ? (esc(m.home)+" vs "+esc(m.away)) : esc(String(v.match_id));
        const votes = [
          { pts:3, name: playerLabel(v.first) },
          { pts:2, name: playerLabel(v.second) },
          { pts:1, name: playerLabel(v.third) },
        ];
        return `<article class="vcard">
          <div class="mh">${title}${v.round ? ` <span class="hint">· R${esc(v.round)}</span>` : ""}</div>
          <div class="votes-list">${votes.map(x => `<div><span class="p">${x.pts}</span><span>${esc(x.name)}</span></div>`).join("")}</div>
        </article>`;
      }).join("") : `<div class="empty"><strong>No votes yet</strong>Open a finished match and cast your 3–2–1.</div>`}
    </section>`;
  shell(body);
}

function renderBoard() {
  const leaders = state.leaderboard || [];
  const body = `
    <p class="hint">${state.leaderboardStub ? "Community leaderboard stub — totals land once ballots aggregate." : "Community leaderboard (season 3–2–1 points)."}</p>
    <section class="section">
      <h2>Season leaders</h2>
      ${leaders.length ? leaders.map((r,i) => `
        <div class="lrow">
          <div class="rank ${i<3?"top":""}">${i+1}</div>
          <div class="who">${esc(r.name||r.player_id||"—")}</div>
          <div class="pts">${esc(r.pts)} pts</div>
        </div>`).join("") : `<div class="empty"><strong>No leaders yet</strong>Cast some ballots and check back.</div>`}
    </section>`;
  shell(body);
}

boot();
</script>
</body>
</html>
