name: apply post settings
on:
  push:
    branches:
      - cursor/connector-post-settings-2176
    paths:
      - .github/workflows/apply-post-settings.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/connector-post-settings-2176
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: gate
        run: |
          if [ -f .github/apply_post_settings.py ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble and bump
        if: steps.gate.outputs.run == '1'
        run: |
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          root = Path('.')
          parts = [root / '.github' / f'cp-part-{i}' for i in range(3)]
          text = ''.join(path.read_text(encoding='utf-8') for path in parts)
          digest = hashlib.sha256(text.encode('utf-8')).hexdigest()
          expect = 'bd9cb97c76f492b626cfa3e565c99797d7a2a69f71e80d4a50704cd05a8a815c'
          if digest != expect:
              raise SystemExit('connector-post hash ' + digest)
          (root / 'assets' / 'connector-post.js').write_text(text, encoding='utf-8')
          for path in parts:
              path.unlink()
          PY
          python3 .github/apply_post_settings.py
      - name: Commit the release tree
        if: steps.gate.outputs.run == '1'
        run: |
          rm -f .github/apply_post_settings.py .github/workflows/apply-post-settings.yml .github/post-settings-ready.txt
          git config user.name "cursor[bot]"
          git config user.email "41898282+cursor[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add post settings to the connector setup page."
          git push origin HEAD:cursor/connector-post-settings-2176
