name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node --test tests/*.test.js
      - name: Build public site
        run: node scripts/build-public.mjs
      - name: Publish dist
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLIC_SITE_DEPLOY_KEY: ${{ secrets.PUBLIC_SITE_DEPLOY_KEY }}
          TIPDASH_SCAN_ID_1: ${{ secrets.TIPDASH_SCAN_ID_1 }}
          TIPDASH_SCAN_TERMS: ${{ secrets.TIPDASH_SCAN_TERMS }}
        run: |
          set -euo pipefail
          node scripts/ci-public-guard.mjs
          test -n "$PUBLIC_SITE_DEPLOY_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$PUBLIC_SITE_DEPLOY_KEY" > ~/.ssh/tipdash_deploy_key
          chmod 600 ~/.ssh/tipdash_deploy_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tipdash_deploy_key -o IdentitiesOnly=yes"
          site="$(mktemp -d)"
          git clone --branch main git@github.com:toxieon/tipdashhq-site.git "$site"
          find "$site" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. "$site/"
          git -C "$site" config user.email "deploy@tipdashhq.com"
          git -C "$site" config user.name "tipdash deploy"
          git -C "$site" add -A
          if git -C "$site" diff --cached --quiet; then
            echo "tipdashhq-site already matches this dist"
            exit 0
          fi
          git -C "$site" commit -m "Publish tipdash $(cat VERSION)"
          git -C "$site" push origin main
