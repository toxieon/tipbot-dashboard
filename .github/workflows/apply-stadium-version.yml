name: apply stadium version
on:
  push:
    branches: [cursor/stadium-boards-b28f]
    paths:
      - scripts/stadium-b64/**
      - .github/workflows/apply-stadium-version.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/stadium-boards-b28f
      - name: Decode and apply
        run: |
          python3 - << 'PY'
          import base64, hashlib, pathlib
          parts = []
          for i in range(6):
              text = pathlib.Path(f"scripts/stadium-b64/part-{i:02d}.txt").read_text().strip()
              parts.append(text)
          data = base64.b64decode("".join(parts))
          digest = hashlib.sha256(data).hexdigest()
          expect = "c1bc80570f9b4f422c94f478b956e6c6dcee6e2ecf6ec6581046fd96c3797057"
          if digest != expect:
              raise SystemExit("script sha mismatch " + digest)
          pathlib.Path("/tmp/apply-stadium-0611.py").write_bytes(data)
          print("script ok", len(data))
          PY
          python3 /tmp/apply-stadium-0611.py
      - name: Commit applied files and remove the helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 404.html index.html compare/index.html live/board/index.html live/index.html master/index.html pricing/index.html t/index.html welcome/index.html CHANGELOG.md PUBLIC_CHANGELOG.md
          git rm -rf scripts/stadium-b64 .github/workflows/apply-stadium-version.yml
          git commit -m "0.61.1: stadium boards widget"
          git push
