name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TIPDASH_SCAN_ID_1: ${{ secrets.TIPDASH_SCAN_ID_1 }}
      TIPDASH_SCAN_TERMS: ${{ secrets.TIPDASH_SCAN_TERMS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: Public build guard
        run: node scripts/ci-public-guard.mjs
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Playwright smoke (390px, mocked API)
        run: npm run test:e2e
