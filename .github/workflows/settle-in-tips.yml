name: settle copy
on:
  push:
    branches: [cursor/connector-post-settings-2176]
    paths:
      - .github/workflows/settle-in-tips.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/connector-post-settings-2176
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: apply
        run: |
          python3 << 'PY'
          from pathlib import Path
          index = Path("index.html")
          text = index.read_text()
          old = 'message:"Followers will be notified and it will post to bet-results."'
          new = 'message:"Followers will be notified in the tips channel."'
          changed = False
          if old in text:
              index.write_text(text.replace(old, new, 1))
              changed = True
          elif new not in text:
              raise SystemExit("grade confirm anchor missing")
          clog_path = Path("CHANGELOG.md")
          clog = clog_path.read_text()
          bullet = "- Grading confirms the result updates in the tips channel.\n"
          needle = "- That section loads from an owner-only script. The public site build leaves it out.\n"
          if bullet not in clog:
              if needle not in clog:
                  raise SystemExit("changelog anchor missing")
              clog_path.write_text(clog.replace(needle, needle + bullet, 1))
              changed = True
          wf = Path(".github/workflows/settle-in-tips.yml")
          if wf.exists():
              wf.unlink()
              changed = True
          print("changed" if changed else "nothing to do")
          raise SystemExit(0 if changed else 0)
          PY
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard .github)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Say graded results update in the tips channel."
            git push origin HEAD:cursor/connector-post-settings-2176
          fi
