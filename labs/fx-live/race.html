<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Race FX demo</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #0f1419; color: #e8eaed; }
    body { margin: 0; padding: 16px; }
    h1 { font-size: 1rem; font-weight: 600; margin: 0 0 12px; }
    #stage {
      width: min(100%, 420px);
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      background: #1a2332;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    .row { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      font: inherit;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #3c4043;
      background: #292e35;
      color: inherit;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    a { color: #7cb8ff; font-size: 0.875rem; display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Race in progress</h1>
  <div id="stage" aria-live="polite"></div>
  <div class="row">
    <button type="button" id="restart">Restart</button>
    <button type="button" id="stop">Stop</button>
  </div>
  <a href="index.html">Back to lab</a>
  <script src="../../assets/fx/race-running.js"></script>
  <script>
    (function () {
      var runners = [
        { number: 1, colours: { primary: "#1e3a5f", secondary: "#f0e6d2" } },
        { number: 4, colours: { primary: "#8b2942", secondary: "#ffffff" } },
        { number: 7, colours: { primary: "#2d5a27", secondary: "#ffd54a" } },
        { number: 9, colours: { primary: "#4a3728", secondary: "#c9b896" } },
        { number: 12, colours: { primary: "#5c4033", secondary: "#e8dcc8" } },
        { number: 3, colours: { primary: "#6b2d5c", secondary: "#f5d0e8" } },
      ];
      var stage = document.getElementById("stage");
      function start() {
        TBLiveFx.stop();
        TBLiveFx.race(stage, runners);
      }
      document.getElementById("restart").addEventListener("click", start);
      document.getElementById("stop").addEventListener("click", function () { TBLiveFx.stop(); });
      start();
    })();
  </script>
</body>
</html>
