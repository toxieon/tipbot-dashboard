<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Stadium 3D viewer</title>
  <link rel="stylesheet" href="./gallery.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1218; }
    #canvas { display: block; width: 100%; height: 100%; }
    .viewer-ui {
      position: fixed; left: 0; right: 0; top: 0; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; color: #e8ecf4; font-family: system-ui, sans-serif;
    }
    .viewer-ui a { pointer-events: auto; color: #9ec5ff; text-decoration: none; font-size: 14px; }
    #venue-label { font-weight: 700; letter-spacing: .08em; }
    #status { font-size: 13px; color: #9aa3b5; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../../assets/stadiums/vendor/three.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div class="viewer-ui">
    <a href="./index.html">← Gallery</a>
    <span id="venue-label">…</span>
    <span id="status">Loading…</span>
  </div>
  <canvas id="canvas" aria-label="3D stadium preview"></canvas>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
